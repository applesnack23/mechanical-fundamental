&lt;h1 id=&quot;%EC%9D%B4%EB%B2%88-%EC%B1%95%ED%84%B0%EC%9D%98-%ED%95%B5%EC%8B%AC&quot;&gt;이번 챕터의 핵심&lt;/h1&gt;
&lt;ul&gt;
&lt;li&gt;3D 모델링과 2D CAD를 배우는 목적은 단순히 그림을 만드는 것이 아닙니다.&lt;/li&gt;
&lt;li&gt;최종적으로는 실제 제품을 제작하기 위한 정보를 만드는 것이 목적입니다.&lt;/li&gt;
&lt;li&gt;3D CAD에서는 제품의 형상과 조립 관계를 설계합니다.&lt;/li&gt;
&lt;/ul&gt;

# 레이저 커팅을 위한 작업

이제 우리는 3D 모델링과 2D CAD의 기본적인 사용 방법을 익혔습니다.

지금까지는 각각의 프로그램과 기능을 사용하는 방법을 중심으로 학습했다면, 이제부터는 실제 제품 제작과 연결되는 내용을 다뤄 보겠습니다.

이번 챕터에서는 크게 다음 세 가지 내용을 학습합니다.

1. Fusion의 3D 모델에서 2D 제작 도면 만들기
2. 2D CAD를 이용하여 레이저 커팅용 도면 만들기
3. 제작 방식에 맞게 기존 컨베이어 구조를 다시 설계하기

특히 이번 과정에서는 단순히 도면을 그리는 방법뿐만 아니라 같은 부품이라도 제작 방법에 따라 도면과 설계 방법이 어떻게 달라지는지를 함께 살펴봅니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 모델에서 제작 도면 만들기

![image.png](../assets/03-03-laser-cutting-workflow/asset-001.png)

앞에서 만든 컨베이어 부품 중에는 일반적인 판재 가공으로 제작할 수 있는 부품이 있습니다.

먼저 비교적 단순한 `PLATE_SUPPORT`와 같은 판 형상의 부품을 이용하여 3D 모델에서 2D 제작 도면을 만들어 보겠습니다.

Fusion에서는 이미 만들어진 3D 모델을 이용하여 비교적 쉽게 2D 도면을 생성할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 도면 생성

![image.png](../assets/03-03-laser-cutting-workflow/asset-002.png)

도면으로 만들 부품을 선택한 뒤 다음 메뉴를 사용합니다.

디자인 → 도면 → 설계에서

도면 작성 화면이 나타나면 먼저 용지 크기와 기본 설정을 선택합니다.

실무에서는 제품의 크기와 회사의 도면 규격에 따라 A4, A3, A2 등 다양한 용지를 사용할 수 있습니다.

일반적인 기계 부품 도면에서는 A3도 많이 사용하지만, 직접 프린터로 출력하여 확인하려면 사용할 수 있는 프린터의 용지 크기를 고려하여 선택하면 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기준 뷰

![image.png](../assets/03-03-laser-cutting-workflow/asset-003.png)

도면을 만들면 가장 먼저 기준 뷰(Base View)를 배치합니다.

기준 뷰는 이후 다른 방향의 도면을 만드는 기준이 되는 첫 번째 뷰입니다.

기본 방향은 전면으로 설정되어 있지만 반드시 전면을 사용할 필요는 없습니다.

제품의 특징을 가장 잘 보여 줄 수 있는 방향을 선택하는 것이 중요합니다.

예를 들어 다음과 같은 방향을 사용할 수 있습니다.

- 전면
- 후면
- 왼쪽
- 오른쪽
- 상단
- 하단

이번 부품에서는 형상을 가장 쉽게 확인할 수 있도록 오른쪽 방향을 기준 뷰로 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 축척

![image.png](../assets/03-03-laser-cutting-workflow/asset-004.png)

기준 뷰를 배치할 때 축척(Scale)도 설정합니다.

축척은 실제 제품의 크기와 도면에서 표시되는 크기의 비율입니다.

예를 들어 다음과 같습니다.

- 1:1 : 실제 크기와 동일
- 1:2 : 실제 크기의 절반
- 2:1 : 실제 크기의 두 배

작은 부품은 확대하여 표시할 수 있고, 큰 부품은 축소하여 도면 안에 배치할 수 있습니다.

이번 부품은 도면에 충분히 들어가기 때문에 1:1 축척을 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 투영된 뷰

![image.png](../assets/03-03-laser-cutting-workflow/asset-005.png)

기준 뷰 하나만으로 제품의 전체 형상을 전달하기 어려운 경우가 많습니다.

따라서 기준 뷰를 이용하여 다른 방향의 뷰를 추가합니다.

다음 메뉴를 사용합니다.

도면 → 작성 → 투영된 뷰

먼저 기준 뷰를 선택하고 마우스를 원하는 방향으로 이동하면 해당 방향의 투영된 뷰가 만들어집니다.

예를 들어 다음과 같이 배치할 수 있습니다.

- 위쪽 : 평면 방향
- 오른쪽 : 측면 방향
- 대각선 : 등각 방향

하나의 부품을 여러 방향에서 보여 주면 제작자가 부품의 전체적인 형상을 쉽게 이해할 수 있습니다.

다만 무조건 많은 뷰를 배치하는 것이 좋은 것은 아닙니다.

&amp;gt; 제품의 형상과 제작 정보를 충분히 전달할 수 있는 최소한의 뷰를 사용하는 것이 좋습니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 치수 입력

![image.png](../assets/03-03-laser-cutting-workflow/asset-006.png)

뷰를 배치했다면 실제 제작에 필요한 치수를 입력합니다.

다음 기능을 사용합니다.

도면 → 치수 → 치수

제작자가 부품을 만들 수 있도록 필요한 위치에 치수를 표시합니다.

대표적으로 다음과 같은 치수가 필요할 수 있습니다.

- 전체 길이
- 전체 폭
- 두께
- 홀 직경
- 홀 사이 거리
- 홀 위치
- 슬롯 길이

3D 모델에서는 형상을 눈으로 확인할 수 있지만 제작 도면에서는 중요한 치수가 명확하게 표시되어야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 동일한 홀의 개수 표시

![image.png](../assets/03-03-laser-cutting-workflow/asset-006.png)

동일한 크기의 홀이 여러 개 존재하는 경우 모든 홀에 반복해서 같은 치수를 표시할 필요는 없습니다.

예를 들어 도면에 다음과 같이 표시할 수 있습니다.

`36-⌀10`

이는 직경 10 mm의 홀이 총 36개 있다는 의미입니다.

즉,

- 36 : 동일한 형상의 개수
- ⌀10 : 홀의 직경

을 나타냅니다.

이와 같이 반복되는 형상은 개수와 대표 치수를 함께 표시하면 도면을 훨씬 간결하게 만들 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 공차 적용

![image.png](../assets/03-03-laser-cutting-workflow/asset-007.png)

3D 모델에서 치수를 정확하게 109.6 mm로 설계했다고 해도 실제 제품을 정확히 109.600... mm로 제작할 수는 없습니다.

따라서 필요한 경우 치수에 허용 가능한 오차 범위인 공차를 지정합니다.

Fusion에서는 공차를 적용할 치수를 더블클릭하여 치수 설정을 변경할 수 있습니다.

예를 들어 기준 치수가 다음과 같다고 가정해 보겠습니다.

`109.6 mm`

여기에 다음과 같은 편측 공차를 지정할 수 있습니다.

`+0.0 / -0.1 mm`

이 경우 허용되는 실제 제작 치수는 다음과 같습니다.

109.5 mm ~ 109.6 mm

즉, 109.6 mm를 초과해서는 안 되지만 0.1 mm까지 작아지는 것은 허용한다는 의미입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 왜 편측 공차를 사용하는가

![image.png](../assets/03-03-laser-cutting-workflow/asset-008.png)

이번 부품은 다른 두 부품 사이에 삽입되어야 하는 구조입니다.

따라서 설계 치수보다 크게 제작되면 조립할 수 없는 문제가 발생할 수 있습니다.

반면 조금 작게 제작되는 것은 일정 범위까지 허용할 수 있습니다.

이런 경우에는 단순한 ± 대칭 공차보다 한쪽 방향으로만 여유를 주는 편측 공차가 더 적절할 수 있습니다.

공차는 단순히 숫자를 작게 만드는 것이 아니라 실제 부품의 기능과 조립 관계를 고려하여 결정해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 공차와 제작 비용

공차 범위가 작을수록 정밀하게 제작해야 합니다.

높은 정밀도를 요구하면 다음과 같은 추가 작업이 필요할 수 있습니다.

- 정밀 가공
- 정밀 측정
- 추가 검사
- 가공 시간 증가
- 불량률 증가

결국 제작 비용도 증가합니다.

따라서 모든 치수에 지나치게 작은 공차를 지정하는 것은 좋은 설계가 아닙니다.

일반적인 부분에는 일반 공차를 적용하고, 조립이나 기능에 중요한 부분에만 개별 공차를 지정하는 것이 효율적입니다.

일반 공차에 대한 내용은 앞에서 학습한 `기계 공차의 개념과 적용`에서 자세히 다루었습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;12&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 제작 도면의 역할

이렇게 완성된 2D 도면은 절삭 가공이나 기타 기계 가공을 의뢰할 때 제작 정보를 전달하는 기준 문서로 사용할 수 있습니다.

도면에는 단순한 형상뿐만 아니라 다음과 같은 정보가 포함될 수 있습니다.

- 치수
- 공차
- 재질
- 표면 처리
- 홀
- Tap
- 가공 요구사항

실제 CNC 가공에서는 3D CAD 데이터와 CAM 데이터가 함께 사용되는 경우가 많지만, 2D 제작 도면은 설계자의 요구사항을 제작자에게 전달하는 중요한 문서입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;13&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 레이저 커팅용 도면

이번에는 같은 2D 데이터를 다른 제작 방식에 활용해 보겠습니다.

앞에서는 제작자가 확인할 수 있는 제작 도면을 만들었다면 이번에는 레이저 커팅 장비에서 사용할 수 있는 2D 형상 데이터를 만듭니다.

레이저 커팅은 기본적으로 판재를 대상으로 다음과 같은 작업을 수행합니다.

- 절단(Cutting)
- 각인(Engraving)

절단은 레이저가 재료를 완전히 관통하여 잘라내는 작업입니다.

각인은 레이저가 표면의 일부만 가공하여 글씨나 표시를 남기는 작업입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;14&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 레이저 커팅과 두께

레이저 커팅용 2D 데이터에는 3D 모델과 같은 두께 정보가 없습니다.

따라서 실제 제작할 때 사용하는 판재의 두께를 별도로 결정합니다.

예를 들어 동일한 2D 형상을 다음 재료에 사용할 수 있습니다.

- 아크릴 2T
- 아크릴 3T
- 아크릴 5T

도면의 외곽 형상은 같더라도 사용하는 판재의 두께에 따라 완성된 제품의 두께가 달라집니다.

즉, 레이저 커팅에서는 2D 형상과 재료 두께를 함께 생각해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;15&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### DXF 내보내기

![image.png](../assets/03-03-laser-cutting-workflow/asset-009.png)

레이저 커팅에서 널리 사용되는 2D 데이터 형식 중 하나가 DXF입니다.

Fusion에서 원하는 부품의 스케치를 DXF 형식으로 내보낸 뒤 nanoCAD와 같은 2D CAD 프로그램에서 불러올 수 있습니다.

일반적인 흐름은 다음과 같습니다.

Fusion 3D 모델

↓

2D Sketch

↓

DXF

↓

2D CAD

↓

레이저 가공 데이터

각인이 필요하지 않고 단순히 외곽과 홀을 절단하는 제품이라면 Fusion에서 만든 스케치를 정리한 뒤 DXF로 바로 내보내는 것도 가능합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;16&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### DXF 내보내기 시 주의 사항

![image.png](../assets/03-03-laser-cutting-workflow/asset-010.png)

Fusion의 스케치에는 실제 제품의 형상 이외에도 설계를 위해 사용한 여러 보조선이 존재할 수 있습니다.

예를 들어 다음과 같습니다.

- 중심선
- 구성선
- 위치 확인용 선
- 임시 스케치

Fusion 안에서는 이런 선이 보조선이라는 정보를 가지고 있지만 DXF를 다른 프로그램으로 전달했을 때 제작 환경에 따라 일반 선처럼 처리될 수 있습니다.

레이저 가공 프로그램에서 이 선들을 절단 경로로 인식하면 원하지 않는 부분까지 절단될 수 있습니다.

따라서 DXF 파일을 제작에 사용하기 전에는 반드시 불필요한 선이 없는지 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;17&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 불필요한 선 제거

![image.png](../assets/03-03-laser-cutting-workflow/asset-011.png)

DXF 파일을 nanoCAD에서 열어 확인합니다.

Fusion에서 사용했던 중심선이나 보조선이 불필요하게 포함되어 있다면 제거합니다.

앞에서 배운 명령을 그대로 사용할 수 있습니다.

`TR` → Trim

`E` → Erase

최종적으로 실제 절단하거나 각인할 선만 남깁니다.

레이저 커팅에서는 화면에서 보이는 선 하나가 실제 장비의 이동 경로가 될 수 있으므로 도면을 최대한 깨끗하게 정리하는 것이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;18&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 레이저 커팅의 장점

레이저 커팅은 판재 부품을 제작할 때 매우 빠른 방법입니다.

특히 아크릴이나 얇은 판재에서는 복잡한 외곽 형상과 많은 홀도 빠르게 가공할 수 있습니다.

3D 프린팅처럼 전체 부피를 한 층씩 쌓을 필요가 없기 때문에 판재 형상의 제품에서는 제작 시간이 크게 줄어들 수 있습니다.

따라서 다음과 같은 부품에 매우 적합합니다.

- 판넬
- 플레이트
- 브라켓
- 커버
- 프레임 부품
- 아크릴 구조물

다만 실제 가공 속도는 재료, 두께, 레이저 출력, 장비 설정 등에 따라 달라집니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;19&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 절단과 각인

이번에는 레이저 커팅에서 절단과 각인을 구분하는 방법도 살펴보겠습니다.

예를 들어 제품의 외곽은 완전히 잘라내고 제품 표면의 문자나 표시선은 각인하고 싶을 수 있습니다.

이 경우 두 종류의 객체를 구분해야 합니다.

예를 들면 다음과 같습니다.

- 외곽 및 홀 : Cutting
- 문자 및 표시 : Engraving

레이저 가공 프로그램에서는 색상이나 Layer를 이용하여 서로 다른 가공 조건을 지정하는 경우가 많습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;20&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 색상으로 구분

예를 들어 다음과 같이 지정할 수 있습니다.

- 빨간색 : 절단
- 파란색 : 각인

이렇게 하면 도면을 보는 사람도 어느 부분을 절단하고 어느 부분을 각인할 것인지 쉽게 이해할 수 있습니다.

다만 빨간색이 항상 절단이고 파란색이 항상 각인이라는 국제적인 규칙이 있는 것은 아닙니다.

사용하는 장비와 가공 업체에 따라 색상의 의미가 다를 수 있습니다.

따라서 색상만으로 가공 조건을 전달하는 것보다 Layer를 함께 사용하는 방법이 더 명확합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;21&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Layer

![image.png](../assets/03-03-laser-cutting-workflow/asset-012.png)

2D CAD에서 객체를 목적에 따라 분류할 때 사용하는 중요한 기능이 Layer입니다.

명령창에 다음을 입력합니다.

`LAYER`

Layer 설정 화면에서 새로운 Layer를 생성할 수 있습니다.

이번 예제에서는 다음 두 개의 Layer를 만듭니다.

**CUTTING**

- 용도 : 절단
- 표시 색상 : Red

**ENGRAVING**

- 용도 : 각인
- 표시 색상 : Blue

각 객체를 해당 Layer로 이동시키면 도면의 의미를 명확하게 구분할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;22&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Layer를 사용하는 이유

![image.png](../assets/03-03-laser-cutting-workflow/asset-012.png)

색상만 사용해도 절단과 각인을 구분할 수 있습니다.

하지만 제작 업체나 레이저 장비에 따라 색상 설정이 다를 수 있습니다.

예를 들어 우리가 다음과 같이 작성했다고 가정해 보겠습니다.

- Red : Cutting
- Blue : Engraving

하지만 제작 업체가 사용하는 설정은 반대일 수도 있습니다.

- Blue : Cutting
- Red : Engraving

색상에만 의미를 부여했다면 제작자가 모든 객체의 색상을 다시 수정해야 할 수 있습니다.

반면 Layer 이름을 다음과 같이 명확하게 만들어 두면 의미를 바로 알 수 있습니다.

- CUTTING
- ENGRAVING

필요한 경우 Layer의 색상만 한 번 변경하면 전체 객체의 색상을 일괄적으로 변경할 수도 있습니다.

따라서 외부 업체에 제작을 의뢰할 때는 해당 업체가 요구하는 Layer, 색상, 선 종류 등의 규칙을 먼저 확인하는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;23&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Layer 생성

nanoCAD에서 다음 명령을 입력합니다.

`LAYER`

Layer 관리 화면에서 새로운 Layer를 추가합니다.

예를 들어 다음과 같이 구성합니다.

| Layer | 용도 | 표시 색상 |
| —- | —- | —- |
| CUTTING | 절단 | Red |
| ENGRAVING | 각인 | Blue |

색상은 이번 실습에서 쉽게 구분하기 위해 사용하는 것이므로 실제 제작 시에는 업체나 장비 규칙에 맞게 변경할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;24&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 객체를 Layer로 분류

외곽선과 실제로 절단해야 하는 홀은 CUTTING Layer에 배치합니다.

표면에 표시만 남길 부분은 ENGRAVING Layer에 배치합니다.

그 결과 화면에서 다음과 같이 쉽게 구분할 수 있습니다.

빨간색

→ 절단

파란색

→ 각인

제작 파일을 전달할 때는 Layer의 의미도 함께 전달하면 좋습니다.

예를 들어 다음과 같이 전달할 수 있습니다.

`CUTTING Layer : 완전 절단`

`ENGRAVING Layer : 표면 각인`

이렇게 하면 제작자가 설계자의 의도를 보다 명확하게 이해할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;25&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Fusion과 2D CAD를 함께 사용하는 이유

이번 실습에서는 Fusion에서 모든 작업을 끝내지 않고 nanoCAD를 함께 사용했습니다.

두 프로그램의 역할이 조금 다르기 때문입니다.

Fusion은 다음 작업에 유리합니다.

- 3D 모델링
- 조립 검토
- 3D 모델 기반 제작 도면
- 3D 형상에서 2D 스케치 추출

2D CAD는 다음 작업에 유리합니다.

- 단순한 2D 형상 편집
- 불필요한 선 정리
- Layer 관리
- 색상 관리
- 레이저 커팅 데이터 정리

따라서 실제 작업에서도 하나의 프로그램만 고집하기보다 목적에 맞는 프로그램을 함께 사용하는 것이 효율적인 경우가 많습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;26&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 모델링용 설계와 제작용 설계

여기에서 매우 중요한 차이를 하나 확인할 수 있습니다.

3D 프린팅용으로 설계했던 컨베이어 부품을 그대로 레이저 커팅할 수 있는 것은 아닙니다.

3D 프린팅에서는 여러 높이의 돌출과 복잡한 구조를 하나의 부품으로 만들 수 있습니다.

하지만 레이저 커팅에서는 기본적으로 평평한 판재를 절단합니다.

따라서 같은 기능의 제품이라도 레이저 커팅으로 제작하려면 구조 자체를 다시 생각해야 합니다.

예를 들어 3D 프린팅에서는 다음과 같이 만들 수 있습니다.

일체형 브라켓

반면 레이저 커팅에서는 다음과 같이 바꿀 수 있습니다.

판재 A

+

판재 B

+

볼트와 너트

↓

조립된 브라켓

이것이 앞에서 계속 강조했던 제작 방식에 따른 설계의 차이입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;27&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 컨베이어와 레이저 커팅

앞에서 만든 컨베이어는 처음부터 3D 프린팅을 고려하여 설계했습니다.

따라서 현재 구조를 그대로 레이저 커팅 방식으로 제작하는 것은 효율적이지 않습니다.

레이저 커팅으로 제작하려면 다음과 같은 부분을 다시 설계해야 합니다.

- 베어링 고정 구조
- 센서 브라켓
- 모터 고정 구조
- 측면 플레이트
- 부품 간 체결 구조

이번 챕터에서는 레이저 커팅 데이터가 어떻게 만들어지는지를 이해하기 위해 기존 컨베이어 부품을 예제로 사용합니다.

실제 레이저 커팅 프로젝트는 이후 자동차 키트를 이용하여 보다 적극적으로 활용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;28&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 이번 실습에서 학습한 내용

이번 실습에서는 지금까지 배운 3D 모델링과 2D CAD를 실제 제작 과정에 연결했습니다.

주요 학습 내용은 다음과 같습니다.

- Fusion 3D 모델에서 2D Drawing 생성
- 기준 뷰 설정
- 투영된 뷰 작성
- 축척 설정
- 제작 치수 입력
- 반복 홀 표기
- 개별 공차 적용
- DXF 내보내기
- nanoCAD에서 DXF 편집
- 불필요한 보조선 제거
- 절단과 각인의 차이
- Layer 생성 및 관리
- 레이저 커팅용 데이터 작성&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;30&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 이번 챕터의 핵심

3D 모델링과 2D CAD를 배우는 목적은 단순히 그림을 만드는 것이 아닙니다.

최종적으로는 실제 제품을 제작하기 위한 정보를 만드는 것이 목적입니다.

3D CAD에서는 제품의 형상과 조립 관계를 설계합니다.

2D Drawing에서는 제작자에게 필요한 치수와 공차 등의 정보를 전달합니다.

2D CAD에서는 레이저 커팅과 같이 실제 제작 장비에서 사용할 수 있는 형상 데이터를 만들고 정리할 수 있습니다.

전체 흐름은 다음과 같습니다.

↓

  <script>window.VIEWER_CONFIG={"title":"03-03. 레이저 커팅을 위한 작업","deck":"../marp/03-03-laser-cutting-workflow.html","scripts":["<h2>오프닝</h2>\n<p>안녕하세요. 이번 영상에서는 레이저 커팅을 위한 작업에 대해 알아보겠습니다.</p>\n\n<p>핵심 개념을 실제 기계 설계와 제작 과정에 어떻게 적용하는지 순서대로 살펴보겠습니다.</p>","<h2>03-03. 레이저 커팅을 위한 작업</h2>\n<p class=\"screen\">[화면] 03-03. 레이저 커팅을 위한 작업</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 레이저 커팅을 위한 작업에 대해 살펴보겠습니다.</p>\n\n<p>이제 우리는 3D 모델링과 2D CAD의 기본적인 사용 방법을 익혔습니다.</p>\n\n<p>지금까지는 각각의 프로그램과 기능을 사용하는 방법을 중심으로 학습했다면, 이제부터는 실제 제품 제작과 연결되는 내용을 다뤄 보겠습니다.</p>\n\n<p>이번 챕터에서는 크게 다음 세 가지 내용을 학습합니다.</p>\n\n<p>Fusion의 3D 모델에서 2D 제작 도면 만들기</p>\n\n<p>2D CAD를 이용하여 레이저 커팅용 도면 만들기</p>\n\n<p>제작 방식에 맞게 기존 컨베이어 구조를 다시 설계하기</p>\n\n<p>특히 이번 과정에서는 단순히 도면을 그리는 방법뿐만 아니라 같은 부품이라도 제작 방법에 따라 도면과 설계 방법이 어떻게 달라지는지를 함께 살펴봅니다.</p>","<h2>3D 모델에서 제작 도면 만들기</h2>\n<p class=\"screen\">[화면] 3D 모델에서 제작 도면 만들기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 모델에서 제작 도면 만들기에 대해 살펴보겠습니다.</p>\n\n<p>앞에서 만든 컨베이어 부품 중에는 일반적인 판재 가공으로 제작할 수 있는 부품이 있습니다.</p>\n\n<p>먼저 비교적 단순한 PLATE_SUPPORT와 같은 판 형상의 부품을 이용하여 3D 모델에서 2D 제작 도면을 만들어 보겠습니다.</p>\n\n<p>Fusion에서는 이미 만들어진 3D 모델을 이용하여 비교적 쉽게 2D 도면을 생성할 수 있습니다.</p>","<h2>도면 생성</h2>\n<p class=\"screen\">[화면] 도면 생성</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 도면 생성에 대해 살펴보겠습니다.</p>\n\n<p>도면으로 만들 부품을 선택한 뒤 다음 메뉴를 사용합니다.</p>\n\n<p>디자인 → 도면 → 설계에서</p>\n\n<p>도면 작성 화면이 나타나면 먼저 용지 크기와 기본 설정을 선택합니다.</p>\n\n<p>실무에서는 제품의 크기와 회사의 도면 규격에 따라 A4, A3, A2 등 다양한 용지를 사용할 수 있습니다.</p>\n\n<p>일반적인 기계 부품 도면에서는 A3도 많이 사용하지만, 직접 프린터로 출력하여 확인하려면 사용할 수 있는 프린터의 용지 크기를 고려하여 선택하면 됩니다.</p>","<h2>기준 뷰</h2>\n<p class=\"screen\">[화면] 기준 뷰</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기준 뷰에 대해 살펴보겠습니다.</p>\n\n<p>도면을 만들면 가장 먼저 기준 뷰(Base View)를 배치합니다.</p>\n\n<p>기준 뷰는 이후 다른 방향의 도면을 만드는 기준이 되는 첫 번째 뷰입니다.</p>\n\n<p>기본 방향은 전면으로 설정되어 있지만 반드시 전면을 사용할 필요는 없습니다.</p>\n\n<p>제품의 특징을 가장 잘 보여 줄 수 있는 방향을 선택하는 것이 중요합니다.</p>\n\n<p>예를 들어 다음과 같은 방향을 사용할 수 있습니다.</p>\n\n<p>전면입니다.</p>\n\n<p>후면입니다.</p>\n\n<p>왼쪽입니다.</p>\n\n<p>오른쪽입니다.</p>\n\n<p>상단입니다.</p>\n\n<p>하단입니다.</p>\n\n<p>이번 부품에서는 형상을 가장 쉽게 확인할 수 있도록 오른쪽 방향을 기준 뷰로 사용합니다.</p>","<h2>축척</h2>\n<p class=\"screen\">[화면] 축척</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 축척에 대해 살펴보겠습니다.</p>\n\n<p>기준 뷰를 배치할 때 축척(Scale)도 설정합니다.</p>\n\n<p>축척은 실제 제품의 크기와 도면에서 표시되는 크기의 비율입니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>1:1 : 실제 크기와 동일입니다.</p>\n\n<p>1:2 : 실제 크기의 절반입니다.</p>\n\n<p>2:1 : 실제 크기의 두 배입니다.</p>\n\n<p>작은 부품은 확대하여 표시할 수 있고, 큰 부품은 축소하여 도면 안에 배치할 수 있습니다.</p>\n\n<p>이번 부품은 도면에 충분히 들어가기 때문에 1:1 축척을 사용합니다.</p>","<h2>투영된 뷰</h2>\n<p class=\"screen\">[화면] 투영된 뷰</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 투영된 뷰에 대해 살펴보겠습니다.</p>\n\n<p>기준 뷰 하나만으로 제품의 전체 형상을 전달하기 어려운 경우가 많습니다.</p>\n\n<p>따라서 기준 뷰를 이용하여 다른 방향의 뷰를 추가합니다.</p>\n\n<p>다음 메뉴를 사용합니다.</p>\n\n<p>도면 → 작성 → 투영된 뷰</p>\n\n<p>먼저 기준 뷰를 선택하고 마우스를 원하는 방향으로 이동하면 해당 방향의 투영된 뷰가 만들어집니다.</p>\n\n<p>예를 들어 다음과 같이 배치할 수 있습니다.</p>\n\n<p>위쪽 : 평면 방향입니다.</p>\n\n<p>오른쪽 : 측면 방향입니다.</p>\n\n<p>대각선 : 등각 방향입니다.</p>\n\n<p>하나의 부품을 여러 방향에서 보여 주면 제작자가 부품의 전체적인 형상을 쉽게 이해할 수 있습니다.</p>\n\n<p>다만 무조건 많은 뷰를 배치하는 것이 좋은 것은 아닙니다.</p>\n\n<p>&gt; 제품의 형상과 제작 정보를 충분히 전달할 수 있는 최소한의 뷰를 사용하는 것이 좋습니다.</p>\n\n<p>&gt;</p>","<h2>치수 입력</h2>\n<p class=\"screen\">[화면] 치수 입력</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 치수 입력에 대해 살펴보겠습니다.</p>\n\n<p>뷰를 배치했다면 실제 제작에 필요한 치수를 입력합니다.</p>\n\n<p>다음 기능을 사용합니다.</p>\n\n<p>도면 → 치수 → 치수</p>\n\n<p>제작자가 부품을 만들 수 있도록 필요한 위치에 치수를 표시합니다.</p>\n\n<p>대표적으로 다음과 같은 치수가 필요할 수 있습니다.</p>\n\n<p>전체 길이입니다.</p>\n\n<p>전체 폭입니다.</p>\n\n<p>두께입니다.</p>\n\n<p>홀 직경입니다.</p>\n\n<p>홀 사이 거리입니다.</p>\n\n<p>홀 위치입니다.</p>\n\n<p>슬롯 길이입니다.</p>\n\n<p>3D 모델에서는 형상을 눈으로 확인할 수 있지만 제작 도면에서는 중요한 치수가 명확하게 표시되어야 합니다.</p>","<h2>동일한 홀의 개수 표시</h2>\n<p class=\"screen\">[화면] 동일한 홀의 개수 표시</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 동일한 홀의 개수 표시에 대해 살펴보겠습니다.</p>\n\n<p>동일한 크기의 홀이 여러 개 존재하는 경우 모든 홀에 반복해서 같은 치수를 표시할 필요는 없습니다.</p>\n\n<p>예를 들어 도면에 다음과 같이 표시할 수 있습니다.</p>\n\n<p>36-⌀10</p>\n\n<p>이는 직경 10 mm의 홀이 총 36개 있다는 의미입니다.</p>\n\n<p>즉,</p>\n\n<p>36 : 동일한 형상의 개수입니다.</p>\n\n<p>⌀10 : 홀의 직경입니다.</p>\n\n<p>을 나타냅니다.</p>\n\n<p>이와 같이 반복되는 형상은 개수와 대표 치수를 함께 표시하면 도면을 훨씬 간결하게 만들 수 있습니다.</p>","<h2>공차 적용</h2>\n<p class=\"screen\">[화면] 공차 적용</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 공차 적용에 대해 살펴보겠습니다.</p>\n\n<p>3D 모델에서 치수를 정확하게 109.6 mm로 설계했다고 해도 실제 제품을 정확히 109.600... mm로 제작할 수는 없습니다.</p>\n\n<p>따라서 필요한 경우 치수에 허용 가능한 오차 범위인 공차를 지정합니다.</p>\n\n<p>Fusion에서는 공차를 적용할 치수를 더블클릭하여 치수 설정을 변경할 수 있습니다.</p>\n\n<p>예를 들어 기준 치수가 다음과 같다고 가정해 보겠습니다.</p>\n\n<p>109.6 mm</p>\n\n<p>여기에 다음과 같은 편측 공차를 지정할 수 있습니다.</p>\n\n<p>+0.0 / -0.1 mm</p>\n\n<p>이 경우 허용되는 실제 제작 치수는 다음과 같습니다.</p>\n\n<p>109.5 mm ~ 109.6 mm</p>\n\n<p>즉, 109.6 mm를 초과해서는 안 되지만 0.1 mm까지 작아지는 것은 허용한다는 의미입니다.</p>","<h2>왜 편측 공차를 사용하는가</h2>\n<p class=\"screen\">[화면] 왜 편측 공차를 사용하는가</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 왜 편측 공차를 사용하는가에 대해 살펴보겠습니다.</p>\n\n<p>이번 부품은 다른 두 부품 사이에 삽입되어야 하는 구조입니다.</p>\n\n<p>따라서 설계 치수보다 크게 제작되면 조립할 수 없는 문제가 발생할 수 있습니다.</p>\n\n<p>반면 조금 작게 제작되는 것은 일정 범위까지 허용할 수 있습니다.</p>\n\n<p>이런 경우에는 단순한 ± 대칭 공차보다 한쪽 방향으로만 여유를 주는 편측 공차가 더 적절할 수 있습니다.</p>\n\n<p>공차는 단순히 숫자를 작게 만드는 것이 아니라 실제 부품의 기능과 조립 관계를 고려하여 결정해야 합니다.</p>","<h2>공차와 제작 비용</h2>\n<p class=\"screen\">[화면] 공차와 제작 비용</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 공차와 제작 비용에 대해 살펴보겠습니다.</p>\n\n<p>공차 범위가 작을수록 정밀하게 제작해야 합니다.</p>\n\n<p>높은 정밀도를 요구하면 다음과 같은 추가 작업이 필요할 수 있습니다.</p>\n\n<p>정밀 가공입니다.</p>\n\n<p>정밀 측정입니다.</p>\n\n<p>추가 검사입니다.</p>\n\n<p>가공 시간 증가입니다.</p>\n\n<p>불량률 증가입니다.</p>\n\n<p>결국 제작 비용도 증가합니다.</p>\n\n<p>따라서 모든 치수에 지나치게 작은 공차를 지정하는 것은 좋은 설계가 아닙니다.</p>\n\n<p>일반적인 부분에는 일반 공차를 적용하고, 조립이나 기능에 중요한 부분에만 개별 공차를 지정하는 것이 효율적입니다.</p>\n\n<p>일반 공차에 대한 내용은 앞에서 학습한 기계 공차의 개념과 적용에서 자세히 다루었습니다.</p>","<h2>제작 도면의 역할</h2>\n<p class=\"screen\">[화면] 제작 도면의 역할</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 제작 도면의 역할에 대해 살펴보겠습니다.</p>\n\n<p>이렇게 완성된 2D 도면은 절삭 가공이나 기타 기계 가공을 의뢰할 때 제작 정보를 전달하는 기준 문서로 사용할 수 있습니다.</p>\n\n<p>도면에는 단순한 형상뿐만 아니라 다음과 같은 정보가 포함될 수 있습니다.</p>\n\n<p>치수입니다.</p>\n\n<p>공차입니다.</p>\n\n<p>재질입니다.</p>\n\n<p>표면 처리입니다.</p>\n\n<p>홀입니다.</p>\n\n<p>Tap입니다.</p>\n\n<p>가공 요구사항입니다.</p>\n\n<p>실제 CNC 가공에서는 3D CAD 데이터와 CAM 데이터가 함께 사용되는 경우가 많지만, 2D 제작 도면은 설계자의 요구사항을 제작자에게 전달하는 중요한 문서입니다.</p>","<h2>레이저 커팅용 도면</h2>\n<p class=\"screen\">[화면] 레이저 커팅용 도면</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 레이저 커팅용 도면에 대해 살펴보겠습니다.</p>\n\n<p>이번에는 같은 2D 데이터를 다른 제작 방식에 활용해 보겠습니다.</p>\n\n<p>앞에서는 제작자가 확인할 수 있는 제작 도면을 만들었다면 이번에는 레이저 커팅 장비에서 사용할 수 있는 2D 형상 데이터를 만듭니다.</p>\n\n<p>레이저 커팅은 기본적으로 판재를 대상으로 다음과 같은 작업을 수행합니다.</p>\n\n<p>절단(Cutting)입니다.</p>\n\n<p>각인(Engraving)입니다.</p>\n\n<p>절단은 레이저가 재료를 완전히 관통하여 잘라내는 작업입니다.</p>\n\n<p>각인은 레이저가 표면의 일부만 가공하여 글씨나 표시를 남기는 작업입니다.</p>","<h2>레이저 커팅과 두께</h2>\n<p class=\"screen\">[화면] 레이저 커팅과 두께</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 레이저 커팅과 두께에 대해 살펴보겠습니다.</p>\n\n<p>레이저 커팅용 2D 데이터에는 3D 모델과 같은 두께 정보가 없습니다.</p>\n\n<p>따라서 실제 제작할 때 사용하는 판재의 두께를 별도로 결정합니다.</p>\n\n<p>예를 들어 동일한 2D 형상을 다음 재료에 사용할 수 있습니다.</p>\n\n<p>아크릴 2T입니다.</p>\n\n<p>아크릴 3T입니다.</p>\n\n<p>아크릴 5T입니다.</p>\n\n<p>도면의 외곽 형상은 같더라도 사용하는 판재의 두께에 따라 완성된 제품의 두께가 달라집니다.</p>\n\n<p>즉, 레이저 커팅에서는 2D 형상과 재료 두께를 함께 생각해야 합니다.</p>","<h2>DXF 내보내기</h2>\n<p class=\"screen\">[화면] DXF 내보내기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 DXF 내보내기에 대해 살펴보겠습니다.</p>\n\n<p>레이저 커팅에서 널리 사용되는 2D 데이터 형식 중 하나가 DXF입니다.</p>\n\n<p>Fusion에서 원하는 부품의 스케치를 DXF 형식으로 내보낸 뒤 nanoCAD와 같은 2D CAD 프로그램에서 불러올 수 있습니다.</p>\n\n<p>일반적인 흐름은 다음과 같습니다.</p>\n\n<p>Fusion 3D 모델</p>\n\n<p>↓</p>\n\n<p>2D Sketch</p>\n\n<p>↓</p>\n\n<p>DXF</p>\n\n<p>↓</p>\n\n<p>2D CAD</p>\n\n<p>↓</p>\n\n<p>레이저 가공 데이터</p>\n\n<p>각인이 필요하지 않고 단순히 외곽과 홀을 절단하는 제품이라면 Fusion에서 만든 스케치를 정리한 뒤 DXF로 바로 내보내는 것도 가능합니다.</p>","<h2>DXF 내보내기 시 주의 사항</h2>\n<p class=\"screen\">[화면] DXF 내보내기 시 주의 사항</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 DXF 내보내기 시 주의 사항에 대해 살펴보겠습니다.</p>\n\n<p>Fusion의 스케치에는 실제 제품의 형상 이외에도 설계를 위해 사용한 여러 보조선이 존재할 수 있습니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>중심선입니다.</p>\n\n<p>구성선입니다.</p>\n\n<p>위치 확인용 선입니다.</p>\n\n<p>임시 스케치입니다.</p>\n\n<p>Fusion 안에서는 이런 선이 보조선이라는 정보를 가지고 있지만 DXF를 다른 프로그램으로 전달했을 때 제작 환경에 따라 일반 선처럼 처리될 수 있습니다.</p>\n\n<p>레이저 가공 프로그램에서 이 선들을 절단 경로로 인식하면 원하지 않는 부분까지 절단될 수 있습니다.</p>\n\n<p>따라서 DXF 파일을 제작에 사용하기 전에는 반드시 불필요한 선이 없는지 확인해야 합니다.</p>","<h2>불필요한 선 제거</h2>\n<p class=\"screen\">[화면] 불필요한 선 제거</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 불필요한 선 제거에 대해 살펴보겠습니다.</p>\n\n<p>DXF 파일을 nanoCAD에서 열어 확인합니다.</p>\n\n<p>Fusion에서 사용했던 중심선이나 보조선이 불필요하게 포함되어 있다면 제거합니다.</p>\n\n<p>앞에서 배운 명령을 그대로 사용할 수 있습니다.</p>\n\n<p>TR → Trim</p>\n\n<p>E → Erase</p>\n\n<p>최종적으로 실제 절단하거나 각인할 선만 남깁니다.</p>\n\n<p>레이저 커팅에서는 화면에서 보이는 선 하나가 실제 장비의 이동 경로가 될 수 있으므로 도면을 최대한 깨끗하게 정리하는 것이 중요합니다.</p>","<h2>레이저 커팅의 장점</h2>\n<p class=\"screen\">[화면] 레이저 커팅의 장점</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 레이저 커팅의 장점에 대해 살펴보겠습니다.</p>\n\n<p>레이저 커팅은 판재 부품을 제작할 때 매우 빠른 방법입니다.</p>\n\n<p>특히 아크릴이나 얇은 판재에서는 복잡한 외곽 형상과 많은 홀도 빠르게 가공할 수 있습니다.</p>\n\n<p>3D 프린팅처럼 전체 부피를 한 층씩 쌓을 필요가 없기 때문에 판재 형상의 제품에서는 제작 시간이 크게 줄어들 수 있습니다.</p>\n\n<p>따라서 다음과 같은 부품에 매우 적합합니다.</p>\n\n<p>판넬입니다.</p>\n\n<p>플레이트입니다.</p>\n\n<p>브라켓입니다.</p>\n\n<p>커버입니다.</p>\n\n<p>프레임 부품입니다.</p>\n\n<p>아크릴 구조물입니다.</p>\n\n<p>다만 실제 가공 속도는 재료, 두께, 레이저 출력, 장비 설정 등에 따라 달라집니다.</p>","<h2>절단과 각인</h2>\n<p class=\"screen\">[화면] 절단과 각인</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 절단과 각인에 대해 살펴보겠습니다.</p>\n\n<p>이번에는 레이저 커팅에서 절단과 각인을 구분하는 방법도 살펴보겠습니다.</p>\n\n<p>예를 들어 제품의 외곽은 완전히 잘라내고 제품 표면의 문자나 표시선은 각인하고 싶을 수 있습니다.</p>\n\n<p>이 경우 두 종류의 객체를 구분해야 합니다.</p>\n\n<p>예를 들면 다음과 같습니다.</p>\n\n<p>외곽 및 홀 : Cutting입니다.</p>\n\n<p>문자 및 표시 : Engraving입니다.</p>\n\n<p>레이저 가공 프로그램에서는 색상이나 Layer를 이용하여 서로 다른 가공 조건을 지정하는 경우가 많습니다.</p>","<h2>색상으로 구분</h2>\n<p class=\"screen\">[화면] 색상으로 구분</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 색상으로 구분에 대해 살펴보겠습니다.</p>\n\n<p>예를 들어 다음과 같이 지정할 수 있습니다.</p>\n\n<p>빨간색 : 절단입니다.</p>\n\n<p>파란색 : 각인입니다.</p>\n\n<p>이렇게 하면 도면을 보는 사람도 어느 부분을 절단하고 어느 부분을 각인할 것인지 쉽게 이해할 수 있습니다.</p>\n\n<p>다만 빨간색이 항상 절단이고 파란색이 항상 각인이라는 국제적인 규칙이 있는 것은 아닙니다.</p>\n\n<p>사용하는 장비와 가공 업체에 따라 색상의 의미가 다를 수 있습니다.</p>\n\n<p>따라서 색상만으로 가공 조건을 전달하는 것보다 Layer를 함께 사용하는 방법이 더 명확합니다.</p>","<h2>Layer</h2>\n<p class=\"screen\">[화면] Layer</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Layer에 대해 살펴보겠습니다.</p>\n\n<p>2D CAD에서 객체를 목적에 따라 분류할 때 사용하는 중요한 기능이 Layer입니다.</p>\n\n<p>명령창에 다음을 입력합니다.</p>\n\n<p>LAYER</p>\n\n<p>Layer 설정 화면에서 새로운 Layer를 생성할 수 있습니다.</p>\n\n<p>이번 예제에서는 다음 두 개의 Layer를 만듭니다.</p>\n\n<p>CUTTING</p>\n\n<p>용도 : 절단입니다.</p>\n\n<p>표시 색상 : Red입니다.</p>\n\n<p>ENGRAVING</p>\n\n<p>용도 : 각인입니다.</p>\n\n<p>표시 색상 : Blue입니다.</p>\n\n<p>각 객체를 해당 Layer로 이동시키면 도면의 의미를 명확하게 구분할 수 있습니다.</p>","<h2>Layer를 사용하는 이유</h2>\n<p class=\"screen\">[화면] Layer를 사용하는 이유</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Layer를 사용하는 이유에 대해 살펴보겠습니다.</p>\n\n<p>색상만 사용해도 절단과 각인을 구분할 수 있습니다.</p>\n\n<p>하지만 제작 업체나 레이저 장비에 따라 색상 설정이 다를 수 있습니다.</p>\n\n<p>예를 들어 우리가 다음과 같이 작성했다고 가정해 보겠습니다.</p>\n\n<p>Red : Cutting입니다.</p>\n\n<p>Blue : Engraving입니다.</p>\n\n<p>하지만 제작 업체가 사용하는 설정은 반대일 수도 있습니다.</p>\n\n<p>Blue : Cutting입니다.</p>\n\n<p>Red : Engraving입니다.</p>\n\n<p>색상에만 의미를 부여했다면 제작자가 모든 객체의 색상을 다시 수정해야 할 수 있습니다.</p>\n\n<p>반면 Layer 이름을 다음과 같이 명확하게 만들어 두면 의미를 바로 알 수 있습니다.</p>\n\n<p>CUTTING입니다.</p>\n\n<p>ENGRAVING입니다.</p>\n\n<p>필요한 경우 Layer의 색상만 한 번 변경하면 전체 객체의 색상을 일괄적으로 변경할 수도 있습니다.</p>\n\n<p>따라서 외부 업체에 제작을 의뢰할 때는 해당 업체가 요구하는 Layer, 색상, 선 종류 등의 규칙을 먼저 확인하는 것이 좋습니다.</p>","<h2>Layer 생성</h2>\n<p class=\"screen\">[화면] Layer 생성</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Layer 생성에 대해 살펴보겠습니다.</p>\n\n<p>nanoCAD에서 다음 명령을 입력합니다.</p>\n\n<p>LAYER</p>\n\n<p>Layer 관리 화면에서 새로운 Layer를 추가합니다.</p>\n\n<p>예를 들어 다음과 같이 구성합니다.</p>\n\n<p>Layer: 용도: 표시 색상.</p>\n\n<p>—-: —-: —-.</p>\n\n<p>CUTTING: 절단: Red.</p>\n\n<p>ENGRAVING: 각인: Blue.</p>\n\n<p>색상은 이번 실습에서 쉽게 구분하기 위해 사용하는 것이므로 실제 제작 시에는 업체나 장비 규칙에 맞게 변경할 수 있습니다.</p>","<h2>객체를 Layer로 분류</h2>\n<p class=\"screen\">[화면] 객체를 Layer로 분류</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 객체를 Layer로 분류에 대해 살펴보겠습니다.</p>\n\n<p>외곽선과 실제로 절단해야 하는 홀은 CUTTING Layer에 배치합니다.</p>\n\n<p>표면에 표시만 남길 부분은 ENGRAVING Layer에 배치합니다.</p>\n\n<p>그 결과 화면에서 다음과 같이 쉽게 구분할 수 있습니다.</p>\n\n<p>빨간색</p>\n\n<p>→ 절단</p>\n\n<p>파란색</p>\n\n<p>→ 각인</p>\n\n<p>제작 파일을 전달할 때는 Layer의 의미도 함께 전달하면 좋습니다.</p>\n\n<p>예를 들어 다음과 같이 전달할 수 있습니다.</p>\n\n<p>CUTTING Layer : 완전 절단</p>\n\n<p>ENGRAVING Layer : 표면 각인</p>\n\n<p>이렇게 하면 제작자가 설계자의 의도를 보다 명확하게 이해할 수 있습니다.</p>","<h2>Fusion과 2D CAD를 함께 사용하는 이유</h2>\n<p class=\"screen\">[화면] Fusion과 2D CAD를 함께 사용하는 이유</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Fusion과 2D CAD를 함께 사용하는 이유에 대해 살펴보겠습니다.</p>\n\n<p>이번 실습에서는 Fusion에서 모든 작업을 끝내지 않고 nanoCAD를 함께 사용했습니다.</p>\n\n<p>두 프로그램의 역할이 조금 다르기 때문입니다.</p>\n\n<p>Fusion은 다음 작업에 유리합니다.</p>\n\n<p>3D 모델링입니다.</p>\n\n<p>조립 검토입니다.</p>\n\n<p>3D 모델 기반 제작 도면입니다.</p>\n\n<p>3D 형상에서 2D 스케치 추출입니다.</p>\n\n<p>2D CAD는 다음 작업에 유리합니다.</p>\n\n<p>단순한 2D 형상 편집입니다.</p>\n\n<p>불필요한 선 정리입니다.</p>\n\n<p>Layer 관리입니다.</p>\n\n<p>색상 관리입니다.</p>\n\n<p>레이저 커팅 데이터 정리입니다.</p>\n\n<p>따라서 실제 작업에서도 하나의 프로그램만 고집하기보다 목적에 맞는 프로그램을 함께 사용하는 것이 효율적인 경우가 많습니다.</p>","<h2>모델링용 설계와 제작용 설계</h2>\n<p class=\"screen\">[화면] 모델링용 설계와 제작용 설계</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 모델링용 설계와 제작용 설계에 대해 살펴보겠습니다.</p>\n\n<p>여기에서 매우 중요한 차이를 하나 확인할 수 있습니다.</p>\n\n<p>3D 프린팅용으로 설계했던 컨베이어 부품을 그대로 레이저 커팅할 수 있는 것은 아닙니다.</p>\n\n<p>3D 프린팅에서는 여러 높이의 돌출과 복잡한 구조를 하나의 부품으로 만들 수 있습니다.</p>\n\n<p>하지만 레이저 커팅에서는 기본적으로 평평한 판재를 절단합니다.</p>\n\n<p>따라서 같은 기능의 제품이라도 레이저 커팅으로 제작하려면 구조 자체를 다시 생각해야 합니다.</p>\n\n<p>예를 들어 3D 프린팅에서는 다음과 같이 만들 수 있습니다.</p>\n\n<p>일체형 브라켓</p>\n\n<p>반면 레이저 커팅에서는 다음과 같이 바꿀 수 있습니다.</p>\n\n<p>판재 A</p>\n\n<p>+</p>\n\n<p>판재 B</p>\n\n<p>+</p>\n\n<p>볼트와 너트</p>\n\n<p>↓</p>\n\n<p>조립된 브라켓</p>\n\n<p>이것이 앞에서 계속 강조했던 제작 방식에 따른 설계의 차이입니다.</p>","<h2>컨베이어와 레이저 커팅</h2>\n<p class=\"screen\">[화면] 컨베이어와 레이저 커팅</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 컨베이어와 레이저 커팅에 대해 살펴보겠습니다.</p>\n\n<p>앞에서 만든 컨베이어는 처음부터 3D 프린팅을 고려하여 설계했습니다.</p>\n\n<p>따라서 현재 구조를 그대로 레이저 커팅 방식으로 제작하는 것은 효율적이지 않습니다.</p>\n\n<p>레이저 커팅으로 제작하려면 다음과 같은 부분을 다시 설계해야 합니다.</p>\n\n<p>베어링 고정 구조입니다.</p>\n\n<p>센서 브라켓입니다.</p>\n\n<p>모터 고정 구조입니다.</p>\n\n<p>측면 플레이트입니다.</p>\n\n<p>부품 간 체결 구조입니다.</p>\n\n<p>이번 챕터에서는 레이저 커팅 데이터가 어떻게 만들어지는지를 이해하기 위해 기존 컨베이어 부품을 예제로 사용합니다.</p>\n\n<p>실제 레이저 커팅 프로젝트는 이후 자동차 키트를 이용하여 보다 적극적으로 활용합니다.</p>","<h2>제작 방법에 따른 설계 비교</h2>\n<p class=\"screen\">[화면] 제작 방법에 따른 설계 비교</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 제작 방법에 따른 설계 비교에 대해 살펴보겠습니다.</p>\n\n<p>같은 제품을 만들더라도 제작 방법에 따라 설계 접근이 달라집니다.</p>\n\n<p>3D 프린팅</p>\n\n<p>3D CAD</p>\n\n<p>↓</p>\n\n<p>복잡한 3D 형상</p>\n\n<p>↓</p>\n\n<p>STL / 3MF</p>\n\n<p>↓</p>\n\n<p>Slicer</p>\n\n<p>↓</p>\n\n<p>출력</p>\n\n<p>레이저 커팅</p>\n\n<p>2D CAD</p>\n\n<p>↓</p>\n\n<p>판재 형상</p>\n\n<p>↓</p>\n\n<p>DXF</p>\n\n<p>↓</p>\n\n<p>Cutting / Engraving 설정</p>\n\n<p>↓</p>\n\n<p>절단 및 조립</p>\n\n<p>절삭 가공</p>\n\n<p>3D CAD</p>\n\n<p>+</p>\n\n<p>2D 제작 도면</p>\n\n<p>↓</p>\n\n<p>CAM 또는 가공 계획</p>\n\n<p>↓</p>\n\n<p>절삭 가공</p>\n\n<p>따라서 설계자는 단순히 형상을 만들 수 있는지를 판단하는 것이 아니라 어떤 방법으로 제작할 것인지를 먼저 생각해야 합니다.</p>","<h2>이번 실습에서 학습한 내용</h2>\n<p class=\"screen\">[화면] 이번 실습에서 학습한 내용</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 이번 실습에서 학습한 내용에 대해 살펴보겠습니다.</p>\n\n<p>이번 실습에서는 지금까지 배운 3D 모델링과 2D CAD를 실제 제작 과정에 연결했습니다.</p>\n\n<p>주요 학습 내용은 다음과 같습니다.</p>\n\n<p>Fusion 3D 모델에서 2D Drawing 생성입니다.</p>\n\n<p>기준 뷰 설정입니다.</p>\n\n<p>투영된 뷰 작성입니다.</p>\n\n<p>축척 설정입니다.</p>\n\n<p>제작 치수 입력입니다.</p>\n\n<p>반복 홀 표기입니다.</p>\n\n<p>개별 공차 적용입니다.</p>\n\n<p>DXF 내보내기입니다.</p>\n\n<p>nanoCAD에서 DXF 편집입니다.</p>\n\n<p>불필요한 보조선 제거입니다.</p>\n\n<p>절단과 각인의 차이입니다.</p>\n\n<p>Layer 생성 및 관리입니다.</p>\n\n<p>레이저 커팅용 데이터 작성입니다.</p>","<h2>이번 챕터의 핵심</h2>\n<p class=\"screen\">[화면] 이번 챕터의 핵심</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 이번 챕터의 핵심에 대해 살펴보겠습니다.</p>\n\n<p>3D 모델링과 2D CAD를 배우는 목적은 단순히 그림을 만드는 것이 아닙니다.</p>\n\n<p>최종적으로는 실제 제품을 제작하기 위한 정보를 만드는 것이 목적입니다.</p>\n\n<p>3D CAD에서는 제품의 형상과 조립 관계를 설계합니다.</p>\n\n<p>2D Drawing에서는 제작자에게 필요한 치수와 공차 등의 정보를 전달합니다.</p>\n\n<p>2D CAD에서는 레이저 커팅과 같이 실제 제작 장비에서 사용할 수 있는 형상 데이터를 만들고 정리할 수 있습니다.</p>\n\n<p>전체 흐름은 다음과 같습니다.</p>\n\n<p>3D 모델링</p>\n\n<p>↓</p>\n\n<p>제작 방법 결정</p>\n\n<p>↓</p>\n\n<p>필요한 제작 데이터 생성</p>\n\n<p>↓</p>\n\n<p>공차 및 가공 조건 정의</p>\n\n<p>↓</p>\n\n<p>실제 제작</p>\n\n<p>그리고 여기에서 가장 중요한 것은 다시 한번 제작 방법입니다.</p>\n\n<p>&gt; 3D 프린팅으로 만들 것인지, 레이저 커팅으로 만들 것인지, 절삭 가공으로 만들 것인지에 따라 같은 제품이라도 설계 방법이 달라집니다.</p>\n\n<p>&gt;</p>\n\n<p>앞으로는 이 차이를 실제 프로젝트를 통해 조금 더 명확하게 확인합니다.</p>\n\n<p>다음 단계에서는 레이저 커팅의 장점을 보다 적극적으로 활용할 수 있는 구조를 직접 설계하고 실제 제작 데이터로 연결해 보겠습니다.</p>\n<h2>마무리</h2>\n<p>이번 영상에서는 레이저 커팅을 위한 작업의 핵심 내용을 살펴봤습니다.</p>\n\n<p>다음 내용에서는 오늘 확인한 개념을 실제 설계와 제작 과정에 연결해 보겠습니다. 시청해 주셔서 감사합니다.</p>"]};</script><script src="viewer.js"></script>
