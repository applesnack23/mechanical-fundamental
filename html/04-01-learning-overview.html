# 전체 학습 주제 개요 및 학습 목표 이해

지금까지 우리는 Fusion 360을 이용하여 3D 모델링을 하고, Fusion과 nanoCAD를 이용하여 2D 제작 도면도 만들어 보았습니다.

2D CAD를 이용한 제작은 빠르고 비용이 낮다는 장점이 있지만, 기본적으로 판재 형상을 중심으로 제작해야 한다는 제약이 있습니다.

반면 3D 프린팅은 훨씬 자유로운 형상을 제작할 수 있습니다.

제작 속도는 느리지만 복잡한 형상의 제품을 비교적 저렴한 비용으로 만들 수 있다는 것이 가장 큰 장점입니다.

3D 프린팅에는 재료와 출력 방식에 따라 다양한 기술이 존재하지만, 이번 과정에서는 교육용과 개인용으로 가장 쉽게 접할 수 있는 FDM 방식만 다룹니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### FDM 방식

FDM은 필라멘트 형태의 플라스틱 재료를 녹여 한 층씩 쌓아 올리는 방식입니다.

기본적인 동작 과정은 다음과 같습니다.

필라멘트

↓

노즐에서 가열

↓

녹은 재료 배출

↓

한 층씩 적층

↓

3D 형상 완성

따라서 앞에서 학습했던 적층 가공(Additive Manufacturing)의 대표적인 방식이라고 볼 수 있습니다.

3D 프린팅의 가장 큰 특징은 절삭 가공이나 레이저 커팅과 달리 복잡한 3차원 형상을 비교적 쉽게 만들 수 있다는 것입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린터 선택

![image.png](../assets/04-01-learning-overview/asset-001.png)

3D 프린터 제조사는 매우 다양합니다.

교육용이나 개인용으로 많이 사용되는 제품군에는 Bambu Lab, Creality 등 여러 제조사의 제품이 있습니다.

이번 과정에서는 필자가 사용하는 Creality Ender-3 V3를 기준으로 설명합니다.

프린터마다 메뉴와 설정 방식에는 차이가 있지만, 기본적인 출력 과정은 대부분 비슷합니다.

따라서 특정 모델의 모든 기능을 암기하기보다 다음과 같은 공통적인 흐름을 이해하는 것이 중요합니다.

필라멘트 준비

↓

모델 준비

↓

Slicer 설정

↓

Slice

↓

G-Code 생성

↓

출력&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 속도

3D 프린터에서 출력 속도는 매우 중요한 요소입니다.

단순히 출력 시간을 줄이는 것뿐만 아니라 출력 안정성과 품질에도 영향을 줄 수 있습니다.

제품 하나를 출력하는 데 몇 시간이 걸리는 경우가 많기 때문에 출력 속도가 느리면 반복 실습에도 상당한 시간이 필요합니다.

따라서 교육용 프린터를 선택할 때는 다음 요소를 함께 고려하는 것이 좋습니다.

- 출력 속도
- 출력 가능 크기
- 자동 레벨링
- 유지보수성
- 소모품 가격
- Slicer 지원
- 네트워크 출력 지원

이번 과정에서는 세부적인 프린터 비교보다 실제 출력 방법을 익히는 데 집중합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트

![image.png](../assets/04-01-learning-overview/asset-002.png)

FDM 방식 3D 프린터에서 사용하는 재료를 필라멘트(Filament)라고 합니다.

필라멘트는 일반적으로 가느다란 플라스틱 실 형태로 만들어져 롤에 감긴 상태로 판매됩니다.

보통 1 kg 단위 제품을 쉽게 접할 수 있습니다.

대표적인 필라멘트 재료는 다음과 같습니다.

- PLA
- PETG
- ABS
- TPU

재료마다 강도, 유연성, 내열성, 출력 난이도 등이 다릅니다.

이번 과정에서는 가장 사용하기 쉬운 PLA를 중심으로 실습합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### PLA

PLA는 FDM 3D 프린팅에서 가장 많이 사용되는 재료 중 하나입니다.

주요 특징은 다음과 같습니다.

- 출력이 쉬움
- 뒤틀림이 비교적 적음
- 초보자가 사용하기 좋음
- 시제품과 교육용 제작에 적합
- 다양한 색상 제공

따라서 처음 3D 프린팅을 배우는 과정에서는 PLA가 매우 적합합니다.

본 과정에서도 대부분의 기계 부품을 PLA로 출력합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### ABS와 PETG

ABS는 PLA보다 높은 내열성과 충격 특성을 얻을 수 있는 경우가 있지만 출력 중 수축과 뒤틀림 관리가 더 까다로운 편입니다.

또한 출력 환경에서는 환기를 충분히 고려하는 것이 좋습니다.

PETG는 PLA와 ABS 사이의 특성을 가진 재료로 많이 사용됩니다.

일반적으로 다음과 같은 특징이 있습니다.

- PLA보다 질긴 편
- 내수성이 우수한 편
- 출력 난이도가 비교적 낮음
- 기능성 부품 제작에 활용 가능

하지만 이번 기초 과정에서는 재료별 특성을 깊게 다루지 않고 PLA 중심으로 진행합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### TPU

TPU는 고무와 비슷한 탄성을 가진 유연한 필라멘트입니다.

앞에서 설계한 컨베이어 벨트와 같이 유연성이 필요한 부품을 만들 때 사용할 수 있습니다.

주요 특징은 다음과 같습니다.

- 높은 탄성
- 충격 흡수
- 마찰력이 높음
- 휘거나 늘어나는 부품 제작 가능

PLA와 출력 특성이 다르므로 실제 출력에서는 별도의 설정이 필요할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트 준비

![image.png](../assets/04-01-learning-overview/asset-002.png)

3D 프린터와 필라멘트가 준비되었다면 먼저 필라멘트를 프린터에 장착해야 합니다.

프린터에 따라 메뉴 이름은 조금 다를 수 있지만 일반적으로 다음과 같은 기능이 있습니다.

- 삽입 또는 Load
- 배출 또는 Unload
- Extrude
- Retract

이번 과정에서는 Ender-3 V3를 기준으로 설명합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트가 꼬이지 않도록 관리

![image.png](../assets/04-01-learning-overview/asset-003.png)

필라멘트를 다룰 때 가장 중요한 것 중 하나는 필라멘트가 서로 꼬이지 않도록 관리하는 것입니다.

롤에서 풀려 나온 필라멘트 끝이 다른 필라멘트 아래로 들어가면 출력 중에 서로 걸릴 수 있습니다.

이 경우 필라멘트 공급이 멈추면서 출력이 실패할 수 있습니다.

따라서 필라멘트를 사용하지 않을 때는 롤에 있는 고정 구멍에 끝부분을 반드시 끼워 두는 습관을 들이는 것이 좋습니다.

&amp;gt; 필라멘트는 항상 꼬이지 않은 상태로 관리합니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트 끝 다듬기

![image.png](../assets/04-01-learning-overview/asset-004.png)

필라멘트를 프린터에 넣을 때 끝부분이 찌그러져 있거나 둥글면 내부 튜브나 공급 장치에 잘 들어가지 않을 수 있습니다.

따라서 필라멘트 끝을 가위나 니퍼로 비스듬하게 잘라 뾰족하게 만들어 두면 삽입이 편리합니다.

작은 작업이지만 실제로 필라멘트를 자주 교체하다 보면 매우 유용한 습관입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;12&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트 삽입

![image.png](../assets/04-01-learning-overview/asset-005.png)

필라멘트를 장착하는 기본 순서는 다음과 같습니다.

1. 필라멘트 잠금 레버를 해제한다.
2. 필라멘트 끝부분을 다듬는다.
3. 필라멘트를 공급구 안쪽으로 충분히 삽입한다.
4. 필라멘트 잠금 레버를 다시 고정한다.
5. 프린터의 Load 또는 Extrude 기능을 실행한다.

프린터는 노즐을 필요한 온도까지 가열한 뒤 필라멘트를 내부로 공급합니다.

정상적으로 장착되었다면 노즐 끝에서 녹은 필라멘트가 조금씩 나오는 것을 확인할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;13&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트 배출

![image.png](../assets/04-01-learning-overview/asset-006.png)

필라멘트를 교체하거나 사용을 종료할 때는 프린터의 Unload 또는 배출 기능을 사용합니다.

기본적인 순서는 다음과 같습니다.

1. Unload 실행
2. 노즐 가열
3. 필라멘트가 내부에서 빠져나올 수 있는 상태로 이동
4. 잠금 레버 해제
5. 필라멘트를 천천히 당겨 제거
6. 롤의 고정 구멍에 필라멘트 끝을 고정

사용 후에도 필라멘트가 풀리지 않도록 정리하는 것이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;14&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린팅 전체 흐름

3D 프린팅을 하기 위해서는 CAD에서 만든 3D 모델을 프린터가 이해할 수 있는 형태로 변환해야 합니다.

가장 기본적인 흐름은 다음과 같습니다.

3D CAD 모델

↓

STL 또는 3MF

↓

Slicer

↓

G-Code

↓

3D Printer

Fusion에서 만든 3D 모델을 그대로 프린터에 보내는 것이 아니라 먼저 STL 또는 3MF와 같은 출력용 데이터로 변환합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;15&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### STL

STL은 3D 모델의 표면을 작은 삼각형 면들의 집합으로 표현하는 Mesh 형식입니다.

3D 프린팅에서 오랫동안 널리 사용되어 온 파일 형식입니다.

Fusion에서 출력하려는 부품을 선택한 뒤 Mesh 또는 STL 형식으로 내보낼 수 있습니다.

STL 파일에는 제품의 형상 정보가 포함되어 있지만 실제 프린터의 이동 경로나 온도, 출력 속도 등의 정보는 없습니다.

이 작업을 수행하는 프로그램이 Slicer입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;16&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Slicer

Slicer는 3D 모델을 프린터가 출력할 수 있도록 여러 층으로 나누고, 프린터가 이동해야 할 경로를 계산하는 프로그램입니다.

즉,

STL

↓

Slicer

↓

G-Code

의 역할을 합니다.

Slicer에서는 다음과 같은 다양한 조건을 설정할 수 있습니다.

- Layer Height
- Printing Speed
- Nozzle Temperature
- Bed Temperature
- Infill
- Wall
- Support
- Brim
- Raft

이번 과정에서는 모든 설정을 깊게 다루기보다 실제 출력에 필요한 기본 기능만 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;17&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Creality Print

Creality 프린터를 사용하는 경우 Creality Print를 이용할 수 있습니다.

[https://www.creality.com/download#sparkx](https://www.creality.com/download#sparkx)

프로그램을 설치한 뒤 실행합니다.

![image.png](../assets/04-01-learning-overview/asset-007.png)

출력할 STL 파일을 작업 화면으로 드래그하면 모델이 가상 프린터 베드 위에 배치됩니다.

이 화면에서 실제 출력 전에 제품의 위치와 방향을 확인합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;18&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 프린터 모델 확인

Slicer에서 가장 먼저 확인해야 하는 것은 현재 선택된 프린터 모델입니다.

프린터마다 다음과 같은 조건이 다릅니다.

- 출력 가능 크기
- 노즐 구조
- 최대 이동 속도
- 베드 크기
- 지원 기능

따라서 실제 사용하는 프린터와 Slicer에서 선택된 프린터가 동일한지 반드시 확인해야 합니다.

이번 과정에서는 Ender-3 V3를 선택합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;19&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 필라멘트 설정 확인

사용하는 필라멘트의 종류도 확인합니다.

예를 들어 이번 과정에서는 Hyper PLA를 사용할 수 있습니다.

Slicer에서 PLA, PETG, TPU 등을 잘못 선택하면 다음과 같은 값이 달라질 수 있습니다.

- 노즐 온도
- 베드 온도
- 출력 속도
- 냉각 설정

따라서 출력 전에는 다음 두 가지를 항상 확인하는 습관을 들이는 것이 좋습니다.

- Printer
- Filament&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;20&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 방향

3D 프린팅에서 매우 중요한 요소 중 하나가 출력 방향입니다.

동일한 제품이라도 어떤 면을 바닥으로 놓느냐에 따라 다음 내용이 달라집니다.

- 출력 시간
- Support 사용량
- 표면 품질
- 강도
- 출력 실패 가능성

따라서 STL 파일을 불러온 뒤 바로 출력하지 말고 어떤 방향으로 출력하는 것이 가장 효율적인지 먼저 판단해야 합니다.

![image.png](../assets/04-01-learning-overview/asset-008.png)&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;21&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 공중에 떠 있는 형상

![image.png](../assets/04-01-learning-overview/asset-008.png)

FDM 프린터는 기본적으로 아래에서 위로 재료를 쌓습니다.

따라서 아래에 아무런 구조가 없는 부분을 그대로 공중에 출력하기는 어렵습니다.

예를 들어 모델과 베드 사이에 빈 공간이 있거나 큰 돌출부가 공중에 떠 있다면 정상적으로 출력되지 않을 수 있습니다.

이러한 문제를 해결하는 대표적인 방법은 두 가지입니다.

1. Support를 추가한다.
2. 제품의 출력 방향을 변경한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;22&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Support

![image.png](../assets/04-01-learning-overview/asset-009.png)

Support는 출력 과정에서 공중에 떠 있는 형상을 임시로 지지하기 위해 함께 출력하는 구조물입니다.

실제 제품의 일부가 아니라 출력이 완료된 뒤 제거합니다.

Slicer에서 Support 기능을 활성화하면 필요한 위치에 자동으로 생성할 수 있습니다.

대표적으로 다음과 같은 유형을 사용할 수 있습니다.

- Normal Support
- Tree Support&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;23&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Tree Support

![image.png](../assets/04-01-learning-overview/asset-009.png)

Tree Support는 나무의 가지처럼 필요한 부분으로 뻗어나가는 형태의 서포트입니다.

일반적인 Support보다 제품과 접촉하는 면적을 줄일 수 있고 복잡한 형상을 지지할 때 유리한 경우가 많습니다.

출력이 완료된 뒤 제거하기도 비교적 편리한 편입니다.

따라서 이번 과정에서는 자동 Tree Support를 중심으로 사용합니다.

단, 모든 형상에서 Tree Support가 항상 가장 좋은 것은 아니므로 제품 형상에 따라 적절한 방식을 선택해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;24&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 일반 Support

![image.png](../assets/04-01-learning-overview/asset-009.png)

일반 Support는 제품 아래쪽에 규칙적인 구조를 만들어 지지합니다.

단순한 형상에서는 안정적으로 사용할 수 있지만 제품과 접촉하는 면적이 많아지는 경우 제거가 어렵거나 표면 흔적이 많이 남을 수 있습니다.

따라서 동일한 제품이라도 두 방식을 비교해 보는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;25&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Slice

모델 위치와 Support 등의 설정이 완료되면 Slice 작업을 수행합니다.

Creality Print에서는 `Slice Plate`와 같은 기능을 사용합니다.

Slice를 실행하면 Slicer가 모델을 수많은 층으로 나누고 각 층에서 노즐이 이동할 경로를 계산합니다.

그 결과 최종적인 G-Code가 생성됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;26&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 방향 변경

![image.png](../assets/04-01-learning-overview/asset-010.png)

Support를 많이 사용하는 것보다 제품의 방향을 바꾸는 것이 더 좋은 경우도 있습니다.

예를 들어 넓고 평평한 면이 있다면 그 면이 베드에 닿도록 모델을 회전시키면 Support 사용량을 크게 줄일 수 있습니다.

Slicer에서는 제품을 선택한 뒤 바닥으로 사용할 면을 지정하는 기능을 사용할 수 있습니다.

Creality Print의 경우 `Lay on Face`와 같은 기능을 이용하여 원하는 면이 베드에 닿도록 자동으로 회전시킬 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;27&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### Support를 줄이는 이유

![image.png](../assets/04-01-learning-overview/asset-011.png)

Support를 사용하면 복잡한 형상을 출력할 수 있지만 다음과 같은 단점이 있습니다.

- 출력 시간 증가
- 필라멘트 사용량 증가
- 제거 작업 필요
- 표면 품질 저하 가능
- 후처리 시간 증가

따라서 가능하다면 먼저 제품의 방향을 조정하여 Support를 최소화한 뒤 필요한 부분에만 사용하는 것이 좋습니다.

&amp;gt; 좋은 3D 프린팅 설계는 Support를 얼마나 많이 만들 수 있는지가 아니라, Support 없이 또는 적게 출력할 수 있도록 설계하는 것입니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;28&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 설계 단계에서 출력 방향 고려

출력 방향은 Slicer에서만 결정하는 문제가 아닙니다.

설계 단계에서도 미리 고려하면 훨씬 좋은 결과를 얻을 수 있습니다.

예를 들어 다음과 같은 부분을 생각할 수 있습니다.

- 바닥에 놓을 수 있는 평평한 면 만들기
- 지나치게 큰 돌출부 피하기
- Support가 필요한 구조 최소화
- 출력 후 제거하기 어려운 내부 Support 피하기
- 적층 방향에 따른 강도 고려

따라서 3D 프린팅용 제품을 설계할 때는 모델링 단계부터 어떻게 출력할 것인지를 함께 생각해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;29&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 적층 방향과 강도

FDM 방식은 한 층씩 재료를 쌓아 만들기 때문에 방향에 따라 부품의 강도가 달라질 수 있습니다.

일반적으로 한 층 내부의 방향과 층과 층 사이의 결합 강도가 완전히 같지는 않습니다.

따라서 부품에 큰 힘이 작용하는 경우 출력 방향도 기계 설계의 중요한 요소가 됩니다.

이번 기초 과정에서는 정밀한 강도 계산까지 다루지 않지만 다음 정도는 기억해 두는 것이 좋습니다.

&amp;gt; 3D 프린팅 부품은 출력 방향까지 포함하여 설계해야 합니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;30&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 미리보기

![image.png](../assets/04-01-learning-overview/asset-012.png)

Slice가 완료되면 실제 프린터가 어떻게 움직일 것인지 미리 확인할 수 있습니다.

이때 다음과 같은 내용을 확인합니다.

- 제품 방향
- Support 위치
- 첫 번째 Layer
- 예상 출력 시간
- 예상 필라멘트 사용량

문제가 있다면 바로 출력하지 않고 다시 Prepare 화면으로 돌아가 방향이나 Support 설정을 수정합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;31&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### G-Code

Slice가 완료되면 실제 프린터에서 사용할 수 있는 G-Code가 만들어집니다.

G-Code에는 프린터의 구체적인 동작 정보가 포함됩니다.

예를 들어 다음과 같은 내용입니다.

- 노즐 위치
- 이동 속도
- 압출량
- 노즐 온도
- 베드 온도
- Layer 이동

따라서 3D 프린터는 원래 CAD 모델을 이해하는 것이 아니라 Slicer가 만들어 준 G-Code를 순서대로 실행한다고 볼 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;32&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 프린터로 전송

![image.png](../assets/04-01-learning-overview/asset-013.png)

출력 준비가 완료되면 G-Code를 프린터로 전달합니다.

전송 방식은 프린터 모델에 따라 다릅니다.

대표적으로 다음과 같은 방식이 있습니다.

- Network
- Wi-Fi
- Ethernet
- USB Memory
- SD Card

Ender-3 V3의 경우 사용할 수 있는 연결 방법 중 환경에 맞는 방식을 선택하면 됩니다.

네트워크 전송을 사용하면 PC에서 바로 프린터로 출력 데이터를 전달할 수 있어 편리합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;33&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 네트워크 연결

![image.png](../assets/04-01-learning-overview/asset-014.png)

네트워크로 출력하려면 PC와 3D 프린터가 서로 통신할 수 있어야 합니다.

일반적으로 같은 로컬 네트워크에 연결되어 있어야 합니다.

프린터의 네트워크 설정은 프린터 화면에서 직접 설정합니다.

그 후 Creality Print에서 장치를 검색하고 등록합니다.

장치가 정상적으로 등록되면 출력 데이터를 네트워크를 통해 전달할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;34&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 전 최종 확인

실제 출력을 시작하기 전에 다음 내용을 확인하는 습관을 들이는 것이 좋습니다.

- 올바른 프린터가 선택되어 있는가?
- 올바른 필라멘트가 선택되어 있는가?
- 모델이 베드 위에 정상적으로 놓여 있는가?
- Support가 필요한 부분에 생성되어 있는가?
- 출력 시간이 적절한가?
- 필라멘트가 충분한가?
- 베드에 이물질이 없는가?
- 필라멘트가 꼬여 있지 않은가?

출력 시간이 긴 제품은 중간에 실패하면 처음부터 다시 출력해야 할 수 있기 때문에 출력 전 확인이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;35&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 첫 번째 Layer

3D 프린팅에서 가장 중요한 부분 중 하나가 첫 번째 Layer입니다.

첫 번째 Layer가 베드에 제대로 붙지 않으면 이후의 모든 층이 정상적으로 출력되기 어렵습니다.

따라서 출력이 시작되면 처음 몇 분 동안은 다음 내용을 확인하는 것이 좋습니다.

- 필라멘트가 베드에 정상적으로 붙는가?
- 노즐이 너무 높거나 낮지 않은가?
- 출력물이 베드에서 밀리지 않는가?
- 필라멘트가 정상적으로 공급되는가?

첫 번째 Layer가 안정적으로 만들어지면 이후 출력도 정상적으로 진행될 가능성이 높아집니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;36&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력 실패

3D 프린팅에서는 출력 실패가 드문 일이 아닙니다.

대표적인 원인은 다음과 같습니다.

- 필라멘트 엉킴
- 첫 번째 Layer 접착 불량
- Support 부족
- 잘못된 출력 방향
- 필라멘트 부족
- 노즐 막힘
- 잘못된 Slicer 설정

처음에는 실패가 발생할 수 있지만 원인을 하나씩 확인하면서 설정을 조정하면 점차 안정적인 출력이 가능합니다.

이 과정 역시 실제 3D 프린팅을 배우는 중요한 부분입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;37&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린팅에서 기억해야 할 핵심

3D 프린팅은 단순히 STL 파일을 프린터에 넣고 출력하는 과정이 아닙니다.

전체 흐름을 이해하는 것이 중요합니다.

3D 모델링

↓

출력 방향 결정

↓

STL 또는 3MF 생성

↓

Slicer에서 프린터와 재료 설정

↓

Support 설정

↓

Slice

↓

G-Code 생성

↓

프린터로 전송

↓

출력

특히 다음 세 가지는 반드시 확인하는 습관을 들이는 것이 좋습니다.

1. 필라멘트가 꼬이지 않았는가?
2. 제품이 출력하기 좋은 방향으로 놓여 있는가?
3. 필요한 부분에 Support가 적용되어 있는가?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;38&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 설계와 3D 프린팅

이번 과정에서 가장 중요한 것은 단순히 3D 프린터를 사용하는 방법이 아닙니다.

앞에서 배운 설계와 제작 방식이 다시 연결됩니다.

3D 프린팅으로 제품을 제작한다면 처음부터 다음 내용을 고려하여 설계해야 합니다.

- 출력 방향
- Support
- 적층 방향
- 공차
- 조립 간극
- 필라멘트 특성
- 출력 시간

따라서 다음과 같은 흐름이 완성됩니다.

재료 선택

↓

3D 프린팅 선택

↓

3D 프린팅에 적합한 구조 설계

↓

3D 모델링

↓

Slicing

↓

G-Code

↓

실제 출력

↓

조립

앞서 컨베이어를 설계할 때 3D 프린팅을 먼저 제작 방식으로 선택했던 이유도 바로 여기에 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;39&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 이번 챕터의 목표

이번 챕터에서는 전문적인 3D 프린팅 기술 전체를 학습하지 않습니다.

제조사와 모델마다 세부 기능과 설정이 다르기 때문에 모든 내용을 하나의 과정에서 다루기는 어렵습니다.

이번 단계의 목표는 다음과 같습니다.

- FDM 방식의 기본 원리 이해
- 필라멘트 장착과 관리
- STL의 역할 이해
- Slicer의 역할 이해
- G-Code의 역할 이해
- 출력 방향 설정
- Support 사용
- Slice 수행
- 프린터로 전송
- 실제 부품 출력

이 정도를 익히면 앞에서 Fusion으로 설계한 부품을 직접 제작할 수 있는 기본적인 능력을 갖추게 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;40&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 다음 단계

이제 실제로 앞에서 모델링한 컨베이어 부품을 하나씩 출력해 봅니다.

출력하면서 다음 내용을 직접 확인합니다.

- CAD 치수와 실제 출력 치수의 차이
- 공차에 따른 조립성
- Support가 표면에 미치는 영향
- 출력 방향에 따른 품질 차이
- PLA와 TPU의 차이
- 실제 조립 과정에서 발생하는 문제

3D 모델링 화면에서 완성된 제품과 실제 손으로 만질 수 있는 제품은 분명히 다릅니다.

이제부터는 설계한 부품을 실제로 출력하고 조립하면서, 지금까지 배운 설계가 현실에서 어떻게 동작하는지를 확인해 보겠습니다.&lt;/p&gt;&lt;/div&gt;&lt;script&gt;/*!! License: https://unpkg.com/@marp-team/marp-cli@4.5.0/lib/bespoke.js.LICENSE.txt */

  <script>window.VIEWER_CONFIG={"title":"04-01. 전체 학습 주제 개요 및 학습 목표 이해","deck":"../marp/04-01-learning-overview.html","scripts":["<h2>오프닝</h2>\n<p>안녕하세요. 이번 영상에서는 전체 학습 주제 개요 및 학습 목표 이해에 대해 알아보겠습니다.</p>\n\n<p>핵심 개념을 실제 기계 설계와 제작 과정에 어떻게 적용하는지 순서대로 살펴보겠습니다.</p>","<h2>04-01. 전체 학습 주제 개요 및 학습 목표 이해</h2>\n<p class=\"screen\">[화면] 04-01. 전체 학습 주제 개요 및 학습 목표 이해</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 전체 학습 주제 개요 및 학습 목표 이해에 대해 살펴보겠습니다.</p>\n\n<p>지금까지 우리는 Fusion 360을 이용하여 3D 모델링을 하고, Fusion과 nanoCAD를 이용하여 2D 제작 도면도 만들어 보았습니다.</p>\n\n<p>2D CAD를 이용한 제작은 빠르고 비용이 낮다는 장점이 있지만, 기본적으로 판재 형상을 중심으로 제작해야 한다는 제약이 있습니다.</p>\n\n<p>반면 3D 프린팅은 훨씬 자유로운 형상을 제작할 수 있습니다.</p>\n\n<p>제작 속도는 느리지만 복잡한 형상의 제품을 비교적 저렴한 비용으로 만들 수 있다는 것이 가장 큰 장점입니다.</p>\n\n<p>3D 프린팅에는 재료와 출력 방식에 따라 다양한 기술이 존재하지만, 이번 과정에서는 교육용과 개인용으로 가장 쉽게 접할 수 있는 FDM 방식만 다룹니다.</p>","<h2>FDM 방식</h2>\n<p class=\"screen\">[화면] FDM 방식</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 FDM 방식에 대해 살펴보겠습니다.</p>\n\n<p>FDM은 필라멘트 형태의 플라스틱 재료를 녹여 한 층씩 쌓아 올리는 방식입니다.</p>\n\n<p>기본적인 동작 과정은 다음과 같습니다.</p>\n\n<p>필라멘트</p>\n\n<p>↓</p>\n\n<p>노즐에서 가열</p>\n\n<p>↓</p>\n\n<p>녹은 재료 배출</p>\n\n<p>↓</p>\n\n<p>한 층씩 적층</p>\n\n<p>↓</p>\n\n<p>3D 형상 완성</p>\n\n<p>따라서 앞에서 학습했던 적층 가공(Additive Manufacturing)의 대표적인 방식이라고 볼 수 있습니다.</p>\n\n<p>3D 프린팅의 가장 큰 특징은 절삭 가공이나 레이저 커팅과 달리 복잡한 3차원 형상을 비교적 쉽게 만들 수 있다는 것입니다.</p>","<h2>3D 프린터 선택</h2>\n<p class=\"screen\">[화면] 3D 프린터 선택</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린터 선택에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터 제조사는 매우 다양합니다.</p>\n\n<p>교육용이나 개인용으로 많이 사용되는 제품군에는 Bambu Lab, Creality 등 여러 제조사의 제품이 있습니다.</p>\n\n<p>이번 과정에서는 필자가 사용하는 Creality Ender-3 V3를 기준으로 설명합니다.</p>\n\n<p>프린터마다 메뉴와 설정 방식에는 차이가 있지만, 기본적인 출력 과정은 대부분 비슷합니다.</p>\n\n<p>따라서 특정 모델의 모든 기능을 암기하기보다 다음과 같은 공통적인 흐름을 이해하는 것이 중요합니다.</p>\n\n<p>필라멘트 준비</p>\n\n<p>↓</p>\n\n<p>모델 준비</p>\n\n<p>↓</p>\n\n<p>Slicer 설정</p>\n\n<p>↓</p>\n\n<p>Slice</p>\n\n<p>↓</p>\n\n<p>G-Code 생성</p>\n\n<p>↓</p>\n\n<p>출력</p>","<h2>출력 속도</h2>\n<p class=\"screen\">[화면] 출력 속도</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 속도에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터에서 출력 속도는 매우 중요한 요소입니다.</p>\n\n<p>단순히 출력 시간을 줄이는 것뿐만 아니라 출력 안정성과 품질에도 영향을 줄 수 있습니다.</p>\n\n<p>제품 하나를 출력하는 데 몇 시간이 걸리는 경우가 많기 때문에 출력 속도가 느리면 반복 실습에도 상당한 시간이 필요합니다.</p>\n\n<p>따라서 교육용 프린터를 선택할 때는 다음 요소를 함께 고려하는 것이 좋습니다.</p>\n\n<p>출력 속도입니다.</p>\n\n<p>출력 가능 크기입니다.</p>\n\n<p>자동 레벨링입니다.</p>\n\n<p>유지보수성입니다.</p>\n\n<p>소모품 가격입니다.</p>\n\n<p>Slicer 지원입니다.</p>\n\n<p>네트워크 출력 지원입니다.</p>\n\n<p>이번 과정에서는 세부적인 프린터 비교보다 실제 출력 방법을 익히는 데 집중합니다.</p>","<h2>필라멘트</h2>\n<p class=\"screen\">[화면] 필라멘트</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트에 대해 살펴보겠습니다.</p>\n\n<p>FDM 방식 3D 프린터에서 사용하는 재료를 필라멘트(Filament)라고 합니다.</p>\n\n<p>필라멘트는 일반적으로 가느다란 플라스틱 실 형태로 만들어져 롤에 감긴 상태로 판매됩니다.</p>\n\n<p>보통 1 kg 단위 제품을 쉽게 접할 수 있습니다.</p>\n\n<p>대표적인 필라멘트 재료는 다음과 같습니다.</p>\n\n<p>PLA입니다.</p>\n\n<p>PETG입니다.</p>\n\n<p>ABS입니다.</p>\n\n<p>TPU입니다.</p>\n\n<p>재료마다 강도, 유연성, 내열성, 출력 난이도 등이 다릅니다.</p>\n\n<p>이번 과정에서는 가장 사용하기 쉬운 PLA를 중심으로 실습합니다.</p>","<h2>PLA</h2>\n<p class=\"screen\">[화면] PLA</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 PLA에 대해 살펴보겠습니다.</p>\n\n<p>PLA는 FDM 3D 프린팅에서 가장 많이 사용되는 재료 중 하나입니다.</p>\n\n<p>주요 특징은 다음과 같습니다.</p>\n\n<p>출력이 쉬움입니다.</p>\n\n<p>뒤틀림이 비교적 적음입니다.</p>\n\n<p>초보자가 사용하기 좋음입니다.</p>\n\n<p>시제품과 교육용 제작에 적합입니다.</p>\n\n<p>다양한 색상 제공입니다.</p>\n\n<p>따라서 처음 3D 프린팅을 배우는 과정에서는 PLA가 매우 적합합니다.</p>\n\n<p>본 과정에서도 대부분의 기계 부품을 PLA로 출력합니다.</p>","<h2>ABS와 PETG</h2>\n<p class=\"screen\">[화면] ABS와 PETG</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 ABS와 PETG에 대해 살펴보겠습니다.</p>\n\n<p>ABS는 PLA보다 높은 내열성과 충격 특성을 얻을 수 있는 경우가 있지만 출력 중 수축과 뒤틀림 관리가 더 까다로운 편입니다.</p>\n\n<p>또한 출력 환경에서는 환기를 충분히 고려하는 것이 좋습니다.</p>\n\n<p>PETG는 PLA와 ABS 사이의 특성을 가진 재료로 많이 사용됩니다.</p>\n\n<p>일반적으로 다음과 같은 특징이 있습니다.</p>\n\n<p>PLA보다 질긴 편입니다.</p>\n\n<p>내수성이 우수한 편입니다.</p>\n\n<p>출력 난이도가 비교적 낮음입니다.</p>\n\n<p>기능성 부품 제작에 활용 가능입니다.</p>\n\n<p>하지만 이번 기초 과정에서는 재료별 특성을 깊게 다루지 않고 PLA 중심으로 진행합니다.</p>","<h2>TPU</h2>\n<p class=\"screen\">[화면] TPU</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 TPU에 대해 살펴보겠습니다.</p>\n\n<p>TPU는 고무와 비슷한 탄성을 가진 유연한 필라멘트입니다.</p>\n\n<p>앞에서 설계한 컨베이어 벨트와 같이 유연성이 필요한 부품을 만들 때 사용할 수 있습니다.</p>\n\n<p>주요 특징은 다음과 같습니다.</p>\n\n<p>높은 탄성입니다.</p>\n\n<p>충격 흡수입니다.</p>\n\n<p>마찰력이 높음입니다.</p>\n\n<p>휘거나 늘어나는 부품 제작 가능입니다.</p>\n\n<p>PLA와 출력 특성이 다르므로 실제 출력에서는 별도의 설정이 필요할 수 있습니다.</p>","<h2>필라멘트 준비</h2>\n<p class=\"screen\">[화면] 필라멘트 준비</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트 준비에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터와 필라멘트가 준비되었다면 먼저 필라멘트를 프린터에 장착해야 합니다.</p>\n\n<p>프린터에 따라 메뉴 이름은 조금 다를 수 있지만 일반적으로 다음과 같은 기능이 있습니다.</p>\n\n<p>삽입 또는 Load입니다.</p>\n\n<p>배출 또는 Unload입니다.</p>\n\n<p>Extrude입니다.</p>\n\n<p>Retract입니다.</p>\n\n<p>이번 과정에서는 Ender-3 V3를 기준으로 설명합니다.</p>","<h2>필라멘트가 꼬이지 않도록 관리</h2>\n<p class=\"screen\">[화면] 필라멘트가 꼬이지 않도록 관리</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트가 꼬이지 않도록 관리에 대해 살펴보겠습니다.</p>\n\n<p>필라멘트를 다룰 때 가장 중요한 것 중 하나는 필라멘트가 서로 꼬이지 않도록 관리하는 것입니다.</p>\n\n<p>롤에서 풀려 나온 필라멘트 끝이 다른 필라멘트 아래로 들어가면 출력 중에 서로 걸릴 수 있습니다.</p>\n\n<p>이 경우 필라멘트 공급이 멈추면서 출력이 실패할 수 있습니다.</p>\n\n<p>따라서 필라멘트를 사용하지 않을 때는 롤에 있는 고정 구멍에 끝부분을 반드시 끼워 두는 습관을 들이는 것이 좋습니다.</p>\n\n<p>&gt; 필라멘트는 항상 꼬이지 않은 상태로 관리합니다.</p>\n\n<p>&gt;</p>","<h2>필라멘트 끝 다듬기</h2>\n<p class=\"screen\">[화면] 필라멘트 끝 다듬기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트 끝 다듬기에 대해 살펴보겠습니다.</p>\n\n<p>필라멘트를 프린터에 넣을 때 끝부분이 찌그러져 있거나 둥글면 내부 튜브나 공급 장치에 잘 들어가지 않을 수 있습니다.</p>\n\n<p>따라서 필라멘트 끝을 가위나 니퍼로 비스듬하게 잘라 뾰족하게 만들어 두면 삽입이 편리합니다.</p>\n\n<p>작은 작업이지만 실제로 필라멘트를 자주 교체하다 보면 매우 유용한 습관입니다.</p>","<h2>필라멘트 삽입</h2>\n<p class=\"screen\">[화면] 필라멘트 삽입</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트 삽입에 대해 살펴보겠습니다.</p>\n\n<p>필라멘트를 장착하는 기본 순서는 다음과 같습니다.</p>\n\n<p>필라멘트 잠금 레버를 해제한다.</p>\n\n<p>필라멘트 끝부분을 다듬는다.</p>\n\n<p>필라멘트를 공급구 안쪽으로 충분히 삽입한다.</p>\n\n<p>필라멘트 잠금 레버를 다시 고정한다.</p>\n\n<p>프린터의 Load 또는 Extrude 기능을 실행한다.</p>\n\n<p>프린터는 노즐을 필요한 온도까지 가열한 뒤 필라멘트를 내부로 공급합니다.</p>\n\n<p>정상적으로 장착되었다면 노즐 끝에서 녹은 필라멘트가 조금씩 나오는 것을 확인할 수 있습니다.</p>","<h2>필라멘트 배출</h2>\n<p class=\"screen\">[화면] 필라멘트 배출</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트 배출에 대해 살펴보겠습니다.</p>\n\n<p>필라멘트를 교체하거나 사용을 종료할 때는 프린터의 Unload 또는 배출 기능을 사용합니다.</p>\n\n<p>기본적인 순서는 다음과 같습니다.</p>\n\n<p>Unload 실행</p>\n\n<p>노즐 가열</p>\n\n<p>필라멘트가 내부에서 빠져나올 수 있는 상태로 이동</p>\n\n<p>잠금 레버 해제</p>\n\n<p>필라멘트를 천천히 당겨 제거</p>\n\n<p>롤의 고정 구멍에 필라멘트 끝을 고정</p>\n\n<p>사용 후에도 필라멘트가 풀리지 않도록 정리하는 것이 중요합니다.</p>","<h2>3D 프린팅 전체 흐름</h2>\n<p class=\"screen\">[화면] 3D 프린팅 전체 흐름</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린팅 전체 흐름에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅을 하기 위해서는 CAD에서 만든 3D 모델을 프린터가 이해할 수 있는 형태로 변환해야 합니다.</p>\n\n<p>가장 기본적인 흐름은 다음과 같습니다.</p>\n\n<p>3D CAD 모델</p>\n\n<p>↓</p>\n\n<p>STL 또는 3MF</p>\n\n<p>↓</p>\n\n<p>Slicer</p>\n\n<p>↓</p>\n\n<p>G-Code</p>\n\n<p>↓</p>\n\n<p>3D Printer</p>\n\n<p>Fusion에서 만든 3D 모델을 그대로 프린터에 보내는 것이 아니라 먼저 STL 또는 3MF와 같은 출력용 데이터로 변환합니다.</p>","<h2>STL</h2>\n<p class=\"screen\">[화면] STL</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 STL에 대해 살펴보겠습니다.</p>\n\n<p>STL은 3D 모델의 표면을 작은 삼각형 면들의 집합으로 표현하는 Mesh 형식입니다.</p>\n\n<p>3D 프린팅에서 오랫동안 널리 사용되어 온 파일 형식입니다.</p>\n\n<p>Fusion에서 출력하려는 부품을 선택한 뒤 Mesh 또는 STL 형식으로 내보낼 수 있습니다.</p>\n\n<p>STL 파일에는 제품의 형상 정보가 포함되어 있지만 실제 프린터의 이동 경로나 온도, 출력 속도 등의 정보는 없습니다.</p>\n\n<p>이 작업을 수행하는 프로그램이 Slicer입니다.</p>","<h2>Slicer</h2>\n<p class=\"screen\">[화면] Slicer</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Slicer에 대해 살펴보겠습니다.</p>\n\n<p>Slicer는 3D 모델을 프린터가 출력할 수 있도록 여러 층으로 나누고, 프린터가 이동해야 할 경로를 계산하는 프로그램입니다.</p>\n\n<p>즉,</p>\n\n<p>STL</p>\n\n<p>↓</p>\n\n<p>Slicer</p>\n\n<p>↓</p>\n\n<p>G-Code</p>\n\n<p>의 역할을 합니다.</p>\n\n<p>Slicer에서는 다음과 같은 다양한 조건을 설정할 수 있습니다.</p>\n\n<p>Layer Height입니다.</p>\n\n<p>Printing Speed입니다.</p>\n\n<p>Nozzle Temperature입니다.</p>\n\n<p>Bed Temperature입니다.</p>\n\n<p>Infill입니다.</p>\n\n<p>Wall입니다.</p>\n\n<p>Support입니다.</p>\n\n<p>Brim입니다.</p>\n\n<p>Raft입니다.</p>\n\n<p>이번 과정에서는 모든 설정을 깊게 다루기보다 실제 출력에 필요한 기본 기능만 사용합니다.</p>","<h2>Creality Print</h2>\n<p class=\"screen\">[화면] Creality Print</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Creality Print에 대해 살펴보겠습니다.</p>\n\n<p>Creality 프린터를 사용하는 경우 Creality Print를 이용할 수 있습니다.</p>\n\n<p>https://www.creality.com/download#sparkx</p>\n\n<p>프로그램을 설치한 뒤 실행합니다.</p>\n\n<p>출력할 STL 파일을 작업 화면으로 드래그하면 모델이 가상 프린터 베드 위에 배치됩니다.</p>\n\n<p>이 화면에서 실제 출력 전에 제품의 위치와 방향을 확인합니다.</p>","<h2>프린터 모델 확인</h2>\n<p class=\"screen\">[화면] 프린터 모델 확인</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 프린터 모델 확인에 대해 살펴보겠습니다.</p>\n\n<p>Slicer에서 가장 먼저 확인해야 하는 것은 현재 선택된 프린터 모델입니다.</p>\n\n<p>프린터마다 다음과 같은 조건이 다릅니다.</p>\n\n<p>출력 가능 크기입니다.</p>\n\n<p>노즐 구조입니다.</p>\n\n<p>최대 이동 속도입니다.</p>\n\n<p>베드 크기입니다.</p>\n\n<p>지원 기능입니다.</p>\n\n<p>따라서 실제 사용하는 프린터와 Slicer에서 선택된 프린터가 동일한지 반드시 확인해야 합니다.</p>\n\n<p>이번 과정에서는 Ender-3 V3를 선택합니다.</p>","<h2>필라멘트 설정 확인</h2>\n<p class=\"screen\">[화면] 필라멘트 설정 확인</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 필라멘트 설정 확인에 대해 살펴보겠습니다.</p>\n\n<p>사용하는 필라멘트의 종류도 확인합니다.</p>\n\n<p>예를 들어 이번 과정에서는 Hyper PLA를 사용할 수 있습니다.</p>\n\n<p>Slicer에서 PLA, PETG, TPU 등을 잘못 선택하면 다음과 같은 값이 달라질 수 있습니다.</p>\n\n<p>노즐 온도입니다.</p>\n\n<p>베드 온도입니다.</p>\n\n<p>출력 속도입니다.</p>\n\n<p>냉각 설정입니다.</p>\n\n<p>따라서 출력 전에는 다음 두 가지를 항상 확인하는 습관을 들이는 것이 좋습니다.</p>\n\n<p>Printer입니다.</p>\n\n<p>Filament입니다.</p>","<h2>출력 방향</h2>\n<p class=\"screen\">[화면] 출력 방향</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 방향에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅에서 매우 중요한 요소 중 하나가 출력 방향입니다.</p>\n\n<p>동일한 제품이라도 어떤 면을 바닥으로 놓느냐에 따라 다음 내용이 달라집니다.</p>\n\n<p>출력 시간입니다.</p>\n\n<p>Support 사용량입니다.</p>\n\n<p>표면 품질입니다.</p>\n\n<p>강도입니다.</p>\n\n<p>출력 실패 가능성입니다.</p>\n\n<p>따라서 STL 파일을 불러온 뒤 바로 출력하지 말고 어떤 방향으로 출력하는 것이 가장 효율적인지 먼저 판단해야 합니다.</p>","<h2>공중에 떠 있는 형상</h2>\n<p class=\"screen\">[화면] 공중에 떠 있는 형상</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 공중에 떠 있는 형상에 대해 살펴보겠습니다.</p>\n\n<p>FDM 프린터는 기본적으로 아래에서 위로 재료를 쌓습니다.</p>\n\n<p>따라서 아래에 아무런 구조가 없는 부분을 그대로 공중에 출력하기는 어렵습니다.</p>\n\n<p>예를 들어 모델과 베드 사이에 빈 공간이 있거나 큰 돌출부가 공중에 떠 있다면 정상적으로 출력되지 않을 수 있습니다.</p>\n\n<p>이러한 문제를 해결하는 대표적인 방법은 두 가지입니다.</p>\n\n<p>Support를 추가한다.</p>\n\n<p>제품의 출력 방향을 변경한다.</p>","<h2>Support</h2>\n<p class=\"screen\">[화면] Support</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Support에 대해 살펴보겠습니다.</p>\n\n<p>Support는 출력 과정에서 공중에 떠 있는 형상을 임시로 지지하기 위해 함께 출력하는 구조물입니다.</p>\n\n<p>실제 제품의 일부가 아니라 출력이 완료된 뒤 제거합니다.</p>\n\n<p>Slicer에서 Support 기능을 활성화하면 필요한 위치에 자동으로 생성할 수 있습니다.</p>\n\n<p>대표적으로 다음과 같은 유형을 사용할 수 있습니다.</p>\n\n<p>Normal Support입니다.</p>\n\n<p>Tree Support입니다.</p>","<h2>Tree Support</h2>\n<p class=\"screen\">[화면] Tree Support</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Tree Support에 대해 살펴보겠습니다.</p>\n\n<p>Tree Support는 나무의 가지처럼 필요한 부분으로 뻗어나가는 형태의 서포트입니다.</p>\n\n<p>일반적인 Support보다 제품과 접촉하는 면적을 줄일 수 있고 복잡한 형상을 지지할 때 유리한 경우가 많습니다.</p>\n\n<p>출력이 완료된 뒤 제거하기도 비교적 편리한 편입니다.</p>\n\n<p>따라서 이번 과정에서는 자동 Tree Support를 중심으로 사용합니다.</p>\n\n<p>단, 모든 형상에서 Tree Support가 항상 가장 좋은 것은 아니므로 제품 형상에 따라 적절한 방식을 선택해야 합니다.</p>","<h2>일반 Support</h2>\n<p class=\"screen\">[화면] 일반 Support</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 일반 Support에 대해 살펴보겠습니다.</p>\n\n<p>일반 Support는 제품 아래쪽에 규칙적인 구조를 만들어 지지합니다.</p>\n\n<p>단순한 형상에서는 안정적으로 사용할 수 있지만 제품과 접촉하는 면적이 많아지는 경우 제거가 어렵거나 표면 흔적이 많이 남을 수 있습니다.</p>\n\n<p>따라서 동일한 제품이라도 두 방식을 비교해 보는 것이 좋습니다.</p>","<h2>Slice</h2>\n<p class=\"screen\">[화면] Slice</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Slice에 대해 살펴보겠습니다.</p>\n\n<p>모델 위치와 Support 등의 설정이 완료되면 Slice 작업을 수행합니다.</p>\n\n<p>Creality Print에서는 Slice Plate와 같은 기능을 사용합니다.</p>\n\n<p>Slice를 실행하면 Slicer가 모델을 수많은 층으로 나누고 각 층에서 노즐이 이동할 경로를 계산합니다.</p>\n\n<p>그 결과 최종적인 G-Code가 생성됩니다.</p>","<h2>출력 방향 변경</h2>\n<p class=\"screen\">[화면] 출력 방향 변경</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 방향 변경에 대해 살펴보겠습니다.</p>\n\n<p>Support를 많이 사용하는 것보다 제품의 방향을 바꾸는 것이 더 좋은 경우도 있습니다.</p>\n\n<p>예를 들어 넓고 평평한 면이 있다면 그 면이 베드에 닿도록 모델을 회전시키면 Support 사용량을 크게 줄일 수 있습니다.</p>\n\n<p>Slicer에서는 제품을 선택한 뒤 바닥으로 사용할 면을 지정하는 기능을 사용할 수 있습니다.</p>\n\n<p>Creality Print의 경우 Lay on Face와 같은 기능을 이용하여 원하는 면이 베드에 닿도록 자동으로 회전시킬 수 있습니다.</p>","<h2>Support를 줄이는 이유</h2>\n<p class=\"screen\">[화면] Support를 줄이는 이유</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 Support를 줄이는 이유에 대해 살펴보겠습니다.</p>\n\n<p>Support를 사용하면 복잡한 형상을 출력할 수 있지만 다음과 같은 단점이 있습니다.</p>\n\n<p>출력 시간 증가입니다.</p>\n\n<p>필라멘트 사용량 증가입니다.</p>\n\n<p>제거 작업 필요</p>\n\n<p>표면 품질 저하 가능입니다.</p>\n\n<p>후처리 시간 증가입니다.</p>\n\n<p>따라서 가능하다면 먼저 제품의 방향을 조정하여 Support를 최소화한 뒤 필요한 부분에만 사용하는 것이 좋습니다.</p>\n\n<p>&gt; 좋은 3D 프린팅 설계는 Support를 얼마나 많이 만들 수 있는지가 아니라, Support 없이 또는 적게 출력할 수 있도록 설계하는 것입니다.</p>\n\n<p>&gt;</p>","<h2>설계 단계에서 출력 방향 고려</h2>\n<p class=\"screen\">[화면] 설계 단계에서 출력 방향 고려</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 설계 단계에서 출력 방향 고려에 대해 살펴보겠습니다.</p>\n\n<p>출력 방향은 Slicer에서만 결정하는 문제가 아닙니다.</p>\n\n<p>설계 단계에서도 미리 고려하면 훨씬 좋은 결과를 얻을 수 있습니다.</p>\n\n<p>예를 들어 다음과 같은 부분을 생각할 수 있습니다.</p>\n\n<p>바닥에 놓을 수 있는 평평한 면 만들기입니다.</p>\n\n<p>지나치게 큰 돌출부 피하기입니다.</p>\n\n<p>Support가 필요한 구조 최소화입니다.</p>\n\n<p>출력 후 제거하기 어려운 내부 Support 피하기입니다.</p>\n\n<p>적층 방향에 따른 강도 고려입니다.</p>\n\n<p>따라서 3D 프린팅용 제품을 설계할 때는 모델링 단계부터 어떻게 출력할 것인지를 함께 생각해야 합니다.</p>","<h2>적층 방향과 강도</h2>\n<p class=\"screen\">[화면] 적층 방향과 강도</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 적층 방향과 강도에 대해 살펴보겠습니다.</p>\n\n<p>FDM 방식은 한 층씩 재료를 쌓아 만들기 때문에 방향에 따라 부품의 강도가 달라질 수 있습니다.</p>\n\n<p>일반적으로 한 층 내부의 방향과 층과 층 사이의 결합 강도가 완전히 같지는 않습니다.</p>\n\n<p>따라서 부품에 큰 힘이 작용하는 경우 출력 방향도 기계 설계의 중요한 요소가 됩니다.</p>\n\n<p>이번 기초 과정에서는 정밀한 강도 계산까지 다루지 않지만 다음 정도는 기억해 두는 것이 좋습니다.</p>\n\n<p>&gt; 3D 프린팅 부품은 출력 방향까지 포함하여 설계해야 합니다.</p>\n\n<p>&gt;</p>","<h2>출력 미리보기</h2>\n<p class=\"screen\">[화면] 출력 미리보기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 미리보기에 대해 살펴보겠습니다.</p>\n\n<p>Slice가 완료되면 실제 프린터가 어떻게 움직일 것인지 미리 확인할 수 있습니다.</p>\n\n<p>이때 다음과 같은 내용을 확인합니다.</p>\n\n<p>제품 방향입니다.</p>\n\n<p>Support 위치입니다.</p>\n\n<p>첫 번째 Layer입니다.</p>\n\n<p>예상 출력 시간입니다.</p>\n\n<p>예상 필라멘트 사용량입니다.</p>\n\n<p>문제가 있다면 바로 출력하지 않고 다시 Prepare 화면으로 돌아가 방향이나 Support 설정을 수정합니다.</p>","<h2>G-Code</h2>\n<p class=\"screen\">[화면] G-Code</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 G-Code에 대해 살펴보겠습니다.</p>\n\n<p>Slice가 완료되면 실제 프린터에서 사용할 수 있는 G-Code가 만들어집니다.</p>\n\n<p>G-Code에는 프린터의 구체적인 동작 정보가 포함됩니다.</p>\n\n<p>예를 들어 다음과 같은 내용입니다.</p>\n\n<p>노즐 위치입니다.</p>\n\n<p>이동 속도입니다.</p>\n\n<p>압출량입니다.</p>\n\n<p>노즐 온도입니다.</p>\n\n<p>베드 온도입니다.</p>\n\n<p>Layer 이동입니다.</p>\n\n<p>따라서 3D 프린터는 원래 CAD 모델을 이해하는 것이 아니라 Slicer가 만들어 준 G-Code를 순서대로 실행한다고 볼 수 있습니다.</p>","<h2>프린터로 전송</h2>\n<p class=\"screen\">[화면] 프린터로 전송</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 프린터로 전송에 대해 살펴보겠습니다.</p>\n\n<p>출력 준비가 완료되면 G-Code를 프린터로 전달합니다.</p>\n\n<p>전송 방식은 프린터 모델에 따라 다릅니다.</p>\n\n<p>대표적으로 다음과 같은 방식이 있습니다.</p>\n\n<p>Network입니다.</p>\n\n<p>Wi-Fi입니다.</p>\n\n<p>Ethernet입니다.</p>\n\n<p>USB Memory입니다.</p>\n\n<p>SD Card입니다.</p>\n\n<p>Ender-3 V3의 경우 사용할 수 있는 연결 방법 중 환경에 맞는 방식을 선택하면 됩니다.</p>\n\n<p>네트워크 전송을 사용하면 PC에서 바로 프린터로 출력 데이터를 전달할 수 있어 편리합니다.</p>","<h2>네트워크 연결</h2>\n<p class=\"screen\">[화면] 네트워크 연결</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 네트워크 연결에 대해 살펴보겠습니다.</p>\n\n<p>네트워크로 출력하려면 PC와 3D 프린터가 서로 통신할 수 있어야 합니다.</p>\n\n<p>일반적으로 같은 로컬 네트워크에 연결되어 있어야 합니다.</p>\n\n<p>프린터의 네트워크 설정은 프린터 화면에서 직접 설정합니다.</p>\n\n<p>그 후 Creality Print에서 장치를 검색하고 등록합니다.</p>\n\n<p>장치가 정상적으로 등록되면 출력 데이터를 네트워크를 통해 전달할 수 있습니다.</p>","<h2>출력 전 최종 확인</h2>\n<p class=\"screen\">[화면] 출력 전 최종 확인</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 전 최종 확인에 대해 살펴보겠습니다.</p>\n\n<p>실제 출력을 시작하기 전에 다음 내용을 확인하는 습관을 들이는 것이 좋습니다.</p>\n\n<p>올바른 프린터가 선택되어 있는가?입니다.</p>\n\n<p>올바른 필라멘트가 선택되어 있는가?입니다.</p>\n\n<p>모델이 베드 위에 정상적으로 놓여 있는가?입니다.</p>\n\n<p>Support가 필요한 부분에 생성되어 있는가?입니다.</p>\n\n<p>출력 시간이 적절한가?입니다.</p>\n\n<p>필라멘트가 충분한가?입니다.</p>\n\n<p>베드에 이물질이 없는가?입니다.</p>\n\n<p>필라멘트가 꼬여 있지 않은가?입니다.</p>\n\n<p>출력 시간이 긴 제품은 중간에 실패하면 처음부터 다시 출력해야 할 수 있기 때문에 출력 전 확인이 중요합니다.</p>","<h2>첫 번째 Layer</h2>\n<p class=\"screen\">[화면] 첫 번째 Layer</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 첫 번째 Layer에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅에서 가장 중요한 부분 중 하나가 첫 번째 Layer입니다.</p>\n\n<p>첫 번째 Layer가 베드에 제대로 붙지 않으면 이후의 모든 층이 정상적으로 출력되기 어렵습니다.</p>\n\n<p>따라서 출력이 시작되면 처음 몇 분 동안은 다음 내용을 확인하는 것이 좋습니다.</p>\n\n<p>필라멘트가 베드에 정상적으로 붙는가?입니다.</p>\n\n<p>노즐이 너무 높거나 낮지 않은가?입니다.</p>\n\n<p>출력물이 베드에서 밀리지 않는가?입니다.</p>\n\n<p>필라멘트가 정상적으로 공급되는가?입니다.</p>\n\n<p>첫 번째 Layer가 안정적으로 만들어지면 이후 출력도 정상적으로 진행될 가능성이 높아집니다.</p>","<h2>출력 실패</h2>\n<p class=\"screen\">[화면] 출력 실패</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 실패에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅에서는 출력 실패가 드문 일이 아닙니다.</p>\n\n<p>대표적인 원인은 다음과 같습니다.</p>\n\n<p>필라멘트 엉킴입니다.</p>\n\n<p>첫 번째 Layer 접착 불량입니다.</p>\n\n<p>Support 부족입니다.</p>\n\n<p>잘못된 출력 방향입니다.</p>\n\n<p>필라멘트 부족입니다.</p>\n\n<p>노즐 막힘입니다.</p>\n\n<p>잘못된 Slicer 설정입니다.</p>\n\n<p>처음에는 실패가 발생할 수 있지만 원인을 하나씩 확인하면서 설정을 조정하면 점차 안정적인 출력이 가능합니다.</p>\n\n<p>이 과정 역시 실제 3D 프린팅을 배우는 중요한 부분입니다.</p>","<h2>3D 프린팅에서 기억해야 할 핵심</h2>\n<p class=\"screen\">[화면] 3D 프린팅에서 기억해야 할 핵심</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린팅에서 기억해야 할 핵심에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅은 단순히 STL 파일을 프린터에 넣고 출력하는 과정이 아닙니다.</p>\n\n<p>전체 흐름을 이해하는 것이 중요합니다.</p>\n\n<p>3D 모델링</p>\n\n<p>↓</p>\n\n<p>출력 방향 결정</p>\n\n<p>↓</p>\n\n<p>STL 또는 3MF 생성</p>\n\n<p>↓</p>\n\n<p>Slicer에서 프린터와 재료 설정</p>\n\n<p>↓</p>\n\n<p>Support 설정</p>\n\n<p>↓</p>\n\n<p>Slice</p>\n\n<p>↓</p>\n\n<p>G-Code 생성</p>\n\n<p>↓</p>\n\n<p>프린터로 전송</p>\n\n<p>↓</p>\n\n<p>출력</p>\n\n<p>특히 다음 세 가지는 반드시 확인하는 습관을 들이는 것이 좋습니다.</p>\n\n<p>필라멘트가 꼬이지 않았는가?</p>\n\n<p>제품이 출력하기 좋은 방향으로 놓여 있는가?</p>\n\n<p>필요한 부분에 Support가 적용되어 있는가?</p>","<h2>설계와 3D 프린팅</h2>\n<p class=\"screen\">[화면] 설계와 3D 프린팅</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 설계와 3D 프린팅에 대해 살펴보겠습니다.</p>\n\n<p>이번 과정에서 가장 중요한 것은 단순히 3D 프린터를 사용하는 방법이 아닙니다.</p>\n\n<p>앞에서 배운 설계와 제작 방식이 다시 연결됩니다.</p>\n\n<p>3D 프린팅으로 제품을 제작한다면 처음부터 다음 내용을 고려하여 설계해야 합니다.</p>\n\n<p>출력 방향입니다.</p>\n\n<p>Support입니다.</p>\n\n<p>적층 방향입니다.</p>\n\n<p>공차입니다.</p>\n\n<p>조립 간극입니다.</p>\n\n<p>필라멘트 특성입니다.</p>\n\n<p>출력 시간입니다.</p>\n\n<p>따라서 다음과 같은 흐름이 완성됩니다.</p>\n\n<p>재료 선택</p>\n\n<p>↓</p>\n\n<p>3D 프린팅 선택</p>\n\n<p>↓</p>\n\n<p>3D 프린팅에 적합한 구조 설계</p>\n\n<p>↓</p>\n\n<p>3D 모델링</p>\n\n<p>↓</p>\n\n<p>Slicing</p>\n\n<p>↓</p>\n\n<p>G-Code</p>\n\n<p>↓</p>\n\n<p>실제 출력</p>\n\n<p>↓</p>\n\n<p>조립</p>\n\n<p>앞서 컨베이어를 설계할 때 3D 프린팅을 먼저 제작 방식으로 선택했던 이유도 바로 여기에 있습니다.</p>","<h2>이번 챕터의 목표</h2>\n<p class=\"screen\">[화면] 이번 챕터의 목표</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 이번 챕터의 목표에 대해 살펴보겠습니다.</p>\n\n<p>이번 챕터에서는 전문적인 3D 프린팅 기술 전체를 학습하지 않습니다.</p>\n\n<p>제조사와 모델마다 세부 기능과 설정이 다르기 때문에 모든 내용을 하나의 과정에서 다루기는 어렵습니다.</p>\n\n<p>이번 단계의 목표는 다음과 같습니다.</p>\n\n<p>FDM 방식의 기본 원리 이해입니다.</p>\n\n<p>필라멘트 장착과 관리입니다.</p>\n\n<p>STL의 역할 이해입니다.</p>\n\n<p>Slicer의 역할 이해입니다.</p>\n\n<p>G-Code의 역할 이해입니다.</p>\n\n<p>출력 방향 설정입니다.</p>\n\n<p>Support 사용입니다.</p>\n\n<p>Slice 수행입니다.</p>\n\n<p>프린터로 전송입니다.</p>\n\n<p>실제 부품 출력입니다.</p>\n\n<p>이 정도를 익히면 앞에서 Fusion으로 설계한 부품을 직접 제작할 수 있는 기본적인 능력을 갖추게 됩니다.</p>","<h2>다음 단계</h2>\n<p class=\"screen\">[화면] 다음 단계</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 다음 단계에 대해 살펴보겠습니다.</p>\n\n<p>이제 실제로 앞에서 모델링한 컨베이어 부품을 하나씩 출력해 봅니다.</p>\n\n<p>출력하면서 다음 내용을 직접 확인합니다.</p>\n\n<p>CAD 치수와 실제 출력 치수의 차이입니다.</p>\n\n<p>공차에 따른 조립성입니다.</p>\n\n<p>Support가 표면에 미치는 영향입니다.</p>\n\n<p>출력 방향에 따른 품질 차이입니다.</p>\n\n<p>PLA와 TPU의 차이입니다.</p>\n\n<p>실제 조립 과정에서 발생하는 문제입니다.</p>\n\n<p>3D 모델링 화면에서 완성된 제품과 실제 손으로 만질 수 있는 제품은 분명히 다릅니다.</p>\n\n<p>이제부터는 설계한 부품을 실제로 출력하고 조립하면서, 지금까지 배운 설계가 현실에서 어떻게 동작하는지를 확인해 보겠습니다.</p>\n<h2>마무리</h2>\n<p>이번 영상에서는 전체 학습 주제 개요 및 학습 목표 이해의 핵심 내용을 살펴봤습니다.</p>\n\n<p>다음 내용에서는 오늘 확인한 개념을 실제 설계와 제작 과정에 연결해 보겠습니다. 시청해 주셔서 감사합니다.</p>"]};</script><script src="viewer.js"></script>
