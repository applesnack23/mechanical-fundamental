# 출력 방식 및 실무 기법

앞에서는 3D 프린터의 기본적인 원리와 실제 출력 방법, 그리고 메이커 스페이스나 제작 대행 업체를 활용하는 방법까지 살펴보았습니다.

이번에는 조금 다른 이야기를 해보겠습니다.

필자는 3D 프린팅을 전문적으로 연구하는 사람은 아닙니다.

3D 프린팅 기술은 프린터의 성능, 재료, Slicer, 출력 방식 등이 빠르게 발전하고 있기 때문에 지금도 계속 새로운 기술과 방법들이 등장하고 있습니다.

하지만 자동화 장비와 교육용 키트를 직접 설계하고 제작하면서 상당히 많은 3D 프린팅 부품을 출력했고, 그 과정에서 여러 시행착오를 경험했습니다.

이번 챕터에서는 이러한 경험을 바탕으로 실제 기계 부품을 3D 프린팅할 때 알아두면 유용한 내용을 정리해 보겠습니다.

모든 값이 절대적인 기준은 아닙니다.

프린터, 노즐, 필라멘트, 출력 속도, 온도 등에 따라 결과가 달라질 수 있으므로 하나의 경험적인 기준으로 이해하면 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린팅과 공차

![image.png](../assets/04-03-printing-methods-and-practices/asset-001.png)

3D 모델에서 서로 정확하게 맞닿도록 설계했다고 해서 실제 출력된 부품도 정확하게 맞는 것은 아닙니다.

3D 프린팅에는 다양한 원인으로 치수 오차가 발생합니다.

예를 들어 다음과 같습니다.

- 프린터의 기계적 오차
- 노즐 크기
- Layer Height
- 필라멘트 수축
- 출력 온도
- 출력 속도
- 출력 방향
- Slicer 설정

따라서 서로 조립되는 부품에는 반드시 적절한 간극을 고려해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 노즐과 Layer Height

FDM 3D 프린터에서 많이 사용하는 기본적인 조건 중 하나는 다음과 같습니다.

- 노즐 : 0.4 mm
- Layer Height : 0.2 mm

노즐 0.4 mm는 필라멘트가 나오는 노즐의 직경을 의미합니다.

Layer Height 0.2 mm는 한 층을 약 0.2 mm 높이로 쌓는다는 의미입니다.

다만 이것이 곧바로 모든 치수에 ±0.1 mm 오차가 발생한다는 의미는 아닙니다.

실제 치수 오차는 프린터의 상태와 Slicer의 보정, 재료의 특성 등에 따라 달라집니다.

따라서 설계 단계에서는 이론적인 값만 사용하는 것보다 실제 사용하는 프린터로 시험 출력하여 필요한 간극을 확인하는 것이 가장 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 조립용 간극

![image.png](../assets/04-03-printing-methods-and-practices/asset-002.png)

예를 들어 두 개의 3D 프린팅 부품을 서로 끼워 조립한다고 생각해 보겠습니다.

CAD에서는 두 부품의 크기를 정확히 동일하게 만들어도 실제 출력에서는 서로 끼워지지 않을 수 있습니다.

따라서 필자는 일반적인 PLA 출력에서 서로 조립되는 부품에 약간의 여유를 두어 설계합니다.

예를 들어 다음과 같이 적용해 볼 수 있습니다.

베어링 외경이 Φ8.0 mm이고 이를 구멍에 삽입해야 한다면,

`Φ8.0 → Hole Φ8.2`

와 같이 구멍을 조금 크게 만들 수 있습니다.

반대로 베어링 내경이 Φ5.0 mm이고 샤프트를 삽입해야 한다면,

`Φ5.0 → Shaft Φ4.8`

처럼 샤프트를 조금 작게 설계할 수 있습니다.

즉, 양쪽 기준으로 약 0.1 mm씩 여유를 주어 전체적으로 약 0.2 mm 정도의 간극을 만드는 방법입니다.

하지만 이 값은 절대적인 기준이 아닙니다.

&amp;gt; 3D 프린팅 공차는 사용하는 프린터와 필라멘트의 특성을 직접 출력해 보고 결정하는 것이 가장 정확합니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 같은 공차를 모든 곳에 적용하면 안 된다

조립 목적에 따라 필요한 간극은 달라집니다.

예를 들어 다음과 같습니다.

**쉽게 끼웠다 뺄 수 있어야 하는 부품**

비교적 큰 간극이 필요합니다.

**정확하게 위치를 잡아야 하는 부품**

간극을 작게 해야 합니다.

**압입해서 고정해야 하는 부품**

오히려 약간의 간섭을 줄 수도 있습니다.

따라서 단순히 모든 치수에 0.2 mm를 더하거나 빼는 것이 아니라 조립 목적을 먼저 생각해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 공차 테스트 부품 만들기

3D 프린터를 새롭게 사용한다면 작은 공차 테스트 부품을 하나 만들어 보는 것도 좋은 방법입니다.

예를 들어 Φ10 mm 축을 기준으로 다음과 같은 구멍을 여러 개 만들어 출력할 수 있습니다.

- Φ10.0
- Φ10.1
- Φ10.2
- Φ10.3
- Φ10.4
- Φ10.5

실제 축을 하나씩 삽입해 보면 사용하는 프린터에서 어느 정도의 간극이 적절한지 쉽게 확인할 수 있습니다.

이러한 테스트 결과를 자신의 설계 기준으로 사용하면 이후 부품 설계가 훨씬 편리해집니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린팅 부품의 체결

![image.png](../assets/04-03-printing-methods-and-practices/asset-003.png)

처음에는 산업용 기계에서 사용하는 방식과 동일하게 3D 프린팅 부품도 볼트와 너트로 체결하려고 했습니다.

물론 가장 정석적인 방법 중 하나입니다.

하지만 교육용 키트를 반복해서 제작하고 조립하다 보면 몇 가지 불편한 점이 생깁니다.

예를 들어 다음과 같습니다.

- 볼트
- 너트
- 와셔

를 모두 사용하면 작은 부품 하나를 조립하는 데도 여러 개의 부품이 필요합니다.

기계 한 대에서는 크게 문제가 되지 않을 수 있지만 교육용 키트를 여러 대 제작하면 체결 부품의 수량과 조립 시간이 빠르게 증가합니다.

따라서 3D 프린팅 부품에서는 사용 목적에 따라 조금 더 간단한 체결 방법도 고려할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 볼트와 너트

가장 일반적인 체결 방법은 볼트와 너트를 사용하는 것입니다.

장점은 다음과 같습니다.

- 반복적인 분해와 조립이 가능
- 강한 체결력 확보 가능
- 표준 부품 사용
- 부품 교체가 쉬움

하지만 3D 프린팅 부품에서는 너트가 직접 플라스틱 표면에 닿으면 조이는 과정에서 표면을 손상시키거나 미끄러질 수 있습니다.

필요에 따라 와셔를 함께 사용하면 하중을 넓은 면적으로 분산시킬 수 있습니다.

하지만 체결 부품 수가 많아지고 조립 과정이 복잡해지는 단점이 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 셀프 태핑 스크류

![image.png](../assets/04-03-printing-methods-and-practices/asset-004.png)

교육용 키트를 제작하면서 가장 간단하게 사용할 수 있었던 방법 중 하나가 셀프 태핑 스크류입니다.

일반적으로 다음과 같은 이름으로 부르는 제품들이 있습니다.

- Self-Tapping Screw
- Tapping Screw
- 태핑 볼트
- 피스

PLA나 ABS와 같은 플라스틱 부품에 별도의 너트 없이 직접 체결할 수 있습니다.

장점은 매우 명확합니다.

- 너트가 필요 없음
- 와셔가 필요 없는 경우가 많음
- 별도의 Tap 가공이 필요 없음
- 조립 속도가 빠름
- 가격이 저렴함

따라서 교육용 키트처럼 한 번 조립한 뒤 자주 분해하지 않는 제품에서는 매우 편리합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 셀프 태핑 스크류의 단점

셀프 태핑 스크류는 플라스틱 내부를 직접 파고들면서 나사산을 만듭니다.

따라서 반복적으로 조였다 풀었다 하면 내부의 플라스틱 나사산이 점점 손상될 수 있습니다.

결국 어느 순간 볼트를 조여도 헛도는 현상이 발생할 수 있습니다.

따라서 다음과 같이 생각하면 좋습니다.

**한 번 조립하고 거의 분해하지 않는 부품**

→ 셀프 태핑 스크류

**반복적으로 분해하고 조립해야 하는 부품**

→ 인서트 너트 + 머신 스크류

사용 목적에 따라 체결 방식을 구분하는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 셀프 태핑 스크류용 홀

셀프 태핑 스크류를 사용할 때는 볼트 외경과 동일한 크기의 홀을 만드는 것이 항상 정답은 아닙니다.

피스가 플라스틱 내부에 나사산을 만들 수 있도록 적절한 크기의 Pilot Hole이 필요합니다.

필자의 경우 출력 조건에 따라 M2 계열에서는 약 Φ2 mm 전후, M3 계열에서는 약 Φ3 mm 전후부터 시험해 보고 조정하는 방식을 사용합니다.

하지만 실제로 필요한 Hole 크기는 다음 조건에 따라 달라집니다.

- 사용하는 스크류 종류
- 나사산 형상
- PLA / PETG / ABS 등 재료
- Wall 개수
- Infill
- 출력 방향

따라서 중요한 체결부라면 작은 테스트 부품을 출력해 직접 체결해 보고 적절한 Hole 크기를 결정하는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;12&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트

![image.png](../assets/04-03-printing-methods-and-practices/asset-005.png)

3D 프린팅 부품에서 매우 유용한 체결 방법 중 하나가 인서트 너트입니다.

특히 반복적으로 분해하고 조립하는 부품에서 효과적입니다.

3D 프린팅에서 많이 사용하는 것은 열압입 인서트(Heat-Set Insert)입니다.

금속으로 만들어진 작은 나사 부품을 PLA나 PETG 등의 출력물 안에 삽입하여 금속 나사산을 만드는 방식입니다.

구조는 다음과 같이 생각할 수 있습니다.

PLA 부품

↓

인서트 너트 삽입

↓

금속 나사산 형성

↓

일반 머신 스크류 사용&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;13&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트의 장점

인서트 너트를 사용하면 3D 프린팅 부품에서도 일반 기계 부품과 비슷한 방식으로 볼트를 체결할 수 있습니다.

주요 장점은 다음과 같습니다.

- 반복적인 분해와 조립 가능
- 플라스틱 나사산 손상 방지
- 높은 체결 신뢰성
- 머신 스크류 사용 가능
- 유지보수성이 좋음

특히 다음과 같은 부품에 적합합니다.

- 자주 분리하는 커버
- 모터 브라켓
- 센서 브라켓
- 전자 장치 하우징
- 유지보수가 필요한 조립부&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;14&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트의 단점

장점이 많은 대신 추가 작업이 필요합니다.

- 인서트 너트 구매
- 전용 Hole 설계
- 삽입 작업
- 인두기 또는 전용 공구 필요
- 조립 시간 증가

따라서 모든 볼트에 인서트 너트를 사용하는 것도 효율적이지 않을 수 있습니다.

교육용 키트처럼 수십 개의 볼트를 체결해야 한다면 조립 시간이 크게 증가합니다.

이 때문에 필자는 필요한 곳에만 인서트 너트를 사용하는 방법을 추천합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;15&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트 삽입 방법

가장 간단한 방법은 인두기를 이용하는 것입니다.

기본적인 과정은 다음과 같습니다.

1. 인서트가 들어갈 Hole을 모델링한다.
2. 부품을 3D 프린팅한다.
3. Hole 위에 인서트 너트를 올린다.
4. 가열된 인두기로 인서트를 천천히 누른다.
5. 주변 플라스틱이 녹으면서 인서트가 들어간다.
6. 원하는 깊이에서 인두기를 제거한다.
7. 플라스틱이 식을 때까지 기다린다.

플라스틱이 다시 굳으면 인서트 주변을 잡아 주면서 고정됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;16&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트 삽입 시 주의

인서트 너트를 지나치게 빠르게 밀어 넣으면 주변 플라스틱이 손상되거나 인서트가 기울어질 수 있습니다.

특히 가장 중요한 것은 수직입니다.

인서트가 비스듬하게 들어가면 이후 볼트도 비스듬하게 체결됩니다.

따라서 다음 사항을 확인하는 것이 좋습니다.

- 충분한 벽 두께 확보
- 인서트가 수직으로 들어가도록 작업
- 지나치게 높은 온도로 오래 가열하지 않음
- 삽입 후 완전히 식은 다음 볼트 체결
- 인서트 주변에 충분한 플라스틱 확보

많은 인서트를 반복적으로 설치한다면 인두기 전용 Heat-Set Insert Tip이나 수직 삽입 지그를 사용하는 것도 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;17&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트용 Hole

인서트 너트용 Hole 크기는 M2, M3 같은 나사 규격만 보고 결정해서는 안 됩니다.

예를 들어 M3 인서트 너트라고 해도 제조사마다 외경과 길이가 다를 수 있습니다.

따라서 먼저 실제 사용할 인서트의 외형 치수를 확인해야 합니다.

설계 과정은 다음과 같습니다.

사용할 인서트 선정

↓

인서트 외경 및 길이 확인

↓

제조사 권장 Hole 확인

↓

테스트 출력

↓

실제 삽입 확인

↓

최종 치수 결정

&amp;gt; 인서트 너트는 나사 크기가 아니라 실제 인서트의 외경을 기준으로 Hole을 설계해야 합니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;18&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 인서트 너트 주변의 Wall

인서트 너트 주변에 플라스틱이 너무 적으면 체결할 때 인서트 전체가 빠져나오거나 주변이 깨질 수 있습니다.

따라서 인서트 주변에는 충분한 벽 두께를 확보해야 합니다.

특히 인서트를 외곽에 너무 가깝게 배치하면 열을 가해 삽입하는 과정에서 외벽이 변형될 수도 있습니다.

따라서 인서트가 들어갈 위치는 단순히 볼트 중심만 생각하지 말고 주변의 플라스틱 두께까지 함께 고려합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;19&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 체결 방법 선택

3D 프린팅 부품에서는 다양한 체결 방법을 사용할 수 있습니다.

기초적으로 다음과 같이 구분할 수 있습니다.

| 체결 방법 | 장점 | 단점 | 추천 용도 |
| —- | —- | —- | —- |
| 본드 | 가장 간단함 | 분해 어려움 | 영구 조립 |
| 셀프 태핑 스크류 | 저렴하고 빠름 | 반복 체결에 약함 | 교육용, 간단한 조립 |
| 볼트 + 너트 | 신뢰성 높음 | 부품과 조립 과정 증가 | 일반 구조물 |
| 인서트 너트 | 반복 조립에 우수 | 추가 작업 필요 | 유지보수 부품 |

어떤 방식이 가장 좋은 것은 아닙니다.

제품의 목적과 생산 수량, 유지보수 방법에 따라 선택해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;20&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 접착제를 사용하는 방법

분해할 필요가 전혀 없는 부품은 접착제를 사용하는 것도 매우 간단한 방법입니다.

볼트와 너트를 전혀 사용할 필요가 없기 때문에 부품 수와 조립 시간이 줄어듭니다.

하지만 이후 분해와 수정이 어렵기 때문에 다음과 같은 부품에만 제한적으로 사용하는 것이 좋습니다.

- 영구 고정 부품
- 장식 부품
- 하중이 크지 않은 구조
- 교체할 필요가 없는 부품

교육용 키트처럼 반복적으로 분해하고 수정해야 한다면 볼트 체결이 더 적합할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;21&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기성품을 3D 프린팅으로 대체할 수 있을까

3D 프린터를 사용하다 보면 이런 생각을 하게 됩니다.

&amp;gt; 베어링이나 LM 가이드도 직접 출력할 수 있지 않을까?
&amp;gt; 

실제로 다양한 기계 요소를 3D 프린팅으로 만들어 볼 수 있습니다.

예를 들면 다음과 같습니다.

- 베어링
- 부싱
- 기어
- 풀리
- LM 가이드와 유사한 구조
- 리드스크류
- 볼스크류와 유사한 구조
- 커플링

하지만 출력이 가능하다고 해서 실제 기성품을 완전히 대체할 수 있다는 의미는 아닙니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;22&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 베어링

베어링의 중요한 역할은 단순히 회전하는 것이 아닙니다.

샤프트의 위치를 정확하게 유지하면서 매우 작은 마찰로 회전할 수 있도록 해야 합니다.

일반적인 금속 베어링은 매우 높은 정밀도로 만들어집니다.

반면 FDM 3D 프린팅은 출력 편차와 표면 거칠기가 비교적 큽니다.

따라서 일반적인 3D 프린터로 베어링 전체를 출력하여 금속 베어링과 동일한 성능을 얻기는 쉽지 않습니다.

교육용이나 저속 실험용으로는 사용할 수 있지만 정확한 축 위치와 부드러운 회전이 필요하다면 저렴한 기성 베어링을 사용하는 것이 훨씬 효과적입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;23&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### LM 가이드

LM 가이드와 LM 블록 역시 위치를 정확하게 잡아주는 것이 핵심입니다.

LM 블록 내부에는 볼이 순환하면서 낮은 마찰로 직선 운동을 가능하게 합니다.

3D 프린팅으로 비슷한 구조를 만들거나 작은 플라스틱 볼 등을 넣어 구현할 수도 있습니다.

하지만 실제 기성 LM 가이드에 비해 다음과 같은 문제가 발생하기 쉽습니다.

- 직진도 부족
- 유격
- 표면 거칠기
- 마찰
- 반복 정밀도 부족

따라서 정밀한 위치 제어가 필요하다면 기성품을 사용하는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;24&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 정밀 부품은 기성품을 활용한다

특히 다음과 같이 정밀도를 결정하는 부품은 가능하면 기성품을 사용하는 것을 추천합니다.

- 베어링
- LM 가이드
- LM 블록
- 정밀 샤프트
- 정밀 볼스크류

이러한 부품은 대량 생산을 통해 높은 정밀도로 만들어지기 때문에 직접 출력하는 것보다 가격과 성능 면에서 훨씬 유리한 경우가 많습니다.

3D 프린터는 이러한 기성품을 대체하기보다 기성품을 장착하고 연결하는 구조를 만드는 데 사용하는 것이 효율적입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;25&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 출력해서 사용하기 좋은 부품

반대로 높은 정밀도가 필요하지 않거나 형상이 중요한 부품은 3D 프린팅의 장점을 적극 활용할 수 있습니다.

예를 들면 다음과 같습니다.

- 모터 브라켓
- 센서 브라켓
- 케이블 가이드
- 커버
- 하우징
- 스페이서
- 풀리
- 기어
- 손잡이
- 간단한 지그
- 교육용 링크
- 로봇 구조물

이러한 부품은 3D 프린팅으로 빠르게 설계하고 수정할 수 있다는 장점이 매우 큽니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;26&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리드스크류와 이동 구조

회전 운동을 직선 운동으로 바꾸는 간단한 Screw 구조는 3D 프린팅으로도 실험해 볼 수 있습니다.

필자의 경험에서는 베어링이나 LM 가이드보다 출력 부품을 활용하기 쉬운 편이었습니다.

약간의 치수 편차가 있어도 별도의 가이드가 이동 방향을 잡아준다면 Screw는 이동력을 전달하는 역할에 집중할 수 있기 때문입니다.

다만 Pitch를 너무 작게 만들면 다음과 같은 문제가 발생하기 쉽습니다.

- 출력된 나사산의 형상 불량
- 마찰 증가
- 이동 불량
- 나사산 간섭

필자의 출력 환경에서는 약 5 mm 이상의 비교적 큰 Pitch를 사용했을 때 안정적으로 움직이는 편이었습니다.

하지만 이 역시 사용한 프린터와 출력 조건에서 얻은 경험적인 값입니다.

고해상도 프린터나 다른 출력 방식을 사용한다면 더 작은 Pitch도 가능할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;27&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기성품과 3D 프린팅의 역할 구분

자동화 장비를 만들 때 모든 것을 3D 프린팅으로 만들려고 할 필요는 없습니다.

오히려 다음과 같이 역할을 나누는 것이 좋습니다.

**기성품**

- 모터
- 베어링
- LM 가이드
- 센서
- 볼트
- 너트
- 정밀 샤프트

**3D 프린팅**

- 기성품을 고정하는 브라켓
- 기성품을 연결하는 구조
- 커버
- 하우징
- 지그
- 가이드
- 시제품

결국 앞에서 기계 설계를 배우면서 이야기했던 원칙과 동일합니다.

&amp;gt; 이미 저렴하고 품질 좋은 기성품이 있다면 굳이 직접 만들 필요가 없습니다.
&amp;gt;&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;28&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 3D 프린팅을 위한 설계 사고

3D 프린팅은 어떤 형상이든 만들 수 있다는 장점이 있지만, 그렇다고 아무렇게나 설계해도 된다는 의미는 아닙니다.

오히려 다음 요소를 미리 고려하면 훨씬 좋은 결과를 얻을 수 있습니다.

- 출력 방향
- Support
- 조립 간극
- 인서트 너트 공간
- 볼트 Hole
- Wall 두께
- 적층 방향
- 반복 분해 여부
- 기성품 활용 여부

이러한 부분을 모델링이 끝난 뒤 생각하는 것이 아니라 처음부터 설계에 반영하는 것이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;29&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 직접 출력해서 확인하는 것이 가장 빠르다

3D 프린팅은 이론만으로 모든 것을 결정하기 어려운 분야입니다.

예를 들어 Hole 하나를 설계하더라도 다음과 같은 요소가 영향을 줍니다.

- 프린터
- 노즐
- 필라멘트
- 온도
- 속도
- Layer Height
- 출력 방향
- Slicer

따라서 정확한 결과가 필요한 부분은 작은 테스트 부품을 먼저 출력해 보는 것이 좋습니다.

본 제품을 10시간 출력한 뒤 치수가 맞지 않는 것을 확인하는 것보다 10분짜리 테스트 부품을 먼저 출력하는 것이 훨씬 효율적입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;30&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 실패도 설계 과정이다

3D 프린팅을 처음 사용하면 다음과 같은 문제가 자주 발생합니다.

- 부품이 들어가지 않음
- 너무 헐거움
- 볼트가 헛돎
- 인서트 너트가 빠짐
- 베어링이 들어가지 않음
- Support가 떨어지지 않음
- 출력 중 부품이 넘어짐

이러한 문제를 단순한 출력 실패로 생각하기보다 설계 데이터를 보정하기 위한 정보로 생각하는 것이 좋습니다.

예를 들어 베어링이 들어가지 않았다면 다음 출력에서 Hole을 0.1 mm 키울 수 있습니다.

볼트가 헐겁다면 Pilot Hole을 조금 줄일 수 있습니다.

이러한 과정을 반복하면 자신이 사용하는 프린터에 적합한 설계 기준을 만들 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;31&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 나만의 설계 기준 만들기

3D 프린터를 계속 사용한다면 자신만의 간단한 기준표를 만들어 두는 것도 좋습니다.

예를 들어 다음과 같습니다.

| 항목 | 실제 치수 | 모델링 기준 |
| —- | —- | —- |
| 베어링 외경 | Φ8.0 | Hole Φ8.2 |
| 베어링 내경 | Φ5.0 | Shaft Φ4.8 |
| M3 통과 홀 | Φ3.0 | Hole Φ3.2~3.4 |
| 조립 플레이트 | 50.0 | 약간의 간극 적용 |
| M2 셀프 태핑 | 사용하는 피스 기준 | 시험 출력 후 결정 |
| M3 인서트 | 사용하는 인서트 기준 | 제조사 권장 Hole |

이 표의 숫자를 그대로 사용하는 것이 목적은 아닙니다.

자신이 실제로 사용하는 프린터와 재료를 기준으로 값을 하나씩 정리해 나가는 것이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;32&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 이번 챕터의 핵심

3D 프린팅을 기계 설계와 연결할 때 가장 중요한 것은 프린터의 사용법만 아는 것이 아닙니다.

실제 출력 결과를 예상하면서 설계할 수 있어야 합니다.

특히 다음 내용을 기억해 두면 좋습니다.

- CAD 치수와 실제 출력 치수는 완전히 같지 않다.
- 조립 부품에는 적절한 간극이 필요하다.
- 프린터마다 공차 특성이 다르므로 테스트 출력이 중요하다.
- 한 번 조립하는 부품에는 셀프 태핑 스크류가 편리하다.
- 반복적으로 분해하는 부품에는 인서트 너트가 유리하다.
- 영구 고정이라면 접착제를 사용할 수도 있다.
- 정밀도를 결정하는 베어링과 LM 가이드 등은 기성품을 사용하는 것이 유리하다.
- 3D 프린팅은 기성품을 대체하기보다 기성품을 연결하는 구조를 만드는 데 매우 유용하다.
- 중요한 부품을 긴 시간 출력하기 전에 작은 시험 부품을 먼저 출력하는 것이 좋다.

결국 3D 프린팅에서도 앞서 배웠던 기계 설계의 원칙은 그대로 적용됩니다.

재료 선택

↓

제작 방식 결정

↓

기성품 선정

↓

공차 결정

↓

체결 방식 결정

↓

3D 모델링

↓

시험 출력

↓

치수 보정

↓

최종 출력

↓

조립

3D 프린터의 가장 큰 장점은 설계한 아이디어를 빠르게 실제 부품으로 만들어 확인할 수 있다는 것입니다.

완벽한 설계를 한 번에 만드는 것보다 직접 출력하고 조립해 본 뒤 문제를 확인하고 다시 수정하는 과정을 반복하는 것이 훨씬 효과적입니다.

  <script>window.VIEWER_CONFIG={"title":"04-03. 출력 방식 및 실무 기법","deck":"../marp/04-03-printing-methods-and-practices.html","scripts":["<h2>오프닝</h2>\n<p>안녕하세요. 이번 영상에서는 출력 방식 및 실무 기법에 대해 알아보겠습니다.</p>\n\n<p>핵심 개념을 실제 기계 설계와 제작 과정에 어떻게 적용하는지 순서대로 살펴보겠습니다.</p>","<h2>04-03. 출력 방식 및 실무 기법</h2>\n<p class=\"screen\">[화면] 04-03. 출력 방식 및 실무 기법</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력 방식 및 실무 기법에 대해 살펴보겠습니다.</p>\n\n<p>앞에서는 3D 프린터의 기본적인 원리와 실제 출력 방법, 그리고 메이커 스페이스나 제작 대행 업체를 활용하는 방법까지 살펴보았습니다.</p>\n\n<p>이번에는 조금 다른 이야기를 해보겠습니다.</p>\n\n<p>필자는 3D 프린팅을 전문적으로 연구하는 사람은 아닙니다.</p>\n\n<p>3D 프린팅 기술은 프린터의 성능, 재료, Slicer, 출력 방식 등이 빠르게 발전하고 있기 때문에 지금도 계속 새로운 기술과 방법들이 등장하고 있습니다.</p>\n\n<p>하지만 자동화 장비와 교육용 키트를 직접 설계하고 제작하면서 상당히 많은 3D 프린팅 부품을 출력했고, 그 과정에서 여러 시행착오를 경험했습니다.</p>\n\n<p>이번 챕터에서는 이러한 경험을 바탕으로 실제 기계 부품을 3D 프린팅할 때 알아두면 유용한 내용을 정리해 보겠습니다.</p>\n\n<p>모든 값이 절대적인 기준은 아닙니다.</p>\n\n<p>프린터, 노즐, 필라멘트, 출력 속도, 온도 등에 따라 결과가 달라질 수 있으므로 하나의 경험적인 기준으로 이해하면 좋습니다.</p>","<h2>3D 프린팅과 공차</h2>\n<p class=\"screen\">[화면] 3D 프린팅과 공차</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린팅과 공차에 대해 살펴보겠습니다.</p>\n\n<p>3D 모델에서 서로 정확하게 맞닿도록 설계했다고 해서 실제 출력된 부품도 정확하게 맞는 것은 아닙니다.</p>\n\n<p>3D 프린팅에는 다양한 원인으로 치수 오차가 발생합니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>프린터의 기계적 오차입니다.</p>\n\n<p>노즐 크기입니다.</p>\n\n<p>Layer Height입니다.</p>\n\n<p>필라멘트 수축입니다.</p>\n\n<p>출력 온도입니다.</p>\n\n<p>출력 속도입니다.</p>\n\n<p>출력 방향입니다.</p>\n\n<p>Slicer 설정입니다.</p>\n\n<p>따라서 서로 조립되는 부품에는 반드시 적절한 간극을 고려해야 합니다.</p>","<h2>노즐과 Layer Height</h2>\n<p class=\"screen\">[화면] 노즐과 Layer Height</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 노즐과 Layer Height에 대해 살펴보겠습니다.</p>\n\n<p>FDM 3D 프린터에서 많이 사용하는 기본적인 조건 중 하나는 다음과 같습니다.</p>\n\n<p>노즐 : 0.4 mm입니다.</p>\n\n<p>Layer Height : 0.2 mm입니다.</p>\n\n<p>노즐 0.4 mm는 필라멘트가 나오는 노즐의 직경을 의미합니다.</p>\n\n<p>Layer Height 0.2 mm는 한 층을 약 0.2 mm 높이로 쌓는다는 의미입니다.</p>\n\n<p>다만 이것이 곧바로 모든 치수에 ±0.1 mm 오차가 발생한다는 의미는 아닙니다.</p>\n\n<p>실제 치수 오차는 프린터의 상태와 Slicer의 보정, 재료의 특성 등에 따라 달라집니다.</p>\n\n<p>따라서 설계 단계에서는 이론적인 값만 사용하는 것보다 실제 사용하는 프린터로 시험 출력하여 필요한 간극을 확인하는 것이 가장 좋습니다.</p>","<h2>조립용 간극</h2>\n<p class=\"screen\">[화면] 조립용 간극</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 조립용 간극에 대해 살펴보겠습니다.</p>\n\n<p>예를 들어 두 개의 3D 프린팅 부품을 서로 끼워 조립한다고 생각해 보겠습니다.</p>\n\n<p>CAD에서는 두 부품의 크기를 정확히 동일하게 만들어도 실제 출력에서는 서로 끼워지지 않을 수 있습니다.</p>\n\n<p>따라서 필자는 일반적인 PLA 출력에서 서로 조립되는 부품에 약간의 여유를 두어 설계합니다.</p>\n\n<p>예를 들어 다음과 같이 적용해 볼 수 있습니다.</p>\n\n<p>베어링 외경이 Φ8.0 mm이고 이를 구멍에 삽입해야 한다면,</p>\n\n<p>Φ8.0 → Hole Φ8.2</p>\n\n<p>와 같이 구멍을 조금 크게 만들 수 있습니다.</p>\n\n<p>반대로 베어링 내경이 Φ5.0 mm이고 샤프트를 삽입해야 한다면,</p>\n\n<p>Φ5.0 → Shaft Φ4.8</p>\n\n<p>처럼 샤프트를 조금 작게 설계할 수 있습니다.</p>\n\n<p>즉, 양쪽 기준으로 약 0.1 mm씩 여유를 주어 전체적으로 약 0.2 mm 정도의 간극을 만드는 방법입니다.</p>\n\n<p>하지만 이 값은 절대적인 기준이 아닙니다.</p>\n\n<p>&gt; 3D 프린팅 공차는 사용하는 프린터와 필라멘트의 특성을 직접 출력해 보고 결정하는 것이 가장 정확합니다.</p>\n\n<p>&gt;</p>","<h2>같은 공차를 모든 곳에 적용하면 안 된다</h2>\n<p class=\"screen\">[화면] 같은 공차를 모든 곳에 적용하면 안 된다</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 같은 공차를 모든 곳에 적용하면 안 된다에 대해 살펴보겠습니다.</p>\n\n<p>조립 목적에 따라 필요한 간극은 달라집니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>쉽게 끼웠다 뺄 수 있어야 하는 부품</p>\n\n<p>비교적 큰 간극이 필요합니다.</p>\n\n<p>정확하게 위치를 잡아야 하는 부품</p>\n\n<p>간극을 작게 해야 합니다.</p>\n\n<p>압입해서 고정해야 하는 부품</p>\n\n<p>오히려 약간의 간섭을 줄 수도 있습니다.</p>\n\n<p>따라서 단순히 모든 치수에 0.2 mm를 더하거나 빼는 것이 아니라 조립 목적을 먼저 생각해야 합니다.</p>","<h2>공차 테스트 부품 만들기</h2>\n<p class=\"screen\">[화면] 공차 테스트 부품 만들기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 공차 테스트 부품 만들기에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터를 새롭게 사용한다면 작은 공차 테스트 부품을 하나 만들어 보는 것도 좋은 방법입니다.</p>\n\n<p>예를 들어 Φ10 mm 축을 기준으로 다음과 같은 구멍을 여러 개 만들어 출력할 수 있습니다.</p>\n\n<p>Φ10.0입니다.</p>\n\n<p>Φ10.1입니다.</p>\n\n<p>Φ10.2입니다.</p>\n\n<p>Φ10.3입니다.</p>\n\n<p>Φ10.4입니다.</p>\n\n<p>Φ10.5입니다.</p>\n\n<p>실제 축을 하나씩 삽입해 보면 사용하는 프린터에서 어느 정도의 간극이 적절한지 쉽게 확인할 수 있습니다.</p>\n\n<p>이러한 테스트 결과를 자신의 설계 기준으로 사용하면 이후 부품 설계가 훨씬 편리해집니다.</p>","<h2>3D 프린팅 부품의 체결</h2>\n<p class=\"screen\">[화면] 3D 프린팅 부품의 체결</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린팅 부품의 체결에 대해 살펴보겠습니다.</p>\n\n<p>처음에는 산업용 기계에서 사용하는 방식과 동일하게 3D 프린팅 부품도 볼트와 너트로 체결하려고 했습니다.</p>\n\n<p>물론 가장 정석적인 방법 중 하나입니다.</p>\n\n<p>하지만 교육용 키트를 반복해서 제작하고 조립하다 보면 몇 가지 불편한 점이 생깁니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>볼트입니다.</p>\n\n<p>너트입니다.</p>\n\n<p>와셔입니다.</p>\n\n<p>를 모두 사용하면 작은 부품 하나를 조립하는 데도 여러 개의 부품이 필요합니다.</p>\n\n<p>기계 한 대에서는 크게 문제가 되지 않을 수 있지만 교육용 키트를 여러 대 제작하면 체결 부품의 수량과 조립 시간이 빠르게 증가합니다.</p>\n\n<p>따라서 3D 프린팅 부품에서는 사용 목적에 따라 조금 더 간단한 체결 방법도 고려할 수 있습니다.</p>","<h2>볼트와 너트</h2>\n<p class=\"screen\">[화면] 볼트와 너트</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 볼트와 너트에 대해 살펴보겠습니다.</p>\n\n<p>가장 일반적인 체결 방법은 볼트와 너트를 사용하는 것입니다.</p>\n\n<p>장점은 다음과 같습니다.</p>\n\n<p>반복적인 분해와 조립이 가능입니다.</p>\n\n<p>강한 체결력 확보 가능입니다.</p>\n\n<p>표준 부품 사용입니다.</p>\n\n<p>부품 교체가 쉬움입니다.</p>\n\n<p>하지만 3D 프린팅 부품에서는 너트가 직접 플라스틱 표면에 닿으면 조이는 과정에서 표면을 손상시키거나 미끄러질 수 있습니다.</p>\n\n<p>필요에 따라 와셔를 함께 사용하면 하중을 넓은 면적으로 분산시킬 수 있습니다.</p>\n\n<p>하지만 체결 부품 수가 많아지고 조립 과정이 복잡해지는 단점이 있습니다.</p>","<h2>셀프 태핑 스크류</h2>\n<p class=\"screen\">[화면] 셀프 태핑 스크류</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 셀프 태핑 스크류에 대해 살펴보겠습니다.</p>\n\n<p>교육용 키트를 제작하면서 가장 간단하게 사용할 수 있었던 방법 중 하나가 셀프 태핑 스크류입니다.</p>\n\n<p>일반적으로 다음과 같은 이름으로 부르는 제품들이 있습니다.</p>\n\n<p>Self-Tapping Screw입니다.</p>\n\n<p>Tapping Screw입니다.</p>\n\n<p>태핑 볼트입니다.</p>\n\n<p>피스입니다.</p>\n\n<p>PLA나 ABS와 같은 플라스틱 부품에 별도의 너트 없이 직접 체결할 수 있습니다.</p>\n\n<p>장점은 매우 명확합니다.</p>\n\n<p>너트가 필요 없음입니다.</p>\n\n<p>와셔가 필요 없는 경우가 많음입니다.</p>\n\n<p>별도의 Tap 가공이 필요 없음입니다.</p>\n\n<p>조립 속도가 빠름입니다.</p>\n\n<p>가격이 저렴함입니다.</p>\n\n<p>따라서 교육용 키트처럼 한 번 조립한 뒤 자주 분해하지 않는 제품에서는 매우 편리합니다.</p>","<h2>셀프 태핑 스크류의 단점</h2>\n<p class=\"screen\">[화면] 셀프 태핑 스크류의 단점</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 셀프 태핑 스크류의 단점에 대해 살펴보겠습니다.</p>\n\n<p>셀프 태핑 스크류는 플라스틱 내부를 직접 파고들면서 나사산을 만듭니다.</p>\n\n<p>따라서 반복적으로 조였다 풀었다 하면 내부의 플라스틱 나사산이 점점 손상될 수 있습니다.</p>\n\n<p>결국 어느 순간 볼트를 조여도 헛도는 현상이 발생할 수 있습니다.</p>\n\n<p>따라서 다음과 같이 생각하면 좋습니다.</p>\n\n<p>한 번 조립하고 거의 분해하지 않는 부품</p>\n\n<p>→ 셀프 태핑 스크류</p>\n\n<p>반복적으로 분해하고 조립해야 하는 부품</p>\n\n<p>→ 인서트 너트 + 머신 스크류</p>\n\n<p>사용 목적에 따라 체결 방식을 구분하는 것이 좋습니다.</p>","<h2>셀프 태핑 스크류용 홀</h2>\n<p class=\"screen\">[화면] 셀프 태핑 스크류용 홀</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 셀프 태핑 스크류용 홀에 대해 살펴보겠습니다.</p>\n\n<p>셀프 태핑 스크류를 사용할 때는 볼트 외경과 동일한 크기의 홀을 만드는 것이 항상 정답은 아닙니다.</p>\n\n<p>피스가 플라스틱 내부에 나사산을 만들 수 있도록 적절한 크기의 Pilot Hole이 필요합니다.</p>\n\n<p>필자의 경우 출력 조건에 따라 M2 계열에서는 약 Φ2 mm 전후, M3 계열에서는 약 Φ3 mm 전후부터 시험해 보고 조정하는 방식을 사용합니다.</p>\n\n<p>하지만 실제로 필요한 Hole 크기는 다음 조건에 따라 달라집니다.</p>\n\n<p>사용하는 스크류 종류입니다.</p>\n\n<p>나사산 형상입니다.</p>\n\n<p>PLA / PETG / ABS 등 재료입니다.</p>\n\n<p>Wall 개수입니다.</p>\n\n<p>Infill입니다.</p>\n\n<p>출력 방향입니다.</p>\n\n<p>따라서 중요한 체결부라면 작은 테스트 부품을 출력해 직접 체결해 보고 적절한 Hole 크기를 결정하는 것이 좋습니다.</p>","<h2>인서트 너트</h2>\n<p class=\"screen\">[화면] 인서트 너트</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅 부품에서 매우 유용한 체결 방법 중 하나가 인서트 너트입니다.</p>\n\n<p>특히 반복적으로 분해하고 조립하는 부품에서 효과적입니다.</p>\n\n<p>3D 프린팅에서 많이 사용하는 것은 열압입 인서트(Heat-Set Insert)입니다.</p>\n\n<p>금속으로 만들어진 작은 나사 부품을 PLA나 PETG 등의 출력물 안에 삽입하여 금속 나사산을 만드는 방식입니다.</p>\n\n<p>구조는 다음과 같이 생각할 수 있습니다.</p>\n\n<p>PLA 부품</p>\n\n<p>↓</p>\n\n<p>인서트 너트 삽입</p>\n\n<p>↓</p>\n\n<p>금속 나사산 형성</p>\n\n<p>↓</p>\n\n<p>일반 머신 스크류 사용</p>","<h2>인서트 너트의 장점</h2>\n<p class=\"screen\">[화면] 인서트 너트의 장점</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트의 장점에 대해 살펴보겠습니다.</p>\n\n<p>인서트 너트를 사용하면 3D 프린팅 부품에서도 일반 기계 부품과 비슷한 방식으로 볼트를 체결할 수 있습니다.</p>\n\n<p>주요 장점은 다음과 같습니다.</p>\n\n<p>반복적인 분해와 조립 가능입니다.</p>\n\n<p>플라스틱 나사산 손상 방지입니다.</p>\n\n<p>높은 체결 신뢰성입니다.</p>\n\n<p>머신 스크류 사용 가능입니다.</p>\n\n<p>유지보수성이 좋음입니다.</p>\n\n<p>특히 다음과 같은 부품에 적합합니다.</p>\n\n<p>자주 분리하는 커버입니다.</p>\n\n<p>모터 브라켓입니다.</p>\n\n<p>센서 브라켓입니다.</p>\n\n<p>전자 장치 하우징입니다.</p>\n\n<p>유지보수가 필요한 조립부입니다.</p>","<h2>인서트 너트의 단점</h2>\n<p class=\"screen\">[화면] 인서트 너트의 단점</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트의 단점에 대해 살펴보겠습니다.</p>\n\n<p>장점이 많은 대신 추가 작업이 필요합니다.</p>\n\n<p>인서트 너트 구매입니다.</p>\n\n<p>전용 Hole 설계입니다.</p>\n\n<p>삽입 작업입니다.</p>\n\n<p>인두기 또는 전용 공구 필요</p>\n\n<p>조립 시간 증가입니다.</p>\n\n<p>따라서 모든 볼트에 인서트 너트를 사용하는 것도 효율적이지 않을 수 있습니다.</p>\n\n<p>교육용 키트처럼 수십 개의 볼트를 체결해야 한다면 조립 시간이 크게 증가합니다.</p>\n\n<p>이 때문에 필자는 필요한 곳에만 인서트 너트를 사용하는 방법을 추천합니다.</p>","<h2>인서트 너트 삽입 방법</h2>\n<p class=\"screen\">[화면] 인서트 너트 삽입 방법</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트 삽입 방법에 대해 살펴보겠습니다.</p>\n\n<p>가장 간단한 방법은 인두기를 이용하는 것입니다.</p>\n\n<p>기본적인 과정은 다음과 같습니다.</p>\n\n<p>인서트가 들어갈 Hole을 모델링한다.</p>\n\n<p>부품을 3D 프린팅한다.</p>\n\n<p>Hole 위에 인서트 너트를 올린다.</p>\n\n<p>가열된 인두기로 인서트를 천천히 누른다.</p>\n\n<p>주변 플라스틱이 녹으면서 인서트가 들어간다.</p>\n\n<p>원하는 깊이에서 인두기를 제거한다.</p>\n\n<p>플라스틱이 식을 때까지 기다린다.</p>\n\n<p>플라스틱이 다시 굳으면 인서트 주변을 잡아 주면서 고정됩니다.</p>","<h2>인서트 너트 삽입 시 주의</h2>\n<p class=\"screen\">[화면] 인서트 너트 삽입 시 주의</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트 삽입 시 주의에 대해 살펴보겠습니다.</p>\n\n<p>인서트 너트를 지나치게 빠르게 밀어 넣으면 주변 플라스틱이 손상되거나 인서트가 기울어질 수 있습니다.</p>\n\n<p>특히 가장 중요한 것은 수직입니다.</p>\n\n<p>인서트가 비스듬하게 들어가면 이후 볼트도 비스듬하게 체결됩니다.</p>\n\n<p>따라서 다음 사항을 확인하는 것이 좋습니다.</p>\n\n<p>충분한 벽 두께 확보입니다.</p>\n\n<p>인서트가 수직으로 들어가도록 작업입니다.</p>\n\n<p>지나치게 높은 온도로 오래 가열하지 않음입니다.</p>\n\n<p>삽입 후 완전히 식은 다음 볼트 체결입니다.</p>\n\n<p>인서트 주변에 충분한 플라스틱 확보입니다.</p>\n\n<p>많은 인서트를 반복적으로 설치한다면 인두기 전용 Heat-Set Insert Tip이나 수직 삽입 지그를 사용하는 것도 좋습니다.</p>","<h2>인서트 너트용 Hole</h2>\n<p class=\"screen\">[화면] 인서트 너트용 Hole</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트용 Hole에 대해 살펴보겠습니다.</p>\n\n<p>인서트 너트용 Hole 크기는 M2, M3 같은 나사 규격만 보고 결정해서는 안 됩니다.</p>\n\n<p>예를 들어 M3 인서트 너트라고 해도 제조사마다 외경과 길이가 다를 수 있습니다.</p>\n\n<p>따라서 먼저 실제 사용할 인서트의 외형 치수를 확인해야 합니다.</p>\n\n<p>설계 과정은 다음과 같습니다.</p>\n\n<p>사용할 인서트 선정</p>\n\n<p>↓</p>\n\n<p>인서트 외경 및 길이 확인</p>\n\n<p>↓</p>\n\n<p>제조사 권장 Hole 확인</p>\n\n<p>↓</p>\n\n<p>테스트 출력</p>\n\n<p>↓</p>\n\n<p>실제 삽입 확인</p>\n\n<p>↓</p>\n\n<p>최종 치수 결정</p>\n\n<p>&gt; 인서트 너트는 나사 크기가 아니라 실제 인서트의 외경을 기준으로 Hole을 설계해야 합니다.</p>\n\n<p>&gt;</p>","<h2>인서트 너트 주변의 Wall</h2>\n<p class=\"screen\">[화면] 인서트 너트 주변의 Wall</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 인서트 너트 주변의 Wall에 대해 살펴보겠습니다.</p>\n\n<p>인서트 너트 주변에 플라스틱이 너무 적으면 체결할 때 인서트 전체가 빠져나오거나 주변이 깨질 수 있습니다.</p>\n\n<p>따라서 인서트 주변에는 충분한 벽 두께를 확보해야 합니다.</p>\n\n<p>특히 인서트를 외곽에 너무 가깝게 배치하면 열을 가해 삽입하는 과정에서 외벽이 변형될 수도 있습니다.</p>\n\n<p>따라서 인서트가 들어갈 위치는 단순히 볼트 중심만 생각하지 말고 주변의 플라스틱 두께까지 함께 고려합니다.</p>","<h2>체결 방법 선택</h2>\n<p class=\"screen\">[화면] 체결 방법 선택</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 체결 방법 선택에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅 부품에서는 다양한 체결 방법을 사용할 수 있습니다.</p>\n\n<p>기초적으로 다음과 같이 구분할 수 있습니다.</p>\n\n<p>체결 방법: 장점: 단점: 추천 용도.</p>\n\n<p>—-: —-: —-: —-.</p>\n\n<p>본드: 가장 간단함: 분해 어려움: 영구 조립.</p>\n\n<p>셀프 태핑 스크류: 저렴하고 빠름: 반복 체결에 약함: 교육용, 간단한 조립.</p>\n\n<p>볼트 + 너트: 신뢰성 높음: 부품과 조립 과정 증가: 일반 구조물.</p>\n\n<p>인서트 너트: 반복 조립에 우수: 추가 작업 필요: 유지보수 부품.</p>\n\n<p>어떤 방식이 가장 좋은 것은 아닙니다.</p>\n\n<p>제품의 목적과 생산 수량, 유지보수 방법에 따라 선택해야 합니다.</p>","<h2>접착제를 사용하는 방법</h2>\n<p class=\"screen\">[화면] 접착제를 사용하는 방법</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 접착제를 사용하는 방법에 대해 살펴보겠습니다.</p>\n\n<p>분해할 필요가 전혀 없는 부품은 접착제를 사용하는 것도 매우 간단한 방법입니다.</p>\n\n<p>볼트와 너트를 전혀 사용할 필요가 없기 때문에 부품 수와 조립 시간이 줄어듭니다.</p>\n\n<p>하지만 이후 분해와 수정이 어렵기 때문에 다음과 같은 부품에만 제한적으로 사용하는 것이 좋습니다.</p>\n\n<p>영구 고정 부품입니다.</p>\n\n<p>장식 부품입니다.</p>\n\n<p>하중이 크지 않은 구조입니다.</p>\n\n<p>교체할 필요가 없는 부품입니다.</p>\n\n<p>교육용 키트처럼 반복적으로 분해하고 수정해야 한다면 볼트 체결이 더 적합할 수 있습니다.</p>","<h2>기성품을 3D 프린팅으로 대체할 수 있을까</h2>\n<p class=\"screen\">[화면] 기성품을 3D 프린팅으로 대체할 수 있을까</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기성품을 3D 프린팅으로 대체할 수 있을까에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터를 사용하다 보면 이런 생각을 하게 됩니다.</p>\n\n<p>&gt; 베어링이나 LM 가이드도 직접 출력할 수 있지 않을까?</p>\n\n<p>&gt;</p>\n\n<p>실제로 다양한 기계 요소를 3D 프린팅으로 만들어 볼 수 있습니다.</p>\n\n<p>예를 들면 다음과 같습니다.</p>\n\n<p>베어링입니다.</p>\n\n<p>부싱입니다.</p>\n\n<p>기어입니다.</p>\n\n<p>풀리입니다.</p>\n\n<p>LM 가이드와 유사한 구조입니다.</p>\n\n<p>리드스크류입니다.</p>\n\n<p>볼스크류와 유사한 구조입니다.</p>\n\n<p>커플링입니다.</p>\n\n<p>하지만 출력이 가능하다고 해서 실제 기성품을 완전히 대체할 수 있다는 의미는 아닙니다.</p>","<h2>베어링</h2>\n<p class=\"screen\">[화면] 베어링</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 베어링에 대해 살펴보겠습니다.</p>\n\n<p>베어링의 중요한 역할은 단순히 회전하는 것이 아닙니다.</p>\n\n<p>샤프트의 위치를 정확하게 유지하면서 매우 작은 마찰로 회전할 수 있도록 해야 합니다.</p>\n\n<p>일반적인 금속 베어링은 매우 높은 정밀도로 만들어집니다.</p>\n\n<p>반면 FDM 3D 프린팅은 출력 편차와 표면 거칠기가 비교적 큽니다.</p>\n\n<p>따라서 일반적인 3D 프린터로 베어링 전체를 출력하여 금속 베어링과 동일한 성능을 얻기는 쉽지 않습니다.</p>\n\n<p>교육용이나 저속 실험용으로는 사용할 수 있지만 정확한 축 위치와 부드러운 회전이 필요하다면 저렴한 기성 베어링을 사용하는 것이 훨씬 효과적입니다.</p>","<h2>LM 가이드</h2>\n<p class=\"screen\">[화면] LM 가이드</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 LM 가이드에 대해 살펴보겠습니다.</p>\n\n<p>LM 가이드와 LM 블록 역시 위치를 정확하게 잡아주는 것이 핵심입니다.</p>\n\n<p>LM 블록 내부에는 볼이 순환하면서 낮은 마찰로 직선 운동을 가능하게 합니다.</p>\n\n<p>3D 프린팅으로 비슷한 구조를 만들거나 작은 플라스틱 볼 등을 넣어 구현할 수도 있습니다.</p>\n\n<p>하지만 실제 기성 LM 가이드에 비해 다음과 같은 문제가 발생하기 쉽습니다.</p>\n\n<p>직진도 부족입니다.</p>\n\n<p>유격입니다.</p>\n\n<p>표면 거칠기입니다.</p>\n\n<p>마찰입니다.</p>\n\n<p>반복 정밀도 부족입니다.</p>\n\n<p>따라서 정밀한 위치 제어가 필요하다면 기성품을 사용하는 것이 좋습니다.</p>","<h2>정밀 부품은 기성품을 활용한다</h2>\n<p class=\"screen\">[화면] 정밀 부품은 기성품을 활용한다</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 정밀 부품은 기성품을 활용한다에 대해 살펴보겠습니다.</p>\n\n<p>특히 다음과 같이 정밀도를 결정하는 부품은 가능하면 기성품을 사용하는 것을 추천합니다.</p>\n\n<p>베어링입니다.</p>\n\n<p>LM 가이드입니다.</p>\n\n<p>LM 블록입니다.</p>\n\n<p>정밀 샤프트입니다.</p>\n\n<p>정밀 볼스크류입니다.</p>\n\n<p>이러한 부품은 대량 생산을 통해 높은 정밀도로 만들어지기 때문에 직접 출력하는 것보다 가격과 성능 면에서 훨씬 유리한 경우가 많습니다.</p>\n\n<p>3D 프린터는 이러한 기성품을 대체하기보다 기성품을 장착하고 연결하는 구조를 만드는 데 사용하는 것이 효율적입니다.</p>","<h2>출력해서 사용하기 좋은 부품</h2>\n<p class=\"screen\">[화면] 출력해서 사용하기 좋은 부품</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 출력해서 사용하기 좋은 부품에 대해 살펴보겠습니다.</p>\n\n<p>반대로 높은 정밀도가 필요하지 않거나 형상이 중요한 부품은 3D 프린팅의 장점을 적극 활용할 수 있습니다.</p>\n\n<p>예를 들면 다음과 같습니다.</p>\n\n<p>모터 브라켓입니다.</p>\n\n<p>센서 브라켓입니다.</p>\n\n<p>케이블 가이드입니다.</p>\n\n<p>커버입니다.</p>\n\n<p>하우징입니다.</p>\n\n<p>스페이서입니다.</p>\n\n<p>풀리입니다.</p>\n\n<p>기어입니다.</p>\n\n<p>손잡이입니다.</p>\n\n<p>간단한 지그입니다.</p>\n\n<p>교육용 링크입니다.</p>\n\n<p>로봇 구조물입니다.</p>\n\n<p>이러한 부품은 3D 프린팅으로 빠르게 설계하고 수정할 수 있다는 장점이 매우 큽니다.</p>","<h2>리드스크류와 이동 구조</h2>\n<p class=\"screen\">[화면] 리드스크류와 이동 구조</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리드스크류와 이동 구조에 대해 살펴보겠습니다.</p>\n\n<p>회전 운동을 직선 운동으로 바꾸는 간단한 Screw 구조는 3D 프린팅으로도 실험해 볼 수 있습니다.</p>\n\n<p>필자의 경험에서는 베어링이나 LM 가이드보다 출력 부품을 활용하기 쉬운 편이었습니다.</p>\n\n<p>약간의 치수 편차가 있어도 별도의 가이드가 이동 방향을 잡아준다면 Screw는 이동력을 전달하는 역할에 집중할 수 있기 때문입니다.</p>\n\n<p>다만 Pitch를 너무 작게 만들면 다음과 같은 문제가 발생하기 쉽습니다.</p>\n\n<p>출력된 나사산의 형상 불량입니다.</p>\n\n<p>마찰 증가입니다.</p>\n\n<p>이동 불량입니다.</p>\n\n<p>나사산 간섭입니다.</p>\n\n<p>필자의 출력 환경에서는 약 5 mm 이상의 비교적 큰 Pitch를 사용했을 때 안정적으로 움직이는 편이었습니다.</p>\n\n<p>하지만 이 역시 사용한 프린터와 출력 조건에서 얻은 경험적인 값입니다.</p>\n\n<p>고해상도 프린터나 다른 출력 방식을 사용한다면 더 작은 Pitch도 가능할 수 있습니다.</p>","<h2>기성품과 3D 프린팅의 역할 구분</h2>\n<p class=\"screen\">[화면] 기성품과 3D 프린팅의 역할 구분</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기성품과 3D 프린팅의 역할 구분에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비를 만들 때 모든 것을 3D 프린팅으로 만들려고 할 필요는 없습니다.</p>\n\n<p>오히려 다음과 같이 역할을 나누는 것이 좋습니다.</p>\n\n<p>기성품</p>\n\n<p>모터입니다.</p>\n\n<p>베어링입니다.</p>\n\n<p>LM 가이드입니다.</p>\n\n<p>센서입니다.</p>\n\n<p>볼트입니다.</p>\n\n<p>너트입니다.</p>\n\n<p>정밀 샤프트입니다.</p>\n\n<p>3D 프린팅</p>\n\n<p>기성품을 고정하는 브라켓입니다.</p>\n\n<p>기성품을 연결하는 구조입니다.</p>\n\n<p>커버입니다.</p>\n\n<p>하우징입니다.</p>\n\n<p>지그입니다.</p>\n\n<p>가이드입니다.</p>\n\n<p>시제품입니다.</p>\n\n<p>결국 앞에서 기계 설계를 배우면서 이야기했던 원칙과 동일합니다.</p>\n\n<p>&gt; 이미 저렴하고 품질 좋은 기성품이 있다면 굳이 직접 만들 필요가 없습니다.</p>\n\n<p>&gt;</p>","<h2>3D 프린팅을 위한 설계 사고</h2>\n<p class=\"screen\">[화면] 3D 프린팅을 위한 설계 사고</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 3D 프린팅을 위한 설계 사고에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅은 어떤 형상이든 만들 수 있다는 장점이 있지만, 그렇다고 아무렇게나 설계해도 된다는 의미는 아닙니다.</p>\n\n<p>오히려 다음 요소를 미리 고려하면 훨씬 좋은 결과를 얻을 수 있습니다.</p>\n\n<p>출력 방향입니다.</p>\n\n<p>Support입니다.</p>\n\n<p>조립 간극입니다.</p>\n\n<p>인서트 너트 공간입니다.</p>\n\n<p>볼트 Hole입니다.</p>\n\n<p>Wall 두께입니다.</p>\n\n<p>적층 방향입니다.</p>\n\n<p>반복 분해 여부입니다.</p>\n\n<p>기성품 활용 여부입니다.</p>\n\n<p>이러한 부분을 모델링이 끝난 뒤 생각하는 것이 아니라 처음부터 설계에 반영하는 것이 중요합니다.</p>","<h2>직접 출력해서 확인하는 것이 가장 빠르다</h2>\n<p class=\"screen\">[화면] 직접 출력해서 확인하는 것이 가장 빠르다</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 직접 출력해서 확인하는 것이 가장 빠르다에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅은 이론만으로 모든 것을 결정하기 어려운 분야입니다.</p>\n\n<p>예를 들어 Hole 하나를 설계하더라도 다음과 같은 요소가 영향을 줍니다.</p>\n\n<p>프린터입니다.</p>\n\n<p>노즐입니다.</p>\n\n<p>필라멘트입니다.</p>\n\n<p>온도입니다.</p>\n\n<p>속도입니다.</p>\n\n<p>Layer Height입니다.</p>\n\n<p>출력 방향입니다.</p>\n\n<p>Slicer입니다.</p>\n\n<p>따라서 정확한 결과가 필요한 부분은 작은 테스트 부품을 먼저 출력해 보는 것이 좋습니다.</p>\n\n<p>본 제품을 10시간 출력한 뒤 치수가 맞지 않는 것을 확인하는 것보다 10분짜리 테스트 부품을 먼저 출력하는 것이 훨씬 효율적입니다.</p>","<h2>실패도 설계 과정이다</h2>\n<p class=\"screen\">[화면] 실패도 설계 과정이다</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 실패도 설계 과정이다에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅을 처음 사용하면 다음과 같은 문제가 자주 발생합니다.</p>\n\n<p>부품이 들어가지 않음입니다.</p>\n\n<p>너무 헐거움입니다.</p>\n\n<p>볼트가 헛돎입니다.</p>\n\n<p>인서트 너트가 빠짐입니다.</p>\n\n<p>베어링이 들어가지 않음입니다.</p>\n\n<p>Support가 떨어지지 않음입니다.</p>\n\n<p>출력 중 부품이 넘어짐입니다.</p>\n\n<p>이러한 문제를 단순한 출력 실패로 생각하기보다 설계 데이터를 보정하기 위한 정보로 생각하는 것이 좋습니다.</p>\n\n<p>예를 들어 베어링이 들어가지 않았다면 다음 출력에서 Hole을 0.1 mm 키울 수 있습니다.</p>\n\n<p>볼트가 헐겁다면 Pilot Hole을 조금 줄일 수 있습니다.</p>\n\n<p>이러한 과정을 반복하면 자신이 사용하는 프린터에 적합한 설계 기준을 만들 수 있습니다.</p>","<h2>나만의 설계 기준 만들기</h2>\n<p class=\"screen\">[화면] 나만의 설계 기준 만들기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 나만의 설계 기준 만들기에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린터를 계속 사용한다면 자신만의 간단한 기준표를 만들어 두는 것도 좋습니다.</p>\n\n<p>예를 들어 다음과 같습니다.</p>\n\n<p>항목: 실제 치수: 모델링 기준.</p>\n\n<p>—-: —-: —-.</p>\n\n<p>베어링 외경: Φ8.0: Hole Φ8.2.</p>\n\n<p>베어링 내경: Φ5.0: Shaft Φ4.8.</p>\n\n<p>M3 통과 홀: Φ3.0: Hole Φ3.2~3.4.</p>\n\n<p>조립 플레이트: 50.0: 약간의 간극 적용.</p>\n\n<p>M2 셀프 태핑: 사용하는 피스 기준: 시험 출력 후 결정.</p>\n\n<p>M3 인서트: 사용하는 인서트 기준: 제조사 권장 Hole.</p>\n\n<p>이 표의 숫자를 그대로 사용하는 것이 목적은 아닙니다.</p>\n\n<p>자신이 실제로 사용하는 프린터와 재료를 기준으로 값을 하나씩 정리해 나가는 것이 중요합니다.</p>","<h2>이번 챕터의 핵심</h2>\n<p class=\"screen\">[화면] 이번 챕터의 핵심</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 이번 챕터의 핵심에 대해 살펴보겠습니다.</p>\n\n<p>3D 프린팅을 기계 설계와 연결할 때 가장 중요한 것은 프린터의 사용법만 아는 것이 아닙니다.</p>\n\n<p>실제 출력 결과를 예상하면서 설계할 수 있어야 합니다.</p>\n\n<p>특히 다음 내용을 기억해 두면 좋습니다.</p>\n\n<p>CAD 치수와 실제 출력 치수는 완전히 같지 않다.</p>\n\n<p>조립 부품에는 적절한 간극이 필요하다.</p>\n\n<p>프린터마다 공차 특성이 다르므로 테스트 출력이 중요하다.</p>\n\n<p>한 번 조립하는 부품에는 셀프 태핑 스크류가 편리하다.</p>\n\n<p>반복적으로 분해하는 부품에는 인서트 너트가 유리하다.</p>\n\n<p>영구 고정이라면 접착제를 사용할 수도 있다.</p>\n\n<p>정밀도를 결정하는 베어링과 LM 가이드 등은 기성품을 사용하는 것이 유리하다.</p>\n\n<p>3D 프린팅은 기성품을 대체하기보다 기성품을 연결하는 구조를 만드는 데 매우 유용하다.</p>\n\n<p>중요한 부품을 긴 시간 출력하기 전에 작은 시험 부품을 먼저 출력하는 것이 좋다.</p>\n\n<p>결국 3D 프린팅에서도 앞서 배웠던 기계 설계의 원칙은 그대로 적용됩니다.</p>\n\n<p>재료 선택</p>\n\n<p>↓</p>\n\n<p>제작 방식 결정</p>\n\n<p>↓</p>\n\n<p>기성품 선정</p>\n\n<p>↓</p>\n\n<p>공차 결정</p>\n\n<p>↓</p>\n\n<p>체결 방식 결정</p>\n\n<p>↓</p>\n\n<p>3D 모델링</p>\n\n<p>↓</p>\n\n<p>시험 출력</p>\n\n<p>↓</p>\n\n<p>치수 보정</p>\n\n<p>↓</p>\n\n<p>최종 출력</p>\n\n<p>↓</p>\n\n<p>조립</p>\n\n<p>3D 프린터의 가장 큰 장점은 설계한 아이디어를 빠르게 실제 부품으로 만들어 확인할 수 있다는 것입니다.</p>\n\n<p>완벽한 설계를 한 번에 만드는 것보다 직접 출력하고 조립해 본 뒤 문제를 확인하고 다시 수정하는 과정을 반복하는 것이 훨씬 효과적입니다.</p>\n\n<p>이 정도의 실무적인 Tip을 마지막으로 3D 프린팅에 대한 기초 내용은 마무리하겠습니다.</p>\n<h2>마무리</h2>\n<p>이번 영상에서는 출력 방식 및 실무 기법의 핵심 내용을 살펴봤습니다.</p>\n\n<p>다음 내용에서는 오늘 확인한 개념을 실제 설계와 제작 과정에 연결해 보겠습니다. 시청해 주셔서 감사합니다.</p>"]};</script><script src="viewer.js"></script>
