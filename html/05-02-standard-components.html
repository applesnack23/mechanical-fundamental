# 추가 기성품의 이해

지금까지 우리는 재료, 3D 모델링, 2D 도면, 3D 프린팅, 레이저 커팅, 절삭 가공, 공차와 조립 방법까지 기계 설계의 기본적인 흐름을 살펴보았습니다.

이제 마지막으로 실제 자동화 장비에서 자주 사용하는 다양한 기성품을 살펴보겠습니다.

기계 설계에서는 모든 부품을 직접 제작하지 않습니다.

이미 표준화되어 판매되는 기성품을 적절히 활용하면 설계 시간을 크게 줄이고, 신뢰성과 유지보수성을 높일 수 있습니다.

이번 파트의 목적은 모든 부품의 세부 규격을 암기하는 것이 아닙니다.

어떤 종류의 기성품이 존재하고, 각각 어떤 역할을 하는지 이해하는 것이 목적입니다.

실제 설계에서는 필요한 순간에 제조사 카탈로그를 확인하고 규격을 선정하면 됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;2&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 구동 계열

구동 계열은 실제 장비를 움직이는 힘을 만드는 부품입니다.

대표적으로 다음과 같은 장치가 있습니다.

- 서보모터
- 스테핑 모터
- BLDC 모터
- 리니어 모터
- 에어 실린더
- 유압 실린더

각 부품은 필요한 속도, 정밀도, 토크, 하중에 따라 선택합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;3&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 서보모터

![image.png](../assets/05-02-standard-components/asset-001.png)

서보모터는 엔코더를 이용하여 실제 위치와 속도를 확인하면서 제어하는 폐루프(Closed-loop) 방식의 모터입니다.

주요 특징은 다음과 같습니다.

- 위치 제어 가능
- 속도 제어 가능
- 토크 제어 가능
- 반복 정밀도가 높음
- 고속 응답 가능

대표적인 사용 분야는 다음과 같습니다.

- CNC
- 산업용 로봇
- 반도체 장비
- 정밀 위치 제어 장비

정밀도와 성능이 뛰어난 대신 가격이 높고 드라이브 설정과 튜닝이 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;4&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 스테핑 모터

![image.png](../assets/05-02-standard-components/asset-002.png)

스테핑 모터는 입력되는 펄스 수에 따라 일정한 각도씩 회전하는 모터입니다.

일반적인 구성에서는 별도의 엔코더 없이 Open-loop 방식으로 위치를 제어할 수 있습니다.

대표적인 사용 분야는 다음과 같습니다.

- 3D 프린터
- 소형 CNC
- 교육용 장비
- 저하중 위치 제어 장치

장점은 구조와 제어가 비교적 단순하고 가격이 저렴하다는 것입니다.

다만 부하가 너무 크거나 급가속하면 실제 모터 위치가 명령 위치를 따라가지 못하는 탈조가 발생할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;5&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### BLDC 모터

![image.png](../assets/05-02-standard-components/asset-003.png)

BLDC는 Brushless DC Motor의 약자로 브러시 없이 전자적으로 정류하는 모터입니다.

주요 특징은 다음과 같습니다.

- 높은 효율
- 긴 수명
- 고속 운전 가능
- 브러시 마모 없음

대표적으로 다음과 같은 곳에서 사용됩니다.

- 팬
- 펌프
- 드론
- 스핀들
- 전기 이동 장치

기본적으로 회전 구동에 매우 적합하지만 정밀 위치 제어가 필요하다면 엔코더와 적절한 제어기가 추가로 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;6&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리니어 모터

![image.png](../assets/05-02-standard-components/asset-004.png)

리니어 모터는 회전 운동을 별도의 기계 장치로 직선 운동으로 변환하지 않고 직접 직선 운동을 만들어 냅니다.

볼스크류나 벨트와 같은 전달 구조가 필요하지 않기 때문에 백래시를 줄이고 매우 빠른 이동을 구현할 수 있습니다.

대표적인 사용 분야는 다음과 같습니다.

- 반도체 장비
- 고속 Pick &amp;amp; Place
- 정밀 검사 장비
- 초정밀 위치 제어 시스템

고속·고정밀이라는 장점이 있지만 가격과 제어 난이도가 높습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;7&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 에어 실린더

![image.png](../assets/05-02-standard-components/asset-005.png)

에어 실린더는 압축 공기를 이용하여 직선 운동을 만드는 장치입니다.

자동화 설비에서 매우 많이 사용하는 구동 부품 중 하나입니다.

대표적인 용도는 다음과 같습니다.

- 밀기
- 당기기
- 클램핑
- 승강
- 단순 반복 동작

장점은 구조가 단순하고 동작 속도가 빠르며 가격이 비교적 저렴하다는 것입니다.

반면 일반적인 구성에서는 정밀한 위치 제어가 어렵고 공압 공급 장치가 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;8&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 유압 실린더

![image.png](../assets/05-02-standard-components/asset-006.png)

유압 실린더는 오일의 압력을 이용하여 큰 힘을 만드는 장치입니다.

대표적으로 다음과 같은 분야에서 사용합니다.

- 프레스
- 금형 장비
- 중장비
- 고하중 구동 장치

매우 큰 힘을 만들 수 있다는 것이 가장 큰 장점입니다.

반면 유압 펌프와 배관이 필요하고 누유와 유지보수 문제를 고려해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;9&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 동력 전달 계열

구동원이 힘을 만들었다면 그 힘을 실제 부품에 전달해야 합니다.

대표적인 전달 부품은 다음과 같습니다.

- 볼스크류
- 타이밍 벨트
- 체인과 스프로킷
- 기어
- 커플링
- 감속기&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;10&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 볼스크류

![image.png](../assets/05-02-standard-components/asset-007.png)

볼스크류는 모터의 회전 운동을 직선 운동으로 변환하는 장치입니다.

나사산 사이에 볼이 순환하면서 마찰을 줄이기 때문에 일반적인 나사 구조보다 높은 효율과 정밀도를 얻을 수 있습니다.

대표적인 사용 분야는 다음과 같습니다.

- CNC
- 반도체 장비
- 정밀 위치 제어
- 서보모터 기반 이송축

정밀도가 높고 백래시를 매우 작게 만들 수 있지만 가격이 높고 윤활 관리가 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;11&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 타이밍 벨트

![image.png](../assets/05-02-standard-components/asset-008.png)

타이밍 벨트는 벨트와 풀리의 톱니가 맞물리면서 동력을 전달하는 방식입니다.

일반 벨트와 달리 큰 미끄러짐 없이 회전을 전달할 수 있습니다.

대표적인 사용 분야는 다음과 같습니다.

- 컨베이어
- XY Stage
- 3D 프린터
- 장거리 이송 장치

장점은 가볍고 빠르며 가격이 비교적 저렴하다는 것입니다.

반면 장시간 사용하면 벨트가 늘어날 수 있으므로 장력 관리가 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;12&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 체인과 스프로킷

![image.png](../assets/05-02-standard-components/asset-009.png)

체인과 스프로킷은 체인의 링크와 스프로킷의 톱니를 이용하여 동력을 전달합니다.

타이밍 벨트보다 무겁고 소음이 크지만 높은 하중과 큰 토크를 전달하기에 유리합니다.

대표적으로 다음과 같은 곳에서 사용됩니다.

- 중하중 컨베이어
- 리프트
- 산업용 이송 장비
- 오염이나 충격이 많은 환경

주기적인 윤활과 장력 관리가 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;13&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기어

기어는 서로 맞물리는 톱니를 이용하여 회전력과 속도를 전달합니다.

기어의 종류에 따라 다양한 기능을 구현할 수 있습니다.

**스퍼기어**

![Animated_two_spur_gears_1_3.gif](../assets/05-02-standard-components/asset-010.gif)

직선 형태의 톱니를 가진 가장 기본적인 기어입니다.

- 구조 단순
- 효율 높음
- 제작 비교적 쉬움&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;14&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**헬리컬 기어**

![image.png](../assets/05-02-standard-components/asset-011.png)

톱니가 비스듬하게 형성되어 있습니다.

- 접촉이 부드러움
- 소음과 진동이 적음
- 산업용 감속기에 많이 사용&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;15&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**베벨 기어**

![image.png](../assets/05-02-standard-components/asset-012.png)

서로 다른 방향의 축 사이에서 회전을 전달합니다.

주로 축 방향을 변경할 때 사용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;16&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**웜 기어**

![Worm_Gear.gif](../assets/05-02-standard-components/asset-013.gif)

웜과 웜휠이 맞물리는 구조입니다.

- 큰 감속비 구현 가능
- 축 방향 변경 가능
- 구조에 따라 역구동이 어렵기도 함&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;17&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**랙 &amp;amp; 피니언**

![Animated_rack_and_pinion.gif](../assets/05-02-standard-components/asset-014.gif)

원형 기어인 피니언과 직선형 기어인 랙을 결합한 구조입니다.

회전 운동을 직선 운동으로 변환할 때 사용합니다.

기어는 정밀하게 맞물려야 하기 때문에 백래시, 윤활, 가공 정밀도를 함께 고려해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;18&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 커플링

커플링은 두 개의 회전축을 연결하여 회전력을 전달하는 부품입니다.

대표적으로 모터 축과 볼스크류, 펌프, 감속기 등의 축을 연결할 때 사용합니다.

주요 종류는 다음과 같습니다.

**리지드 커플링**

![image.png](../assets/05-02-standard-components/asset-015.png)

두 축을 강체로 연결합니다.

- 높은 강성
- 구조 단순
- 두 축의 정렬 정확도가 중요&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;19&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**플렉시블 커플링**

![image.png](../assets/05-02-standard-components/asset-016.png)

약간의 축 정렬 오차를 흡수할 수 있습니다.

- 조립 오차 허용
- 진동 흡수 가능
- 구조에 따라 비틀림 강성이 낮아질 수 있음

커플링을 선정할 때는 축 직경뿐만 아니라 허용 토크와 회전 속도도 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;20&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 감속기

감속기는 모터의 회전 속도를 낮추고 토크를 증가시키는 장치입니다.

기본적인 관계는 다음과 같습니다.

속도 감소

↓

토크 증가

자동화에서는 모터 단독으로 필요한 토크를 얻기 어렵거나 더 정밀한 움직임이 필요한 경우 감속기를 사용합니다.

대표적인 종류는 다음과 같습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;21&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**유성 감속기**

![Planetary_Gear_Animation.gif](../assets/05-02-standard-components/asset-017.gif)

- 높은 효율
- 비교적 작은 크기
- 서보모터와 많이 조합&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;22&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**하모닉 감속기**

![HarmonicDriveAni.gif](../assets/05-02-standard-components/asset-018.gif)

- 매우 작은 백래시
- 높은 감속비
- 로봇 관절 등에 많이 사용

감속기는 자동화 장비의 성능과 가격에 큰 영향을 주는 부품 중 하나입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;23&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

**싸이클로이드 감속기**

![Cycloidal_drive (1).gif](../assets/05-02-standard-components/asset-019.gif)

- 높은 감속비
- 높은 토크와 충격 하중에 강함
- 백래시가 작음
- 산업용 로봇 관절 등에 많이 사용&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;24&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 직선 운동 계열

직선으로 움직이는 장비에서는 구동장치와 함께 이동 방향을 정확하게 잡아주는 가이드가 필요합니다.

대표적인 부품은 다음과 같습니다.

- LM 가이드
- 리니어 베어링
- 크로스 롤러 가이드
- 리니어 액추에이터&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;25&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### LM 가이드

![image.png](../assets/05-02-standard-components/asset-020.png)

LM 가이드는 레일과 블록으로 구성된 대표적인 직선 운동 부품입니다.

LM 블록 내부의 볼이 순환하면서 레일 위를 움직이므로 낮은 마찰과 높은 정밀도를 얻을 수 있습니다.

대표적으로 다음과 같은 장비에서 사용됩니다.

- CNC
- 반도체 장비
- 자동화 장비
- 로봇 직선축

높은 정밀도와 강성을 가지고 있지만 설치면의 평탄도와 레일 정렬이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;26&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리니어 베어링

![image.png](../assets/05-02-standard-components/asset-021.png)

리니어 베어링은 원형 샤프트를 따라 직선으로 움직이는 구조입니다.

LM 가이드보다 단순하고 가격이 저렴합니다.

대표적으로 다음과 같은 곳에서 사용합니다.

- 교육용 키트
- DIY 장비
- 3D 프린터
- 저하중 직선 이동 구조

정밀도와 강성은 LM 가이드보다 낮지만 간단한 장비를 만들 때 매우 유용합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;27&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 크로스 롤러 가이드

![image.png](../assets/05-02-standard-components/asset-022.png)

크로스 롤러 가이드는 롤러를 교차 방향으로 배열하여 높은 강성과 정밀도를 얻는 직선 운동 장치입니다.

대표적인 사용 분야는 다음과 같습니다.

- 초정밀 검사 장비
- 광학 장비
- 반도체 장비
- 측정 시스템

정밀도는 매우 높지만 가격이 높고 오염 관리가 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;28&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리니어 액추에이터

![image.png](../assets/05-02-standard-components/asset-023.png)

리니어 액추에이터는 LM 가이드와 구동부, 모터 등을 하나의 모듈로 구성한 완성형 직선 운동 장치입니다.

구동 방식은 제품에 따라 다음과 같이 나뉩니다.

- 볼스크류
- 타이밍 벨트

장점은 설계와 조립 시간을 크게 줄일 수 있다는 것입니다.

직접 LM 가이드와 볼스크류를 정렬하지 않아도 제조사가 완성된 상태로 공급하기 때문에 빠르게 장비를 개발할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;29&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 구조 및 기구 요소

자동화 장비의 구조를 만들 때는 다음과 같은 기성품도 많이 사용합니다.

- 알루미늄 프로파일
- 힌지
- 샤프트
- 베어링
- 리니어 샤프트 서포트&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;30&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 알루미늄 프로파일

![image.png](../assets/05-02-standard-components/asset-024.png)

알루미늄 프로파일은 T-Slot 구조를 가진 조립형 프레임 소재입니다.

볼트와 브라켓을 이용하여 용접 없이 빠르게 구조물을 만들 수 있습니다.

대표적인 사용 분야는 다음과 같습니다.

- 자동화 장비 프레임
- 교육용 키트
- 안전 커버 프레임
- 시제품

구조 변경과 분해가 쉽다는 장점이 있습니다.

다만 같은 크기의 철 구조물에 비해 강성이 낮을 수 있으므로 큰 하중이나 진동이 발생하는 장비에서는 적절한 규격을 선정해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;31&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 힌지

![image.png](../assets/05-02-standard-components/asset-025.png)

힌지는 두 부품 사이에서 회전 운동을 허용하는 간단한 기계 요소입니다.

대표적으로 다음과 같은 곳에서 사용합니다.

- 안전 도어
- 커버
- 접이식 구조

설치는 간단하지만 힌지 축의 위치가 맞지 않으면 문이 원활하게 움직이지 않을 수 있으므로 정렬이 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;32&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 샤프트와 베어링

![image.png](../assets/05-02-standard-components/asset-026.png)

샤프트는 회전력을 전달하는 축이고 베어링은 샤프트를 지지하면서 원활하게 회전하도록 도와주는 부품입니다.

자동화에서는 다음과 같은 구조에서 매우 자주 사용합니다.

- 컨베이어 롤러
- 회전축
- 풀리
- 기어
- 모터 출력축

샤프트와 베어링을 설계할 때는 축 정렬과 끼워맞춤 공차가 중요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;33&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리니어 샤프트 서포트

![image.png](../assets/05-02-standard-components/asset-027.png)

리니어 샤프트 서포트는 원형 샤프트를 프레임이나 플레이트에 고정하는 부품입니다.

리니어 베어링과 함께 저렴한 직선 운동 구조를 만들 때 사용합니다.

장거리 샤프트는 가운데가 휘어질 수 있으므로 길이와 하중에 따라 적절한 지지 구조가 필요합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;34&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 케이블 및 보호 계열

자동화 장비에서는 기계가 움직이는 동안 케이블도 함께 움직이는 경우가 많습니다.

이때 케이블이 꼬이거나 반복적으로 꺾이지 않도록 보호하기 위한 기성품을 사용합니다.

대표적으로 다음과 같습니다.

- 케이블 베어
- 슬립링
- 케이블 글랜드&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;35&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 케이블 베어

![image.png](../assets/05-02-standard-components/asset-028.png)

케이블 베어 또는 Cable Carrier는 이동하는 축을 따라 케이블을 일정한 경로로 유도합니다.

주요 역할은 다음과 같습니다.

- 케이블 꺾임 방지
- 마모 방지
- 이동 경로 정리
- 케이블 수명 향상

CNC, 로봇, 갠트리 등의 이동 축에서 쉽게 볼 수 있습니다.

케이블을 선정할 때는 케이블 베어가 허용하는 최소 굴곡 반경을 확인해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;36&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 슬립링

![image.png](../assets/05-02-standard-components/asset-029.png)

슬립링은 회전하는 구조물에 전원이나 전기 신호를 전달하기 위한 장치입니다.

일반 케이블을 계속 회전시키면 케이블이 꼬이지만 슬립링을 사용하면 연속 회전이 가능합니다.

대표적으로 다음과 같은 곳에 사용됩니다.

- 회전 테이블
- 로봇 회전축
- 360° 이상 연속 회전 장치

전기적 특성이 중요한 부품이므로 자세한 내용은 이후 전기·전자 과정에서 다루는 것이 좋습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;37&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 케이블 글랜드

![image.png](../assets/05-02-standard-components/asset-030.png)

케이블 글랜드는 케이블이 판넬이나 박스를 통과하는 부분에서 케이블을 고정하고 외부 환경을 차단하는 부품입니다.

대표적으로 다음과 같은 곳에서 사용합니다.

- 전기 판넬
- 제어함
- 야외 장비

케이블 외경에 맞는 규격을 사용해야 하며 적절하게 체결해야 방수와 방진 성능을 유지할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;38&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 위치 및 속도 측정 부품

자동화 장비에서는 움직임을 만드는 것뿐만 아니라 현재 위치와 속도를 확인하는 것도 중요합니다.

대표적으로 다음과 같은 센서가 있습니다.

- 로터리 엔코더
- 리니어 엔코더
- 와이어 엔코더
- 홀 센서

이 부품들은 전기적 신호를 사용하기 때문에 자세한 원리는 이후 전기·전자 과정에서 다룹니다.

이번 과정에서는 기계적으로 어디에 설치되는지 정도만 이해하면 충분합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;39&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 로터리 엔코더

![image.png](../assets/05-02-standard-components/asset-031.png)

로터리 엔코더는 축의 회전 위치를 전기 신호로 변환하는 장치입니다.

주로 모터 축에 장착하여 다음 정보를 확인합니다.

- 회전 위치
- 회전 속도
- 회전 방향

대표적으로 인크리멘탈 방식과 앱솔루트 방식이 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;40&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 리니어 엔코더

![image.png](../assets/05-02-standard-components/asset-032.png)

리니어 엔코더는 회전축이 아니라 실제 직선 이동 위치를 직접 측정합니다.

따라서 볼스크류나 감속기에서 발생하는 기계적 오차까지 포함한 실제 위치를 확인할 수 있습니다.

고정밀 CNC와 반도체 장비 등에 사용됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;41&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 감지 센서

![image.png](../assets/05-02-standard-components/asset-033.png)

자동화 장비에서는 제품이나 기계 부품의 존재 여부와 위치를 확인하기 위해 다양한 센서를 사용합니다.

대표적으로 다음과 같습니다.

- 근접센서
- 포토센서
- 리미트 스위치
- 온도센서
- 비전 카메라

이 역시 자세한 전기적 동작은 이후 전기·전자 과정에서 다루고, 여기에서는 장착 구조와 사용 목적만 간단히 알아봅니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;42&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 모듈화된 기성품

최근 자동화 설계에서는 각각의 부품을 직접 조합하기보다 여러 기계 요소가 이미 조립된 완성형 모듈을 사용하는 경우도 많습니다.

대표적으로 다음과 같습니다.

- 리니어 액추에이터
- XYZ Stage
- Gantry System
- Robot Arm

이러한 모듈을 사용하면 초기 비용은 올라갈 수 있지만 설계와 조립 시간을 크게 줄일 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;43&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### XYZ 스테이지

![image.png](../assets/05-02-standard-components/asset-034.png)

XYZ 스테이지는 X, Y, Z 세 개의 직선축을 하나의 시스템으로 구성한 장치입니다.

대표적으로 다음과 같은 장비에 사용합니다.

- 검사 장비
- 디스펜싱
- 레이저 가공
- 반복 위치 이동 장치

이미 각 축의 정렬이 완료된 상태로 제공되기 때문에 사용자는 모터와 제어 시스템을 연결하는 데 집중할 수 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;44&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 갠트리 시스템

![image.png](../assets/05-02-standard-components/asset-035.png)

갠트리 시스템은 큰 프레임 위에서 X, Y 또는 XYZ 방향으로 움직이는 구조입니다.

대표적으로 다음과 같은 곳에서 사용합니다.

- 물류 이송
- 대형 패널 이송
- 창고 자동화
- 대형 Pick &amp;amp; Place

작업 범위를 크게 만들 수 있지만 구조물이 길어질수록 처짐과 진동을 고려해야 합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;45&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 로봇 암

![image.png](../assets/05-02-standard-components/asset-036.png)

로봇 암은 여러 개의 회전 관절을 이용하여 공간에서 다양한 위치와 자세를 만들 수 있는 장치입니다.

대표적으로 다음과 같은 작업에 사용합니다.

- 용접
- 조립
- Pick &amp;amp; Place
- 머신 텐딩
- 비전 기반 작업

일반적인 직교축보다 구조와 제어가 복잡하지만 매우 다양한 작업에 대응할 수 있다는 장점이 있습니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;46&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 안전 관련 부품

![image.png](../assets/05-02-standard-components/asset-037.png)

자동화 장비에는 작업자를 보호하기 위한 다양한 안전 장치가 사용됩니다.

대표적으로 다음과 같습니다.

- 비상 정지 스위치
- 라이트 커튼
- 안전 도어 스위치

이 부품들은 기계적인 장착 구조도 중요하지만 안전 회로와 전기 제어가 핵심이므로 자세한 내용은 이후 전기·제어 과정에서 다루는 것이 좋습니다.

이번 단계에서는 장비 설계 시 이러한 부품을 설치할 공간과 위치를 반드시 고려해야 한다는 점만 이해하면 충분합니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;47&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기성품을 선택할 때 생각해야 할 것

기성품을 선택할 때는 단순히 크기만 맞으면 되는 것이 아닙니다.

다음과 같은 사항을 함께 확인해야 합니다.

- 허용 하중
- 정격 토크
- 이동 속도
- Stroke
- 정밀도
- 반복 정밀도
- 설치 방법
- 유지보수 방법
- 가격
- 납기
- 제조사 CAD 데이터 제공 여부

예를 들어 LM 가이드는 길이만 맞추는 것이 아니라 블록의 허용 하중과 모멘트 하중을 확인해야 합니다.

모터 역시 크기만 보고 선정하는 것이 아니라 토크와 속도를 확인해야 합니다.

즉, 기성품 선정 역시 하나의 설계 작업입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;48&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 기성품을 직접 만들지 않는 이유

우리가 지금까지 3D 프린터와 CNC, 레이저 커팅을 배웠다고 해서 모든 부품을 직접 제작하는 것이 좋은 것은 아닙니다.

예를 들어 베어링을 3D 프린터로 직접 만들 수도 있습니다.

하지만 대량 생산되는 일반 베어링은 매우 저렴하면서 훨씬 높은 정밀도를 가지고 있습니다.

LM 가이드나 모터, 엔코더 역시 마찬가지입니다.

따라서 다음과 같은 판단이 필요합니다.

직접 설계해야 하는가?

↓

기성품이 존재하는가?

↓

가격과 성능은 적절한가?

↓

기성품을 사용할 수 있다면 선정

↓

기성품을 장착할 구조만 직접 설계

이러한 접근이 실제 설계에서 훨씬 효율적입니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;bespoke-marp-note&quot; data-index=&quot;49&quot; tabindex=&quot;0&quot;&gt;&lt;p&gt;발표자 노트 · 원문

#### 이번 챕터에서 기억해야 할 핵심

기계 설계 실력은 CAD 프로그램을 얼마나 잘 사용하는지만으로 결정되지 않습니다.

기계 설계자는 다음 내용을 함께 알고 있어야 합니다.

- 어떤 기성품이 존재하는가?
- 그 기성품은 어떤 역할을 하는가?
- 어떤 상황에서 사용하는가?
- 어떤 규격을 선택해야 하는가?
- 다른 부품과 어떻게 연결해야 하는가?
- 유지보수는 어떻게 하는가?

특히 자동화 장비에서는 모터, 센서, LM 가이드, 볼스크류, 베어링, 알루미늄 프로파일과 같은 기성품을 조합하여 장비를 만드는 경우가 매우 많습니다.

&amp;gt; 모든 것을 직접 만드는 것이 설계 능력은 아닙니다.
&amp;gt; 
&amp;gt; 
&amp;gt; 필요한 기성품을 빠르게 찾고 적절하게 조합하는 것도 매우 중요한 설계 능력입니다.
&amp;gt; 

기성품에 대한 지식이 많아질수록 설계 속도는 빨라지고, 실제로 제작 가능한 구조를 만들기도 쉬워집니다.

이제 남은 과정에서는 이러한 기성품을 실제로 조립하고 확인하기 위해 필요한 측정 도구와 수공구, 전동공구에 대해 살펴보겠습니다.&lt;/p&gt;&lt;/div&gt;&lt;script&gt;/*!! License: https://unpkg.com/@marp-team/marp-cli@4.5.0/lib/bespoke.js.LICENSE.txt */

  <script>window.VIEWER_CONFIG={"title":"05-02. 추가 기성품의 이해","deck":"../marp/05-02-standard-components.html","scripts":["<h2>오프닝</h2>\n<p>안녕하세요. 이번 영상에서는 추가 기성품의 이해에 대해 알아보겠습니다.</p>\n\n<p>핵심 개념을 실제 기계 설계와 제작 과정에 어떻게 적용하는지 순서대로 살펴보겠습니다.</p>","<h2>05-02. 추가 기성품의 이해</h2>\n<p class=\"screen\">[화면] 05-02. 추가 기성품의 이해</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 추가 기성품의 이해에 대해 살펴보겠습니다.</p>\n\n<p>지금까지 우리는 재료, 3D 모델링, 2D 도면, 3D 프린팅, 레이저 커팅, 절삭 가공, 공차와 조립 방법까지 기계 설계의 기본적인 흐름을 살펴보았습니다.</p>\n\n<p>이제 마지막으로 실제 자동화 장비에서 자주 사용하는 다양한 기성품을 살펴보겠습니다.</p>\n\n<p>기계 설계에서는 모든 부품을 직접 제작하지 않습니다.</p>\n\n<p>이미 표준화되어 판매되는 기성품을 적절히 활용하면 설계 시간을 크게 줄이고, 신뢰성과 유지보수성을 높일 수 있습니다.</p>\n\n<p>이번 파트의 목적은 모든 부품의 세부 규격을 암기하는 것이 아닙니다.</p>\n\n<p>어떤 종류의 기성품이 존재하고, 각각 어떤 역할을 하는지 이해하는 것이 목적입니다.</p>\n\n<p>실제 설계에서는 필요한 순간에 제조사 카탈로그를 확인하고 규격을 선정하면 됩니다.</p>","<h2>구동 계열</h2>\n<p class=\"screen\">[화면] 구동 계열</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 구동 계열에 대해 살펴보겠습니다.</p>\n\n<p>구동 계열은 실제 장비를 움직이는 힘을 만드는 부품입니다.</p>\n\n<p>대표적으로 다음과 같은 장치가 있습니다.</p>\n\n<p>서보모터입니다.</p>\n\n<p>스테핑 모터입니다.</p>\n\n<p>BLDC 모터입니다.</p>\n\n<p>리니어 모터입니다.</p>\n\n<p>에어 실린더입니다.</p>\n\n<p>유압 실린더입니다.</p>\n\n<p>각 부품은 필요한 속도, 정밀도, 토크, 하중에 따라 선택합니다.</p>","<h2>서보모터</h2>\n<p class=\"screen\">[화면] 서보모터</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 서보모터에 대해 살펴보겠습니다.</p>\n\n<p>서보모터는 엔코더를 이용하여 실제 위치와 속도를 확인하면서 제어하는 폐루프(Closed-loop) 방식의 모터입니다.</p>\n\n<p>주요 특징은 다음과 같습니다.</p>\n\n<p>위치 제어 가능입니다.</p>\n\n<p>속도 제어 가능입니다.</p>\n\n<p>토크 제어 가능입니다.</p>\n\n<p>반복 정밀도가 높음입니다.</p>\n\n<p>고속 응답 가능입니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>CNC입니다.</p>\n\n<p>산업용 로봇입니다.</p>\n\n<p>반도체 장비입니다.</p>\n\n<p>정밀 위치 제어 장비입니다.</p>\n\n<p>정밀도와 성능이 뛰어난 대신 가격이 높고 드라이브 설정과 튜닝이 필요합니다.</p>","<h2>스테핑 모터</h2>\n<p class=\"screen\">[화면] 스테핑 모터</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 스테핑 모터에 대해 살펴보겠습니다.</p>\n\n<p>스테핑 모터는 입력되는 펄스 수에 따라 일정한 각도씩 회전하는 모터입니다.</p>\n\n<p>일반적인 구성에서는 별도의 엔코더 없이 Open-loop 방식으로 위치를 제어할 수 있습니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>3D 프린터입니다.</p>\n\n<p>소형 CNC입니다.</p>\n\n<p>교육용 장비입니다.</p>\n\n<p>저하중 위치 제어 장치입니다.</p>\n\n<p>장점은 구조와 제어가 비교적 단순하고 가격이 저렴하다는 것입니다.</p>\n\n<p>다만 부하가 너무 크거나 급가속하면 실제 모터 위치가 명령 위치를 따라가지 못하는 탈조가 발생할 수 있습니다.</p>","<h2>BLDC 모터</h2>\n<p class=\"screen\">[화면] BLDC 모터</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 BLDC 모터에 대해 살펴보겠습니다.</p>\n\n<p>BLDC는 Brushless DC Motor의 약자로 브러시 없이 전자적으로 정류하는 모터입니다.</p>\n\n<p>주요 특징은 다음과 같습니다.</p>\n\n<p>높은 효율입니다.</p>\n\n<p>긴 수명입니다.</p>\n\n<p>고속 운전 가능입니다.</p>\n\n<p>브러시 마모 없음입니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용됩니다.</p>\n\n<p>팬입니다.</p>\n\n<p>펌프입니다.</p>\n\n<p>드론입니다.</p>\n\n<p>스핀들입니다.</p>\n\n<p>전기 이동 장치입니다.</p>\n\n<p>기본적으로 회전 구동에 매우 적합하지만 정밀 위치 제어가 필요하다면 엔코더와 적절한 제어기가 추가로 필요합니다.</p>","<h2>리니어 모터</h2>\n<p class=\"screen\">[화면] 리니어 모터</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리니어 모터에 대해 살펴보겠습니다.</p>\n\n<p>리니어 모터는 회전 운동을 별도의 기계 장치로 직선 운동으로 변환하지 않고 직접 직선 운동을 만들어 냅니다.</p>\n\n<p>볼스크류나 벨트와 같은 전달 구조가 필요하지 않기 때문에 백래시를 줄이고 매우 빠른 이동을 구현할 수 있습니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>반도체 장비입니다.</p>\n\n<p>고속 Pick &amp; Place입니다.</p>\n\n<p>정밀 검사 장비입니다.</p>\n\n<p>초정밀 위치 제어 시스템입니다.</p>\n\n<p>고속·고정밀이라는 장점이 있지만 가격과 제어 난이도가 높습니다.</p>","<h2>에어 실린더</h2>\n<p class=\"screen\">[화면] 에어 실린더</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 에어 실린더에 대해 살펴보겠습니다.</p>\n\n<p>에어 실린더는 압축 공기를 이용하여 직선 운동을 만드는 장치입니다.</p>\n\n<p>자동화 설비에서 매우 많이 사용하는 구동 부품 중 하나입니다.</p>\n\n<p>대표적인 용도는 다음과 같습니다.</p>\n\n<p>밀기입니다.</p>\n\n<p>당기기입니다.</p>\n\n<p>클램핑입니다.</p>\n\n<p>승강입니다.</p>\n\n<p>단순 반복 동작입니다.</p>\n\n<p>장점은 구조가 단순하고 동작 속도가 빠르며 가격이 비교적 저렴하다는 것입니다.</p>\n\n<p>반면 일반적인 구성에서는 정밀한 위치 제어가 어렵고 공압 공급 장치가 필요합니다.</p>","<h2>유압 실린더</h2>\n<p class=\"screen\">[화면] 유압 실린더</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 유압 실린더에 대해 살펴보겠습니다.</p>\n\n<p>유압 실린더는 오일의 압력을 이용하여 큰 힘을 만드는 장치입니다.</p>\n\n<p>대표적으로 다음과 같은 분야에서 사용합니다.</p>\n\n<p>프레스입니다.</p>\n\n<p>금형 장비입니다.</p>\n\n<p>중장비입니다.</p>\n\n<p>고하중 구동 장치입니다.</p>\n\n<p>매우 큰 힘을 만들 수 있다는 것이 가장 큰 장점입니다.</p>\n\n<p>반면 유압 펌프와 배관이 필요하고 누유와 유지보수 문제를 고려해야 합니다.</p>","<h2>동력 전달 계열</h2>\n<p class=\"screen\">[화면] 동력 전달 계열</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 동력 전달 계열에 대해 살펴보겠습니다.</p>\n\n<p>구동원이 힘을 만들었다면 그 힘을 실제 부품에 전달해야 합니다.</p>\n\n<p>대표적인 전달 부품은 다음과 같습니다.</p>\n\n<p>볼스크류입니다.</p>\n\n<p>타이밍 벨트입니다.</p>\n\n<p>체인과 스프로킷입니다.</p>\n\n<p>기어입니다.</p>\n\n<p>커플링입니다.</p>\n\n<p>감속기입니다.</p>","<h2>볼스크류</h2>\n<p class=\"screen\">[화면] 볼스크류</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 볼스크류에 대해 살펴보겠습니다.</p>\n\n<p>볼스크류는 모터의 회전 운동을 직선 운동으로 변환하는 장치입니다.</p>\n\n<p>나사산 사이에 볼이 순환하면서 마찰을 줄이기 때문에 일반적인 나사 구조보다 높은 효율과 정밀도를 얻을 수 있습니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>CNC입니다.</p>\n\n<p>반도체 장비입니다.</p>\n\n<p>정밀 위치 제어입니다.</p>\n\n<p>서보모터 기반 이송축입니다.</p>\n\n<p>정밀도가 높고 백래시를 매우 작게 만들 수 있지만 가격이 높고 윤활 관리가 필요합니다.</p>","<h2>타이밍 벨트</h2>\n<p class=\"screen\">[화면] 타이밍 벨트</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 타이밍 벨트에 대해 살펴보겠습니다.</p>\n\n<p>타이밍 벨트는 벨트와 풀리의 톱니가 맞물리면서 동력을 전달하는 방식입니다.</p>\n\n<p>일반 벨트와 달리 큰 미끄러짐 없이 회전을 전달할 수 있습니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>컨베이어입니다.</p>\n\n<p>XY Stage입니다.</p>\n\n<p>3D 프린터입니다.</p>\n\n<p>장거리 이송 장치입니다.</p>\n\n<p>장점은 가볍고 빠르며 가격이 비교적 저렴하다는 것입니다.</p>\n\n<p>반면 장시간 사용하면 벨트가 늘어날 수 있으므로 장력 관리가 중요합니다.</p>","<h2>체인과 스프로킷</h2>\n<p class=\"screen\">[화면] 체인과 스프로킷</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 체인과 스프로킷에 대해 살펴보겠습니다.</p>\n\n<p>체인과 스프로킷은 체인의 링크와 스프로킷의 톱니를 이용하여 동력을 전달합니다.</p>\n\n<p>타이밍 벨트보다 무겁고 소음이 크지만 높은 하중과 큰 토크를 전달하기에 유리합니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용됩니다.</p>\n\n<p>중하중 컨베이어입니다.</p>\n\n<p>리프트입니다.</p>\n\n<p>산업용 이송 장비입니다.</p>\n\n<p>오염이나 충격이 많은 환경입니다.</p>\n\n<p>주기적인 윤활과 장력 관리가 필요합니다.</p>","<h2>기어</h2>\n<p class=\"screen\">[화면] 기어</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기어에 대해 살펴보겠습니다.</p>\n\n<p>기어는 서로 맞물리는 톱니를 이용하여 회전력과 속도를 전달합니다.</p>\n\n<p>기어의 종류에 따라 다양한 기능을 구현할 수 있습니다.</p>\n\n<p>스퍼기어</p>\n\n<p>직선 형태의 톱니를 가진 가장 기본적인 기어입니다.</p>\n\n<p>구조 단순입니다.</p>\n\n<p>효율 높음입니다.</p>\n\n<p>제작 비교적 쉬움입니다.</p>","<h2>접촉이 부드러움</h2>\n<p class=\"screen\">[화면] 접촉이 부드러움</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>헬리컬 기어</p>\n\n<p>톱니가 비스듬하게 형성되어 있습니다.</p>\n\n<p>접촉이 부드러움입니다.</p>\n\n<p>소음과 진동이 적음입니다.</p>\n\n<p>산업용 감속기에 많이 사용입니다.</p>","<h2>베벨 기어</h2>\n<p class=\"screen\">[화면] 베벨 기어</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>베벨 기어</p>\n\n<p>서로 다른 방향의 축 사이에서 회전을 전달합니다.</p>\n\n<p>주로 축 방향을 변경할 때 사용합니다.</p>","<h2>큰 감속비 구현 가능</h2>\n<p class=\"screen\">[화면] 큰 감속비 구현 가능</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>웜 기어</p>\n\n<p>웜과 웜휠이 맞물리는 구조입니다.</p>\n\n<p>큰 감속비 구현 가능입니다.</p>\n\n<p>축 방향 변경 가능입니다.</p>\n\n<p>구조에 따라 역구동이 어렵기도 함입니다.</p>","<h2>랙 &amp; 피니언</h2>\n<p class=\"screen\">[화면] 랙 &amp; 피니언</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>랙 &amp; 피니언</p>\n\n<p>원형 기어인 피니언과 직선형 기어인 랙을 결합한 구조입니다.</p>\n\n<p>회전 운동을 직선 운동으로 변환할 때 사용합니다.</p>\n\n<p>기어는 정밀하게 맞물려야 하기 때문에 백래시, 윤활, 가공 정밀도를 함께 고려해야 합니다.</p>","<h2>커플링</h2>\n<p class=\"screen\">[화면] 커플링</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 커플링에 대해 살펴보겠습니다.</p>\n\n<p>커플링은 두 개의 회전축을 연결하여 회전력을 전달하는 부품입니다.</p>\n\n<p>대표적으로 모터 축과 볼스크류, 펌프, 감속기 등의 축을 연결할 때 사용합니다.</p>\n\n<p>주요 종류는 다음과 같습니다.</p>\n\n<p>리지드 커플링</p>\n\n<p>두 축을 강체로 연결합니다.</p>\n\n<p>높은 강성입니다.</p>\n\n<p>구조 단순입니다.</p>\n\n<p>두 축의 정렬 정확도가 중요</p>","<h2>조립 오차 허용</h2>\n<p class=\"screen\">[화면] 조립 오차 허용</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>플렉시블 커플링</p>\n\n<p>약간의 축 정렬 오차를 흡수할 수 있습니다.</p>\n\n<p>조립 오차 허용입니다.</p>\n\n<p>진동 흡수 가능입니다.</p>\n\n<p>구조에 따라 비틀림 강성이 낮아질 수 있음입니다.</p>\n\n<p>커플링을 선정할 때는 축 직경뿐만 아니라 허용 토크와 회전 속도도 확인해야 합니다.</p>","<h2>감속기</h2>\n<p class=\"screen\">[화면] 감속기</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 감속기에 대해 살펴보겠습니다.</p>\n\n<p>감속기는 모터의 회전 속도를 낮추고 토크를 증가시키는 장치입니다.</p>\n\n<p>기본적인 관계는 다음과 같습니다.</p>\n\n<p>속도 감소</p>\n\n<p>↓</p>\n\n<p>토크 증가</p>\n\n<p>자동화에서는 모터 단독으로 필요한 토크를 얻기 어렵거나 더 정밀한 움직임이 필요한 경우 감속기를 사용합니다.</p>\n\n<p>대표적인 종류는 다음과 같습니다.</p>","<h2>높은 효율</h2>\n<p class=\"screen\">[화면] 높은 효율</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>유성 감속기</p>\n\n<p>높은 효율입니다.</p>\n\n<p>비교적 작은 크기입니다.</p>\n\n<p>서보모터와 많이 조합입니다.</p>","<h2>매우 작은 백래시</h2>\n<p class=\"screen\">[화면] 매우 작은 백래시</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>하모닉 감속기</p>\n\n<p>매우 작은 백래시입니다.</p>\n\n<p>높은 감속비입니다.</p>\n\n<p>로봇 관절 등에 많이 사용입니다.</p>\n\n<p>감속기는 자동화 장비의 성능과 가격에 큰 영향을 주는 부품 중 하나입니다.</p>","<h2>높은 감속비</h2>\n<p class=\"screen\">[화면] 높은 감속비</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>싸이클로이드 감속기</p>\n\n<p>높은 감속비입니다.</p>\n\n<p>높은 토크와 충격 하중에 강함입니다.</p>\n\n<p>백래시가 작음입니다.</p>\n\n<p>산업용 로봇 관절 등에 많이 사용입니다.</p>","<h2>직선 운동 계열</h2>\n<p class=\"screen\">[화면] 직선 운동 계열</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 직선 운동 계열에 대해 살펴보겠습니다.</p>\n\n<p>직선으로 움직이는 장비에서는 구동장치와 함께 이동 방향을 정확하게 잡아주는 가이드가 필요합니다.</p>\n\n<p>대표적인 부품은 다음과 같습니다.</p>\n\n<p>LM 가이드입니다.</p>\n\n<p>리니어 베어링입니다.</p>\n\n<p>크로스 롤러 가이드입니다.</p>\n\n<p>리니어 액추에이터입니다.</p>","<h2>LM 가이드</h2>\n<p class=\"screen\">[화면] LM 가이드</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 LM 가이드에 대해 살펴보겠습니다.</p>\n\n<p>LM 가이드는 레일과 블록으로 구성된 대표적인 직선 운동 부품입니다.</p>\n\n<p>LM 블록 내부의 볼이 순환하면서 레일 위를 움직이므로 낮은 마찰과 높은 정밀도를 얻을 수 있습니다.</p>\n\n<p>대표적으로 다음과 같은 장비에서 사용됩니다.</p>\n\n<p>CNC입니다.</p>\n\n<p>반도체 장비입니다.</p>\n\n<p>자동화 장비입니다.</p>\n\n<p>로봇 직선축입니다.</p>\n\n<p>높은 정밀도와 강성을 가지고 있지만 설치면의 평탄도와 레일 정렬이 중요합니다.</p>","<h2>리니어 베어링</h2>\n<p class=\"screen\">[화면] 리니어 베어링</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리니어 베어링에 대해 살펴보겠습니다.</p>\n\n<p>리니어 베어링은 원형 샤프트를 따라 직선으로 움직이는 구조입니다.</p>\n\n<p>LM 가이드보다 단순하고 가격이 저렴합니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용합니다.</p>\n\n<p>교육용 키트입니다.</p>\n\n<p>DIY 장비입니다.</p>\n\n<p>3D 프린터입니다.</p>\n\n<p>저하중 직선 이동 구조입니다.</p>\n\n<p>정밀도와 강성은 LM 가이드보다 낮지만 간단한 장비를 만들 때 매우 유용합니다.</p>","<h2>크로스 롤러 가이드</h2>\n<p class=\"screen\">[화면] 크로스 롤러 가이드</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 크로스 롤러 가이드에 대해 살펴보겠습니다.</p>\n\n<p>크로스 롤러 가이드는 롤러를 교차 방향으로 배열하여 높은 강성과 정밀도를 얻는 직선 운동 장치입니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>초정밀 검사 장비입니다.</p>\n\n<p>광학 장비입니다.</p>\n\n<p>반도체 장비입니다.</p>\n\n<p>측정 시스템입니다.</p>\n\n<p>정밀도는 매우 높지만 가격이 높고 오염 관리가 중요합니다.</p>","<h2>리니어 액추에이터</h2>\n<p class=\"screen\">[화면] 리니어 액추에이터</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리니어 액추에이터에 대해 살펴보겠습니다.</p>\n\n<p>리니어 액추에이터는 LM 가이드와 구동부, 모터 등을 하나의 모듈로 구성한 완성형 직선 운동 장치입니다.</p>\n\n<p>구동 방식은 제품에 따라 다음과 같이 나뉩니다.</p>\n\n<p>볼스크류입니다.</p>\n\n<p>타이밍 벨트입니다.</p>\n\n<p>장점은 설계와 조립 시간을 크게 줄일 수 있다는 것입니다.</p>\n\n<p>직접 LM 가이드와 볼스크류를 정렬하지 않아도 제조사가 완성된 상태로 공급하기 때문에 빠르게 장비를 개발할 수 있습니다.</p>","<h2>구조 및 기구 요소</h2>\n<p class=\"screen\">[화면] 구조 및 기구 요소</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 구조 및 기구 요소에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비의 구조를 만들 때는 다음과 같은 기성품도 많이 사용합니다.</p>\n\n<p>알루미늄 프로파일입니다.</p>\n\n<p>힌지입니다.</p>\n\n<p>샤프트입니다.</p>\n\n<p>베어링입니다.</p>\n\n<p>리니어 샤프트 서포트입니다.</p>","<h2>알루미늄 프로파일</h2>\n<p class=\"screen\">[화면] 알루미늄 프로파일</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 알루미늄 프로파일에 대해 살펴보겠습니다.</p>\n\n<p>알루미늄 프로파일은 T-Slot 구조를 가진 조립형 프레임 소재입니다.</p>\n\n<p>볼트와 브라켓을 이용하여 용접 없이 빠르게 구조물을 만들 수 있습니다.</p>\n\n<p>대표적인 사용 분야는 다음과 같습니다.</p>\n\n<p>자동화 장비 프레임입니다.</p>\n\n<p>교육용 키트입니다.</p>\n\n<p>안전 커버 프레임입니다.</p>\n\n<p>시제품입니다.</p>\n\n<p>구조 변경과 분해가 쉽다는 장점이 있습니다.</p>\n\n<p>다만 같은 크기의 철 구조물에 비해 강성이 낮을 수 있으므로 큰 하중이나 진동이 발생하는 장비에서는 적절한 규격을 선정해야 합니다.</p>","<h2>힌지</h2>\n<p class=\"screen\">[화면] 힌지</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 힌지에 대해 살펴보겠습니다.</p>\n\n<p>힌지는 두 부품 사이에서 회전 운동을 허용하는 간단한 기계 요소입니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용합니다.</p>\n\n<p>안전 도어입니다.</p>\n\n<p>커버입니다.</p>\n\n<p>접이식 구조입니다.</p>\n\n<p>설치는 간단하지만 힌지 축의 위치가 맞지 않으면 문이 원활하게 움직이지 않을 수 있으므로 정렬이 중요합니다.</p>","<h2>샤프트와 베어링</h2>\n<p class=\"screen\">[화면] 샤프트와 베어링</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 샤프트와 베어링에 대해 살펴보겠습니다.</p>\n\n<p>샤프트는 회전력을 전달하는 축이고 베어링은 샤프트를 지지하면서 원활하게 회전하도록 도와주는 부품입니다.</p>\n\n<p>자동화에서는 다음과 같은 구조에서 매우 자주 사용합니다.</p>\n\n<p>컨베이어 롤러입니다.</p>\n\n<p>회전축입니다.</p>\n\n<p>풀리입니다.</p>\n\n<p>기어입니다.</p>\n\n<p>모터 출력축입니다.</p>\n\n<p>샤프트와 베어링을 설계할 때는 축 정렬과 끼워맞춤 공차가 중요합니다.</p>","<h2>리니어 샤프트 서포트</h2>\n<p class=\"screen\">[화면] 리니어 샤프트 서포트</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리니어 샤프트 서포트에 대해 살펴보겠습니다.</p>\n\n<p>리니어 샤프트 서포트는 원형 샤프트를 프레임이나 플레이트에 고정하는 부품입니다.</p>\n\n<p>리니어 베어링과 함께 저렴한 직선 운동 구조를 만들 때 사용합니다.</p>\n\n<p>장거리 샤프트는 가운데가 휘어질 수 있으므로 길이와 하중에 따라 적절한 지지 구조가 필요합니다.</p>","<h2>케이블 및 보호 계열</h2>\n<p class=\"screen\">[화면] 케이블 및 보호 계열</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 케이블 및 보호 계열에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비에서는 기계가 움직이는 동안 케이블도 함께 움직이는 경우가 많습니다.</p>\n\n<p>이때 케이블이 꼬이거나 반복적으로 꺾이지 않도록 보호하기 위한 기성품을 사용합니다.</p>\n\n<p>대표적으로 다음과 같습니다.</p>\n\n<p>케이블 베어입니다.</p>\n\n<p>슬립링입니다.</p>\n\n<p>케이블 글랜드입니다.</p>","<h2>케이블 베어</h2>\n<p class=\"screen\">[화면] 케이블 베어</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 케이블 베어에 대해 살펴보겠습니다.</p>\n\n<p>케이블 베어 또는 Cable Carrier는 이동하는 축을 따라 케이블을 일정한 경로로 유도합니다.</p>\n\n<p>주요 역할은 다음과 같습니다.</p>\n\n<p>케이블 꺾임 방지입니다.</p>\n\n<p>마모 방지입니다.</p>\n\n<p>이동 경로 정리입니다.</p>\n\n<p>케이블 수명 향상입니다.</p>\n\n<p>CNC, 로봇, 갠트리 등의 이동 축에서 쉽게 볼 수 있습니다.</p>\n\n<p>케이블을 선정할 때는 케이블 베어가 허용하는 최소 굴곡 반경을 확인해야 합니다.</p>","<h2>슬립링</h2>\n<p class=\"screen\">[화면] 슬립링</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 슬립링에 대해 살펴보겠습니다.</p>\n\n<p>슬립링은 회전하는 구조물에 전원이나 전기 신호를 전달하기 위한 장치입니다.</p>\n\n<p>일반 케이블을 계속 회전시키면 케이블이 꼬이지만 슬립링을 사용하면 연속 회전이 가능합니다.</p>\n\n<p>대표적으로 다음과 같은 곳에 사용됩니다.</p>\n\n<p>회전 테이블입니다.</p>\n\n<p>로봇 회전축입니다.</p>\n\n<p>360° 이상 연속 회전 장치입니다.</p>\n\n<p>전기적 특성이 중요한 부품이므로 자세한 내용은 이후 전기·전자 과정에서 다루는 것이 좋습니다.</p>","<h2>케이블 글랜드</h2>\n<p class=\"screen\">[화면] 케이블 글랜드</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 케이블 글랜드에 대해 살펴보겠습니다.</p>\n\n<p>케이블 글랜드는 케이블이 판넬이나 박스를 통과하는 부분에서 케이블을 고정하고 외부 환경을 차단하는 부품입니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용합니다.</p>\n\n<p>전기 판넬입니다.</p>\n\n<p>제어함입니다.</p>\n\n<p>야외 장비입니다.</p>\n\n<p>케이블 외경에 맞는 규격을 사용해야 하며 적절하게 체결해야 방수와 방진 성능을 유지할 수 있습니다.</p>","<h2>위치 및 속도 측정 부품</h2>\n<p class=\"screen\">[화면] 위치 및 속도 측정 부품</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 위치 및 속도 측정 부품에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비에서는 움직임을 만드는 것뿐만 아니라 현재 위치와 속도를 확인하는 것도 중요합니다.</p>\n\n<p>대표적으로 다음과 같은 센서가 있습니다.</p>\n\n<p>로터리 엔코더입니다.</p>\n\n<p>리니어 엔코더입니다.</p>\n\n<p>와이어 엔코더입니다.</p>\n\n<p>홀 센서입니다.</p>\n\n<p>이 부품들은 전기적 신호를 사용하기 때문에 자세한 원리는 이후 전기·전자 과정에서 다룹니다.</p>\n\n<p>이번 과정에서는 기계적으로 어디에 설치되는지 정도만 이해하면 충분합니다.</p>","<h2>로터리 엔코더</h2>\n<p class=\"screen\">[화면] 로터리 엔코더</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 로터리 엔코더에 대해 살펴보겠습니다.</p>\n\n<p>로터리 엔코더는 축의 회전 위치를 전기 신호로 변환하는 장치입니다.</p>\n\n<p>주로 모터 축에 장착하여 다음 정보를 확인합니다.</p>\n\n<p>회전 위치입니다.</p>\n\n<p>회전 속도입니다.</p>\n\n<p>회전 방향입니다.</p>\n\n<p>대표적으로 인크리멘탈 방식과 앱솔루트 방식이 있습니다.</p>","<h2>리니어 엔코더</h2>\n<p class=\"screen\">[화면] 리니어 엔코더</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 리니어 엔코더에 대해 살펴보겠습니다.</p>\n\n<p>리니어 엔코더는 회전축이 아니라 실제 직선 이동 위치를 직접 측정합니다.</p>\n\n<p>따라서 볼스크류나 감속기에서 발생하는 기계적 오차까지 포함한 실제 위치를 확인할 수 있습니다.</p>\n\n<p>고정밀 CNC와 반도체 장비 등에 사용됩니다.</p>","<h2>감지 센서</h2>\n<p class=\"screen\">[화면] 감지 센서</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 감지 센서에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비에서는 제품이나 기계 부품의 존재 여부와 위치를 확인하기 위해 다양한 센서를 사용합니다.</p>\n\n<p>대표적으로 다음과 같습니다.</p>\n\n<p>근접센서입니다.</p>\n\n<p>포토센서입니다.</p>\n\n<p>리미트 스위치입니다.</p>\n\n<p>온도센서입니다.</p>\n\n<p>비전 카메라입니다.</p>\n\n<p>이 역시 자세한 전기적 동작은 이후 전기·전자 과정에서 다루고, 여기에서는 장착 구조와 사용 목적만 간단히 알아봅니다.</p>","<h2>모듈화된 기성품</h2>\n<p class=\"screen\">[화면] 모듈화된 기성품</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 모듈화된 기성품에 대해 살펴보겠습니다.</p>\n\n<p>최근 자동화 설계에서는 각각의 부품을 직접 조합하기보다 여러 기계 요소가 이미 조립된 완성형 모듈을 사용하는 경우도 많습니다.</p>\n\n<p>대표적으로 다음과 같습니다.</p>\n\n<p>리니어 액추에이터입니다.</p>\n\n<p>XYZ Stage입니다.</p>\n\n<p>Gantry System입니다.</p>\n\n<p>Robot Arm입니다.</p>\n\n<p>이러한 모듈을 사용하면 초기 비용은 올라갈 수 있지만 설계와 조립 시간을 크게 줄일 수 있습니다.</p>","<h2>XYZ 스테이지</h2>\n<p class=\"screen\">[화면] XYZ 스테이지</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 XYZ 스테이지에 대해 살펴보겠습니다.</p>\n\n<p>XYZ 스테이지는 X, Y, Z 세 개의 직선축을 하나의 시스템으로 구성한 장치입니다.</p>\n\n<p>대표적으로 다음과 같은 장비에 사용합니다.</p>\n\n<p>검사 장비입니다.</p>\n\n<p>디스펜싱입니다.</p>\n\n<p>레이저 가공입니다.</p>\n\n<p>반복 위치 이동 장치입니다.</p>\n\n<p>이미 각 축의 정렬이 완료된 상태로 제공되기 때문에 사용자는 모터와 제어 시스템을 연결하는 데 집중할 수 있습니다.</p>","<h2>갠트리 시스템</h2>\n<p class=\"screen\">[화면] 갠트리 시스템</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 갠트리 시스템에 대해 살펴보겠습니다.</p>\n\n<p>갠트리 시스템은 큰 프레임 위에서 X, Y 또는 XYZ 방향으로 움직이는 구조입니다.</p>\n\n<p>대표적으로 다음과 같은 곳에서 사용합니다.</p>\n\n<p>물류 이송입니다.</p>\n\n<p>대형 패널 이송입니다.</p>\n\n<p>창고 자동화입니다.</p>\n\n<p>대형 Pick &amp; Place입니다.</p>\n\n<p>작업 범위를 크게 만들 수 있지만 구조물이 길어질수록 처짐과 진동을 고려해야 합니다.</p>","<h2>로봇 암</h2>\n<p class=\"screen\">[화면] 로봇 암</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 로봇 암에 대해 살펴보겠습니다.</p>\n\n<p>로봇 암은 여러 개의 회전 관절을 이용하여 공간에서 다양한 위치와 자세를 만들 수 있는 장치입니다.</p>\n\n<p>대표적으로 다음과 같은 작업에 사용합니다.</p>\n\n<p>용접입니다.</p>\n\n<p>조립입니다.</p>\n\n<p>Pick &amp; Place입니다.</p>\n\n<p>머신 텐딩입니다.</p>\n\n<p>비전 기반 작업입니다.</p>\n\n<p>일반적인 직교축보다 구조와 제어가 복잡하지만 매우 다양한 작업에 대응할 수 있다는 장점이 있습니다.</p>","<h2>안전 관련 부품</h2>\n<p class=\"screen\">[화면] 안전 관련 부품</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 안전 관련 부품에 대해 살펴보겠습니다.</p>\n\n<p>자동화 장비에는 작업자를 보호하기 위한 다양한 안전 장치가 사용됩니다.</p>\n\n<p>대표적으로 다음과 같습니다.</p>\n\n<p>비상 정지 스위치입니다.</p>\n\n<p>라이트 커튼입니다.</p>\n\n<p>안전 도어 스위치입니다.</p>\n\n<p>이 부품들은 기계적인 장착 구조도 중요하지만 안전 회로와 전기 제어가 핵심이므로 자세한 내용은 이후 전기·제어 과정에서 다루는 것이 좋습니다.</p>\n\n<p>이번 단계에서는 장비 설계 시 이러한 부품을 설치할 공간과 위치를 반드시 고려해야 한다는 점만 이해하면 충분합니다.</p>","<h2>기성품을 선택할 때 생각해야 할 것</h2>\n<p class=\"screen\">[화면] 기성품을 선택할 때 생각해야 할 것</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기성품을 선택할 때 생각해야 할 것에 대해 살펴보겠습니다.</p>\n\n<p>기성품을 선택할 때는 단순히 크기만 맞으면 되는 것이 아닙니다.</p>\n\n<p>다음과 같은 사항을 함께 확인해야 합니다.</p>\n\n<p>허용 하중입니다.</p>\n\n<p>정격 토크입니다.</p>\n\n<p>이동 속도입니다.</p>\n\n<p>Stroke입니다.</p>\n\n<p>정밀도입니다.</p>\n\n<p>반복 정밀도입니다.</p>\n\n<p>설치 방법입니다.</p>\n\n<p>유지보수 방법입니다.</p>\n\n<p>가격입니다.</p>\n\n<p>납기입니다.</p>\n\n<p>제조사 CAD 데이터 제공 여부입니다.</p>\n\n<p>예를 들어 LM 가이드는 길이만 맞추는 것이 아니라 블록의 허용 하중과 모멘트 하중을 확인해야 합니다.</p>\n\n<p>모터 역시 크기만 보고 선정하는 것이 아니라 토크와 속도를 확인해야 합니다.</p>\n\n<p>즉, 기성품 선정 역시 하나의 설계 작업입니다.</p>","<h2>기성품을 직접 만들지 않는 이유</h2>\n<p class=\"screen\">[화면] 기성품을 직접 만들지 않는 이유</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 기성품을 직접 만들지 않는 이유에 대해 살펴보겠습니다.</p>\n\n<p>우리가 지금까지 3D 프린터와 CNC, 레이저 커팅을 배웠다고 해서 모든 부품을 직접 제작하는 것이 좋은 것은 아닙니다.</p>\n\n<p>예를 들어 베어링을 3D 프린터로 직접 만들 수도 있습니다.</p>\n\n<p>하지만 대량 생산되는 일반 베어링은 매우 저렴하면서 훨씬 높은 정밀도를 가지고 있습니다.</p>\n\n<p>LM 가이드나 모터, 엔코더 역시 마찬가지입니다.</p>\n\n<p>따라서 다음과 같은 판단이 필요합니다.</p>\n\n<p>직접 설계해야 하는가?</p>\n\n<p>↓</p>\n\n<p>기성품이 존재하는가?</p>\n\n<p>↓</p>\n\n<p>가격과 성능은 적절한가?</p>\n\n<p>↓</p>\n\n<p>기성품을 사용할 수 있다면 선정</p>\n\n<p>↓</p>\n\n<p>기성품을 장착할 구조만 직접 설계</p>\n\n<p>이러한 접근이 실제 설계에서 훨씬 효율적입니다.</p>","<h2>이번 챕터에서 기억해야 할 핵심</h2>\n<p class=\"screen\">[화면] 이번 챕터에서 기억해야 할 핵심</p>\n\n<p class=\"narration-label\">[내레이션]</p>\n\n<p>먼저 이번 챕터에서 기억해야 할 핵심에 대해 살펴보겠습니다.</p>\n\n<p>기계 설계 실력은 CAD 프로그램을 얼마나 잘 사용하는지만으로 결정되지 않습니다.</p>\n\n<p>기계 설계자는 다음 내용을 함께 알고 있어야 합니다.</p>\n\n<p>어떤 기성품이 존재하는가?입니다.</p>\n\n<p>그 기성품은 어떤 역할을 하는가?입니다.</p>\n\n<p>어떤 상황에서 사용하는가?입니다.</p>\n\n<p>어떤 규격을 선택해야 하는가?입니다.</p>\n\n<p>다른 부품과 어떻게 연결해야 하는가?입니다.</p>\n\n<p>유지보수는 어떻게 하는가?입니다.</p>\n\n<p>특히 자동화 장비에서는 모터, 센서, LM 가이드, 볼스크류, 베어링, 알루미늄 프로파일과 같은 기성품을 조합하여 장비를 만드는 경우가 매우 많습니다.</p>\n\n<p>&gt; 모든 것을 직접 만드는 것이 설계 능력은 아닙니다.</p>\n\n<p>&gt;</p>\n\n<p>&gt;</p>\n\n<p>&gt; 필요한 기성품을 빠르게 찾고 적절하게 조합하는 것도 매우 중요한 설계 능력입니다.</p>\n\n<p>&gt;</p>\n\n<p>기성품에 대한 지식이 많아질수록 설계 속도는 빨라지고, 실제로 제작 가능한 구조를 만들기도 쉬워집니다.</p>\n\n<p>이제 남은 과정에서는 이러한 기성품을 실제로 조립하고 확인하기 위해 필요한 측정 도구와 수공구, 전동공구에 대해 살펴보겠습니다.</p>\n<h2>마무리</h2>\n<p>이번 영상에서는 추가 기성품의 이해의 핵심 내용을 살펴봤습니다.</p>\n\n<p>다음 내용에서는 오늘 확인한 개념을 실제 설계와 제작 과정에 연결해 보겠습니다. 시청해 주셔서 감사합니다.</p>"]};</script><script src="viewer.js"></script>
